<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QA Tool</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5;
           color: #222; font-size: 14px; height: 100vh; display: flex; flex-direction: column; }

    /* 상단 헤더 */
    .app-header { background: #1e3a5f; color: white; padding: 14px 28px;
                  display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .app-header h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.5px; }
    .app-header .step { font-size: 12px; opacity: 0.7; margin-left: auto; }

    /* 본문 */
    .app-body { flex: 1; overflow-y: auto; padding: 32px 40px; }

    /* 섹션 카드 */
    .card { background: white; border-radius: 10px; padding: 28px 32px;
            box-shadow: 0 1px 6px rgba(0,0,0,.08); margin-bottom: 20px; }
    .card-title { font-size: 17px; font-weight: 600; margin-bottom: 20px;
                  color: #1e3a5f; border-bottom: 2px solid #e8eef5; padding-bottom: 12px; }

    /* 버튼 */
    .btn { display: inline-block; padding: 10px 28px; border-radius: 6px;
           font-size: 14px; font-weight: 600; cursor: pointer; border: none;
           transition: background .15s; text-decoration: none; }
    .btn-primary { background: #1e3a5f; color: white; }
    .btn-primary:hover { background: #16304f; }
    .btn-secondary { background: #e8eef5; color: #1e3a5f; }
    .btn-secondary:hover { background: #d8e4f0; }
    .btn-danger { background: #e74c3c; color: white; }
    .btn-danger:hover { background: #c0392b; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* 선택 카드 그리드 */
    .select-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                   gap: 14px; margin-bottom: 24px; }
    .select-card { border: 2px solid #e0e0e0; border-radius: 8px; padding: 18px 20px;
                   cursor: pointer; transition: all .15s; position: relative; }
    .select-card:hover:not(.disabled) { border-color: #1e3a5f; background: #f5f8fc; }
    .select-card.selected { border-color: #1e3a5f; background: #eef3fa; }
    .select-card.disabled { opacity: 0.4; cursor: not-allowed; background: #f8f8f8; }
    .select-card .card-label { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
    .select-card .card-desc { font-size: 12px; color: #888; }
    .select-card .badge-coming { font-size: 11px; color: #aaa; margin-top: 6px; }
    .select-card.selected::after { content: "✓"; position: absolute; top: 10px; right: 12px;
                                    color: #1e3a5f; font-weight: 700; }

    /* 하단 버튼 영역 */
    .app-footer { padding: 16px 40px; background: white; border-top: 1px solid #eee;
                  display: flex; gap: 12px; justify-content: flex-end; flex-shrink: 0; }

  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <div class="app-header">
    <h1>🔍 QA Tool</h1>
    <span class="step">{% block step %}{% endblock %}</span>
  </div>
  <div class="app-body">
    {% block body %}{% endblock %}
  </div>
  <div class="app-footer">
    {% block footer %}{% endblock %}
  </div>
  {% block scripts %}{% endblock %}

</body>
</html>
