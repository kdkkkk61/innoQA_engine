<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QA Tool</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5;
           color: #222; font-size: 14px; height: 100vh; display: flex; flex-direction: column; }

    /* 상단 헤더 */
    .app-header { background: #1e3a5f; color: white; padding: 14px 28px;
                  display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .app-header h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.5px; }
    .app-header .step { font-size: 12px; opacity: 0.7; margin-left: auto; }

    /* 본문 */
    .app-body { flex: 1; overflow-y: auto; padding: 32px 40px; }

    /* 섹션 카드 */
    .card { background: white; border-radius: 10px; padding: 28px 32px;
            box-shadow: 0 1px 6px rgba(0,0,0,.08); margin-bottom: 20px; }
    .card-title { font-size: 17px; font-weight: 600; margin-bottom: 20px;
                  color: #1e3a5f; border-bottom: 2px solid #e8eef5; padding-bottom: 12px; }

    /* 버튼 */
    .btn { display: inline-block; padding: 10px 28px; border-radius: 6px;
           font-size: 14px; font-weight: 600; cursor: pointer; border: none;
           transition: background .15s; text-decoration: none; }
    .btn-primary { background: #1e3a5f; color: white; }
    .btn-primary:hover { background: #16304f; }
    .btn-secondary { background: #e8eef5; color: #1e3a5f; }
    .btn-secondary:hover { background: #d8e4f0; }
    .btn-danger { background: #e74c3c; color: white; }
    .btn-danger:hover { background: #c0392b; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* 선택 카드 그리드 */
    .select-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                   gap: 14px; margin-bottom: 24px; }
    .select-card { border: 2px solid #e0e0e0; border-radius: 8px; padding: 18px 20px;
                   cursor: pointer; transition: all .15s; position: relative; }
    .select-card:hover:not(.disabled) { border-color: #1e3a5f; background: #f5f8fc; }
    .select-card.selected { border-color: #1e3a5f; background: #eef3fa; }
    .select-card.disabled { opacity: 0.4; cursor: not-allowed; background: #f8f8f8; }
    .select-card .card-label { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
    .select-card .card-desc { font-size: 12px; color: #888; }
    .select-card .badge-coming { font-size: 11px; color: #aaa; margin-top: 6px; }
    .select-card.selected::after { content: "✓"; position: absolute; top: 10px; right: 12px;
                                    color: #1e3a5f; font-weight: 700; }

    /* 하단 버튼 영역 */
    .app-footer { padding: 16px 40px; background: white; border-top: 1px solid #eee;
                  display: flex; gap: 12px; justify-content: flex-end; flex-shrink: 0; }

    /* 백그라운드 실행 상태 배지 */
    #hdr-badge {
      display: none; align-items: center; gap: 8px;
      background: rgba(255,255,255,.15); border-radius: 20px;
      padding: 5px 14px; font-size: 12px; font-weight: 600; color: white;
      cursor: default; transition: background .2s;
    }
    #hdr-badge.done { background: rgba(39,174,96,.35); cursor: pointer; }
    #hdr-badge.done:hover { background: rgba(39,174,96,.55); }
    #hdr-badge .hdr-spinner {
      width: 12px; height: 12px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.4); border-top-color: white;
      animation: spin .8s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <div class="app-header">
    <h1>🔍 QA Tool</h1>
    <!-- 백그라운드 실행 상태 배지 (모든 화면 공통) -->
    <div id="hdr-badge" onclick="hdrBadgeClick()">
      <div class="hdr-spinner" id="hdr-spinner"></div>
      <span id="hdr-badge-text">테스트 실행 중...</span>
    </div>
    <span class="step">{% block step %}{% endblock %}</span>
  </div>
  <div class="app-body">
    {% block body %}{% endblock %}
  </div>
  <div class="app-footer">
    {% block footer %}{% endblock %}
  </div>
  {% block scripts %}{% endblock %}

  <!-- 백그라운드 실행 상태 폴링 (모든 화면 공통) -->
  <script>
  (function() {
    var badge   = document.getElementById('hdr-badge');
    var spinner = document.getElementById('hdr-spinner');
    var text    = document.getElementById('hdr-badge-text');
    var timer   = null;

    function showBadge(running) {
      badge.style.display = 'flex';
      if (running) {
        badge.classList.remove('done');
        spinner.style.display = '';
        text.textContent = '테스트 실행 중...';
      } else {
        badge.classList.add('done');
        spinner.style.display = 'none';
        text.textContent = '✅ 완료 — 리포트 보기';
      }
    }

    function hideBadge() {
      badge.style.display = 'none';
      badge.classList.remove('done');
    }

    function poll() {
      fetch('/status').then(function(r){ return r.json(); }).then(function(d) {
        if (d.status === 'running') {
          showBadge(true);
          timer = setTimeout(poll, 2000);
        } else if (d.status === 'done' || d.status === 'error') {
          localStorage.removeItem('qa_bg_running');
          if (d.status === 'done') {
            showBadge(false);
          } else {
            hideBadge();
          }
        } else {
          // idle
          hideBadge();
        }
      }).catch(function() {
        timer = setTimeout(poll, 3000);
      });
    }

    window.hdrBadgeClick = function() {
      if (badge.classList.contains('done')) {
        location.href = '/report';
      }
    };

    // 백그라운드 모드로 시작했거나 이미 실행 중이면 폴링 시작
    if (localStorage.getItem('qa_bg_running') === '1') {
      poll();
    } else {
      // 혹시 서버가 실행 중인 상태라면 배지 표시 (새로고침 대응)
      fetch('/status').then(function(r){ return r.json(); }).then(function(d) {
        if (d.status === 'running') showBadge(true), poll();
        else if (d.status === 'done') showBadge(false);
      }).catch(function(){});
    }
  })();
  </script>
</body>
</html>
