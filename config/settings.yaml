base_url: "http://192.168.13.141/#!/"

browser:
  headless: false        # true: 헤드리스(백그라운드), false: 브라우저 창 표시
  slow_mo: 500           # 액션 간 지연(ms) — Bootstrap 3 모달 애니메이션 대기용
  timeout: 30000         # 기본 타임아웃(ms)

selectors:
  login:
    username_input: "input#memberId"
    password_input: "input#password"
    submit_button:  "input#loginBtn"
