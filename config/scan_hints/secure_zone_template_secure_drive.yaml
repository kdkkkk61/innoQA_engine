# 시큐어존 템플릿 — 시큐어 드라이브 탭 : 방식 B (list_page + sc0 UIScanner)
#
# sc0(UIScanner phase=2)의 yaml↔DOM diff 입력 + 참조 메모.
# 메인 ADD 모달(addModifySecureZoneSecureDriveTemplate)을 스캔.
# ⚠️ 시큐어드라이브 항목은 '서브모달(addSecureDrive)'에 있어 메인 모달 스캔엔 안 잡힘 → 수동 sc2/sc3 에서 검증.
#    (서브모달 필드는 아래 sub_modal_ref 에 참조로만 기록 — UIScanner 자동 스캔 대상 아님)
#
# 수집: Chrome MCP 직접조작 (2026-06-23, 콘솔 192.168.13.141)

page_id: "secure_zone_template_secure_drive"
modal_id: "addModifySecureZoneSecureDriveTemplate"
scan_mode: "list_page"
detect_hidden: true   # 변경사항(숨김) 감지 opt-in — discovered_hidden (nPouch sc0 패턴)

# 모달 진입점
modal_trigger:
  add:    "button#addItemBtn"
  modify: "button#modifyItemBtn"

# 필수 입력 순서 (메인 모달, Chrome MCP 실측 2026-06-23)
# ⚠️ UIScanner(sc0)는 fill 값을 자체 생성하므로 step1(빈 제출)만 신뢰성 있게 실행 가능.
#    전체 순서(progressive 유효값 fill)는 sc2f 에서 통제 검증 — 아래는 '수집 기록'(주석).
#   step1 빈값            → "템플릿 이름을 입력해 주세요."
#   step2 +이름           → "반출드라이브 생성위치를 입력해 주세요."
#   step3 +반출경로       → "반출드라이브 문자를 입력해 주세요."
#   step4 +반출문자       → "반출드라이브 라벨을 입력해 주세요."
#   step5 +반출라벨(용량 빈값) → "COLUMN.NAME.TAKEOUT_DRIVE_QUOTA의 입력 가능 용량은 최소 100MB..." (★i18n 키 미번역 버그)
#   step6 +반출용량       → "시큐어드라이브를 등록해 주세요."
required_submit_sequence:
  - {step: 1, fill: [], expected_msg: "템플릿 이름을 입력해 주세요."}

# 텍스트 입력 (메인 모달)
text_inputs:
  - selector:   "input#templateName"
    label:      "템플릿 이름"
    maxlength:  100
    required:   true
    test_value: "[AUTO]_sztpl_sd_t"
    order:      10
  - selector:   "textarea#registOldDrive"
    label:      "예외 드라이브(문자, ; 구분)"
    maxlength:  null      # DOM 제한 없음 — 서버측
    required:   false
    order:      20
  - selector:   "input#takeoutDrivePath"
    label:      "반출 생성위치"
    maxlength:  300
    required:   true
    order:      30
  - selector:   "input#takeoutDriveLetter"
    label:      "반출 드라이브 문자"
    maxlength:  100
    required:   true
    order:      31
  - selector:   "input#takeoutDriveLabel"
    label:      "반출 드라이브 라벨"
    maxlength:  100
    required:   true
    order:      32
  - selector:   "input#takeoutDriveQuota"
    label:      "반출 드라이브 용량"
    maxlength:  20
    required:   true
    order:      33

# 체크박스 (메인 모달, 단독 — 종속 필드 없음)
plain_checkboxes:
  - selector: "input#isRegistEcmDrive"
    label:    "ECM드라이브 연동"
    default:  false
    order:    40
  - selector: "input#isTakeoutDrivePathHide"
    label:    "반출 폴더 숨김"
    default:  false
    order:    41

# 모달 액션 (저장 = '확인' 텍스트 버튼, btn-primary 아님)
modal_actions:
  submit_add:    "div#addModifySecureZoneSecureDriveTemplate.in button:has-text('확인')"
  submit_modify: "div#addModifySecureZoneSecureDriveTemplate.in button:has-text('확인')"
  close:         "div#addModifySecureZoneSecureDriveTemplate.in button:has-text('닫기')"

# ── 서브모달 참조 (UIScanner 스캔 대상 아님 — 수동 sc2/sc3 검증) ──────────
# addSecureDriveBtn → addSecureDrive 모달. '추가' 시 항목을 메인 리스트에 커밋 + 서브 자동 닫힘(실측).
sub_modal_ref:
  id: "addSecureDrive"
  trigger: "div#addModifySecureZoneSecureDriveTemplate.in button#addSecureDriveBtn"
  fields:
    - {id: secureDriveLabel,  label: "드라이브 라벨",   required: true}
    - {id: secureDriveLetter, label: "드라이브 문자",   required: true}
    - {id: secureDrivePath,   label: "생성위치",        required: true}
    - {id: isSecureDrivePathHide,       label: "생성위치 숨김",  type: checkbox}
    - {id: isSystemDriveWarningQuota,   label: "용량부족 경고",  type: checkbox, dependent: systemDriveWarningQuota}
    - {id: systemDriveWarningQuota,     label: "경고 용량(GB)",  type: text}
    - {id: secureDriveQuotaTypeWrite,   label: "용량방식 직접입력(WRITE)", type: radio, group: 용량방식, dependent: secureDriveQuota}
    - {id: secureDriveQuotaTypeSync,    label: "용량방식 잔여동기화(SYNC)", type: radio, group: 용량방식}
    - {id: secureDriveQuota, label: "용량(MB)", type: text}
    - {id: description,      label: "설명",     type: textarea}

# ── 속성(상세) 모달 참조 (sc5 표시검증용) ────────────────────────────────
detail_modal_ref:
  id: "detailSecureZoneTemplate"
  open: "행 td[1] 더블클릭"
  readonly: true
  note: "대부분 텍스트 표시. input 은 체크박스 2개(isRegistEcmDrive/isTakeoutDrivePathHide)뿐 → 값은 모달 텍스트로 대조."

# ── 저장 규칙 / 메시지 (실측) ────────────────────────────────────────────
save_rules:
  required_for_save: "이름 + 시큐어드라이브 항목 ≥1(서브) + 반출드라이브 4필드"
  messages:
    success: "저장 하였습니다."

# ── 명명 / cleanup 라이프사이클 (방식 B + 연계) ─────────────────────────
# 템플릿은 시큐어존 정책이 참조(연계) → [AUTO_<날짜>] KEEP 항목을 남겨 정책 테스트가 참조.
naming:
  volatile: "[AUTO]_sztpl_sd..."        # 휘발성 — sc5c cleanup 대상
  keep:     "[AUTO_0623]_sztpl_sd..."   # KEEP(연계용) — sc5c 보존, sc1 시작 시에만 전체 삭제
cleanup_lifecycle:
  sc1_start: "delete_all_test_data() — [AUTO]_ + [AUTO_<날짜>]_ 둘 다 (clean slate)"
  sc2_3_4:   "cleanup 없음 (재사용)"
  sc5c:      "delete_all_auto() — [AUTO]_ 만, [AUTO_<날짜>]_ 보존(연계)"
  sc6:       "TBD — [AUTO_<날짜>]_ 연계 또는 단일 정리"

# ── 시나리오별 방향성 (놓치면 안 될 테스트) ──────────────────────────────
test_directions:
  sc0: "UIScanner phase=2 — 메인 모달 yaml↔DOM 3종 변경감지(추가/삭제/숨김) + 명세 UI 자동검증"
  sc1: "툴바4 / 컬럼 / 메인·서브모달 열림닫힘 + sc1 시작 cleanup"
  sc2: "입력검증 동작(필수 빈값→경고, 추정금지) / maxlength(이름100) / default / 필수별표"
  sc3: |
    정상생성 / ★서브모달 시큐어드라이브 N건 추가(WRITE·SYNC) → 메인 리스트 / 중복 / 반출필수 / 항목삭제 / 용량방식 종속.
    ★형식 검증(전부 유효+시큐어드라이브 채운 상태 저장으로 확인): 반출 경로 'qwe'→저장됨(형식검증 없음, 버그) /
    반출 문자 '1'→저장됨(A-Z 검증 없음, 버그). 서브모달은 둘 다 차단(불일치). 직접조작 확정 2026-06-23.
  sc4: "저장값 로드→수정→재확인(sc3 미러) / 4-3 위반입력 결과"
  sc5: "속성-확인(추가→수정확인→속성표시검증, 텍스트대조) / [AUTO] cleanup, [AUTO_<날짜>] 보존"
  sc6: "TBD"
