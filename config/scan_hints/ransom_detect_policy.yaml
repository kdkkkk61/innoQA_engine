# ransom_detect_policy 페이지 스캔 힌트
# DOM 검증 완료 (2026-03-23) — Chrome Claude 직접 확인
# 휴리스틱보다 이 파일이 항상 우선 적용됨
#
# [구조 특이사항]
# - 이 모달은 Bootstrap tab-pane 미사용 (tabPanes=[])
# - 탭 전환은 AngularJS ng-show 방식 — 전체 DL이 DOM에 항상 존재
# - 두 번째 탭(예외처리 리스트)은 정책 등록 후 수정 모달에서만 UI 접근 가능
#   (추가 모달에서 탭 클릭 시 "정책 정보를 먼저 등록" 검증 다이얼로그 노출)
# - UIScanner는 count() 기반 검사 → DOM 존재 확인 가능 (visibility 무관)
#
# [order 규칙]
# - 실제 UI 상단→하단 시각적 위치 기준 (10단위 간격, 추가 여유 확보)
# - 정책정보 탭:  10~199
# - 예외처리 탭: 200~299
# - 제출 검증:   9999 (항상 마지막)
#
# [검증값 출처]
# - default: 실제 ADD 모달 최초 열림 상태에서 Chrome MCP 직접 확인 (2026-03-23)
# - label:   UI dt/label 텍스트 기준 (Chrome MCP 2026-03-23 재확인)
# - maxlength, onpaste_blocked: DOM 속성 직접 확인

page_id: "ransom_detect_policy"
modal_id: "addItemModal"

# 모달 진입점 — AngularJS ng-click 방식, data-toggle 없음
modal_trigger:
  add:    "button#addItemBtn"
  modify: "button#modifyItemBtn"

# 모달 내부 탭 구조 — 스캔 전 탭 순서대로 활성화 필요
# data_tab 값: a[data-tab="..."] 로 탭 링크 식별 (Bootstrap 비표준, AngularJS 커스텀)
modal_tabs:
  - tab_id:      "ransomCruncherDetectPolicyInfo"
    data_tab:    "ransomCruncherDetectPolicyInfo"
    label:       "정책 정보"
    start_order: 0           # order 0 ~ 199 항목은 이 탭 구간으로 출력

  - tab_id:      "ransomCruncherDetectPolicyExceptList"
    data_tab:    "ransomCruncherDetectPolicyExceptList"
    label:       "예외처리 리스트"
    start_order: 200         # order 200 ~ 항목은 이 탭 구간으로 출력
    # 추가 모달에서 이 탭 클릭 시 검증 다이얼로그 노출 (정책 저장 필요)

# ──────────────────────────────────────────────────────────────────────────────
# 필수 입력 순서 검증 (ADD 모달 전용)
# Chrome MCP 직접 테스트로 확인한 실제 앱 검증 순서 (2026-03-23)
#
# 동작 방식:
#   steps를 순서대로 실행 — 각 step에서 지정 필드만 채우고 submit_add 클릭
#   expected_msg와 실제 경고 메시지 일치 여부 검증
#   last step: 모든 필수 필드 채움 → expected: "success" (저장 성공)
#
# fill 항목: text_inputs/tag_input의 id 참조
# ──────────────────────────────────────────────────────────────────────────────
required_submit_sequence:
  # ── Step 0_dup: 중복 이름 등록 시도 (Phase 2 전용) ──────────────────────────
  # Phase 1에서 저장된 [AUTO]_detect_p1 이름으로 등록 시도 → 경고 확인
  # context_extra["existing_name"] = p1_name 으로 테스트 파일에서 주입
  - step:               "0_dup"
    description:        "중복 이름 등록 시도"
    fill_from_context:  "existing_name"     # context_extra["existing_name"] 값 사용
    fill_target:        "rcDetectPolicyName"
    fill_tag_before:    ["extension_input"] # 확장자 먼저 채워야 중복이름 경고 도달
    phases_only:        [2]                 # Phase 2 ADD 모달에서만 실행
    expected_type:      "any_warning"       # 어떤 경고든 출현하면 pass
    reset_after:        ["rcDetectPolicyName"]  # 제출 후 이름 필드 초기화
    reset_tag_after:    ["extension_input"] # fill_tag_before로 추가한 확장자 태그 제거
    missing_field:      "rcDetectPolicyName"
    missing_field_label: "정책 이름"

  - step:               1
    description:        "아무것도 입력 안 함"
    fill:               []
    expected_msg:       "정책 이름을 입력해 주세요."
    missing_field:      "rcDetectPolicyName"
    missing_field_label: "정책 이름"

  - step:               2
    description:        "정책 이름만 입력"
    fill:               ["rcDetectPolicyName"]
    expected_msg:       "보호할 확장자를 입력해 주세요."
    missing_field:      "extension_input"
    missing_field_label: "보호할 확장자"

  - step:          3
    description:   "정책 이름 + 확장자 입력"
    fill:          ["rcDetectPolicyName", "extension_input"]
    expected:      "success"

# ──────────────────────────────────────────────────────────────────────────────
# 텍스트 입력 (속성 + 동작 검증 대상)
# ──────────────────────────────────────────────────────────────────────────────
text_inputs:
  - selector:   "input#rcDetectPolicyName"
    label:      "정책 이름"
    maxlength:  20
    required:   true
    test_value: "[AUTO]_seq"   # required_submit_sequence 단계 테스트용 임시값
    tab:        "ransomCruncherDetectPolicyInfo"
    order:      10

# ──────────────────────────────────────────────────────────────────────────────
# 태그 입력 패턴
# protectExtensionList: DIV 컨테이너 (class="attachBox protectExtensionList")
# except_* 리스트: UL 컨테이너
# except_* 는 두 번째 탭에 위치 (DOM에는 항상 존재, AngularJS ng-show로 가시성 제어)
# required_toggle: 해당 탭 접근 전 활성화해야 하는 prerequisite 토글
#   (OFF 상태에서 탭 클릭 시 경고 다이얼로그 — ADD/EDIT 모달 공통)
# ──────────────────────────────────────────────────────────────────────────────
tag_input:
  - id:              "extension_input"
    label:           "보호할 확장자"
    input:           "input#protectExtension"
    add_btn:         "button#extensionAttachBtn"
    container:       "div#protectExtensionList"
    remove_btn:      "i.extentionDeleteBtn"   # 앱 오탈자 그대로: extEntion (Chrome MCP 확인)
    tab:             "ransomCruncherDetectPolicyInfo"
    required:        true
    test_value:      "txt"        # EDIT 모달: 정책 생성 시 이미 포함 → 중복 거부 테스트
    unique_test_value: "scan_ext" # ADD 모달 / EDIT에서 실제 추가 동작 테스트용 고유값
    test_empty_add:  true         # 빈값 추가 방지 확인
    order:           20

  - id:              "except_file_path"
    label:           "파일경로 예외처리"
    input:           "input#exceptFilePath"
    add_btn:         "button#addExceptFilePath"
    container:       "ul#exceptFilePathList"
    remove_btn:      "button.deleteBtn"   # Chrome MCP 확인 (2026-03-25): li > button.deleteBtn
    tab:             "ransomCruncherDetectPolicyExceptList"
    required_toggle: "input#isExceptDetect"
    test_value:      "C:\\scan_test_path"
    order:           200

  - id:              "except_process_path"
    label:           "프로세스경로 예외처리"
    input:           "input#exceptProcessPath"
    add_btn:         "button#addExceptProcessPath"
    container:       "ul#exceptProcessPathList"
    remove_btn:      "button.deleteBtn"   # Chrome MCP 확인 (2026-03-25): li > button.deleteBtn
    tab:             "ransomCruncherDetectPolicyExceptList"
    required_toggle: "input#isExceptDetect"
    test_value:      "scan_test.exe"
    order:           210

  - id:              "except_digital_sign"
    label:           "전자서명 예외처리"
    input:           "input#exceptDigitalSign"
    add_btn:         "button#addExceptDigitalSign"
    container:       "ul#exceptDigitalSignList"
    remove_btn:      "button.deleteBtn"   # Chrome MCP 확인 (2026-03-25): li > button.deleteBtn
    tab:             "ransomCruncherDetectPolicyExceptList"
    required_toggle: "input#isExceptDetect"
    test_value:      "scan_test_sign"
    order:           220

# ──────────────────────────────────────────────────────────────────────────────
# 일반 체크박스 (독립 동작 — toggle 종속 없음)
# default: ADD 모달 최초 열림 시 상태 (Chrome MCP 직접 확인, 2026-03-23)
# ──────────────────────────────────────────────────────────────────────────────
plain_checkboxes:
  - selector: "input#isSoftwareCertificate"
    label:    "소프트웨어 인증 사용"
    default:  false
    order:    30

  - selector: "input#isMssqlRemoteBlock"
    label:    "MS-SQL 원격 차단 해제"
    default:  false
    order:    50

  - selector: "input#isMsiFileTrustCheck"
    label:    "MSI 파일 신뢰성 검사 해제"
    default:  false
    order:    60

  - selector: "input#isHideTrayIcon"
    label:    "트레이아이콘 숨김"
    default:  false
    order:    130

# ──────────────────────────────────────────────────────────────────────────────
# 라디오 버튼 그룹
# default: null — ADD 모달 최초 열림 시 4개 옵션 모두 unchecked (Chrome MCP 확인)
#   사용자가 명시적으로 선택해야 하는 설계 (기본 선택값 없음)
# ──────────────────────────────────────────────────────────────────────────────
radio_groups:
  - name:            "behaviorDetectLevelType"
    label:           "행위기반 탐지등급 설정"
    default:         null
    require_default: true   # ADD 모달 초기값 없음 → 저장 시 암묵적으로 LOW 적용 (HE-01)
    order:           40
    options:
      - selector: "input#detectLevelTypeNone"
        value:    "NONE"
        label:    "사용안함"
      - selector: "input#detectLevelTypeLow"
        value:    "LOW"
        label:    "낮음"
      - selector: "input#detectLevelTypeMedium"
        value:    "MEDIUM"
        label:    "중간"
      - selector: "input#detectLevelTypeHigh"
        value:    "HIGH"
        label:    "높음"

# ──────────────────────────────────────────────────────────────────────────────
# 토글 체크박스
# default: ADD 모달 최초 열림 시 상태 (Chrome MCP 직접 확인, 2026-03-23) — 전체 false
# dependent_fields: 이 토글 ON 시 활성화되는 필드
# is_known_bug: true → 종속 필드 검증 실패 시 "fail" 대신 "known_bug" 기록
# ──────────────────────────────────────────────────────────────────────────────
toggle_checkboxes:
  - selector: "input#isExceptDetect"
    label:    "탐지 제외사항"
    default:  false
    order:    70
    dependent_fields:
      - selector: "input#isFilePathExcept"
        label:    "파일경로 예외처리"
        type:     "plain_checkbox"
      - selector: "input#isProcessPathExcept"
        label:    "프로세스경로 예외처리"
        type:     "plain_checkbox"
      - selector: "input#isDigitalSignExcept"
        label:    "전자서명 예외처리"
        type:     "plain_checkbox"

  - selector: "input#isRollbackUse"
    label:    "롤백 기능 사용"
    default:  false
    order:    80
    dependent_fields:
      - selector:  "input#rollbackFileMaxSize"
        label:     "복구 대상파일 최대용량"   # UI 텍스트 확인 (2026-03-23)
        type:      "number_input"
        maxlength: 5
      - selector:  "input#blockRollbackWaitMinute"
        label:     "차단 후 롤백 대기시간"    # UI 텍스트 확인 (2026-03-23)
        type:      "number_input"
        maxlength: 3

  - selector: "input#isBlockProcessIsolation"
    label:    "프로세스 격리기능"
    default:  false
    order:    90
    dependent_fields:
      - selector: "input#isRemoveIsolatedProcess"
        label:    "격리 프로세스 삭제"        # UI 텍스트 확인 (2026-03-23)
        type:     "plain_checkbox"

  - selector: "input#isExceptProcessCollectPeriod"
    label:    "예외 프로세스 수집 기간"
    default:  false
    order:    100
    dependent_fields:
      - selector: "input#exceptProcessCollectPeriod"
        label:    "수집 기간"                 # UI 텍스트 확인 (2026-03-23)
        type:     "number_input"
        # DOM type=text, maxlength/min/max 속성 없음
        # JS 클램핑: 0~15 (16 이상 → 15, 음수 → 부호 제거, 문자→0)
        # Chrome MCP 경계값 직접 테스트 확인 (2026-03-25)
        max: 15

  - selector: "input#isPolicyUpdateIntervalMinute"
    label:    "정책 갱신주기"
    default:  false
    order:    110
    dependent_fields:
      - selector:  "input#policyUpdateIntervalMinute"
        label:     "갱신 주기(분)"
        type:      "number_input"
        maxlength: 3

  - selector: "input#isAuthorizationPassword"
    label:    "인증 암호"
    default:  false
    order:    120
    is_known_bug: true   # OFF 상태에서도 종속 필드 disabled 속성 없음 (Chrome MCP 확인)
    dependent_fields:
      - selector:  "input#authorizationPassword"
        label:     "인증 암호"
        type:      "text_input"
        maxlength: 21
      - selector:         "input#authorizationPasswordConfirm"
        label:            "인증 암호 확인"
        type:             "text_input"
        maxlength:        21
        onpaste_blocked:  true   # onpaste="return false" DOM 확인

# ──────────────────────────────────────────────────────────────────────────────
# 오버플로 시나리오 (Phase 5)
# 태그 입력 영역에 매우 긴 값을 추가 후 등록 → 서버 오류 여부 확인
# Chrome MCP 실증 (2026-04-07): 500자 태그 추가 → 등록 즉시 "서버에서 오류가 발생 하였습니다."
# ──────────────────────────────────────────────────────────────────────────────
overflow_tests:
  confirm_modal: "div#__globalMessageModal.in"
  confirm_btn:   "div#__globalMessageModal button:has-text('확인')"
  cancel_btn:    "div#addItemModal button.btn-default"   # 닫기 버튼
  register_btn:  "button[add-btn]"

  cases:
    # ── 보호할 확장자 ──────────────────────────────────────────────
    - label:           "보호할 확장자 오버플로"
      overflow_length: 500
      tag_input:
        input:     "input#protectExtension"
        add_btn:   "button#extensionAttachBtn"
        container: "div#protectExtensionList"
      fill_required:
        - { selector: "input#rcDetectPolicyName", value: "[AUTO]_overflow" }
      order: 500

    # ── 파일경로 예외처리 ──────────────────────────────────────────
    # 예외처리 토글(isExceptDetect) ON 상태 필요
    # fill_required에서 toggle_on 타입으로 활성화 후 태그 추가
    - label:           "파일경로 예외처리 오버플로"
      overflow_length: 500
      tag_input:
        input:     "input#exceptFilePath"
        add_btn:   "button#addExceptFilePath"
        container: "ul#exceptFilePathList"
      fill_required:
        - { selector: "input#rcDetectPolicyName", value: "[AUTO]_overflow" }
        - { type: "tag_add",
            tag_input_sel: "input#protectExtension",
            tag_btn_sel:   "button#extensionAttachBtn",
            tag_value:     "txt" }
        - { type: "toggle_on", selector: "input#isExceptDetect" }
      order: 510

    # ── 프로세스경로 예외처리 ──────────────────────────────────────
    - label:           "프로세스경로 예외처리 오버플로"
      overflow_length: 500
      tag_input:
        input:     "input#exceptProcessPath"
        add_btn:   "button#addExceptProcessPath"
        container: "ul#exceptProcessPathList"
      fill_required:
        - { selector: "input#rcDetectPolicyName", value: "[AUTO]_overflow" }
        - { type: "tag_add",
            tag_input_sel: "input#protectExtension",
            tag_btn_sel:   "button#extensionAttachBtn",
            tag_value:     "txt" }
        - { type: "toggle_on", selector: "input#isExceptDetect" }
      order: 520

    # ── 전자서명 예외처리 ──────────────────────────────────────────
    - label:           "전자서명 예외처리 오버플로"
      overflow_length: 500
      tag_input:
        input:     "input#exceptDigitalSign"
        add_btn:   "button#addExceptDigitalSign"
        container: "ul#exceptDigitalSignList"
      fill_required:
        - { selector: "input#rcDetectPolicyName", value: "[AUTO]_overflow" }
        - { type: "tag_add",
            tag_input_sel: "input#protectExtension",
            tag_btn_sel:   "button#extensionAttachBtn",
            tag_value:     "txt" }
        - { type: "toggle_on", selector: "input#isExceptDetect" }
      order: 530

# ──────────────────────────────────────────────────────────────────────────────
# 모달 액션 버튼
# ──────────────────────────────────────────────────────────────────────────────
modal_actions:
  submit_add:    "button[add-btn]"
  submit_modify: "button[modify-btn]"
  close:         "button[data-dismiss='modal']"
