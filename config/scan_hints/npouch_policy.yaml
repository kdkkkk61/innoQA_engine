# nPouch 엔파우치 정책 — scan_hints YAML
# 작성: 2026-06-01 (사용자 명령 — origin_protect 패턴 복제)
# Chrome MCP 정보 수집 (51개 input id 정확 확보)

page_id: npouch_policy
scan_mode: modal_form

# ─────────────────────────────────────────────────────────────────
# 페이지 개요
# ─────────────────────────────────────────────────────────────────
overview:
  menu_path: "엔파우치 > 엔파우치 정책"
  url_fragment: "#!/managerNpouchPolicy"
  modal_id: "addItemModal"
  modal_open_class: "addItemModal.in"
  tabs:
    - "정책 정보"
    - "PDF문서 보호 기능 설정"
  list_columns:
    - "정책 이름"
    - "최대 열람횟수"
    - "최대 유효기간"
    - "원본보호 (O/X)"
    - "등록일"
    - "수정일"
  list_buttons:
    - "정책추가"
    - "통합정책 추가/삭제"     # 특수 — 별도 모달 (sc 추가 검토)
    - "수정"
    - "정책복사"
    - "엔파우치 열람 가능 공인IP 설정"  # 특수 — 별도 모달
    - "삭제"

# ─────────────────────────────────────────────────────────────────
# 의존성
# ─────────────────────────────────────────────────────────────────
dependencies:
  origin_protect_keep_policy: "[AUTO_KEEP]_sc5_origin_protect"

# ─────────────────────────────────────────────────────────────────
# 핵심 검증 영역 (사용자 보고 2026-06-01)
# ─────────────────────────────────────────────────────────────────
focus_areas:
  - "기능 OFF 시 하위 항목 변경/사용 (depends 패턴)"
  - "입력 제한 (숫자만, 범위, 최소/최대)"
  - "글자 초과 입력 후 저장 시 오류 출력"
  - "유효성 검사"
  - "색상 선택 (pdfWaterMarkAddTextColor — color picker)"
  - "원본보호 정책 KEEP 연계 (picker 모달 → 선택 → 적용 list → 삭제)"
  - "체크박스 다수 — 각 체크 시 동작 확인"
  - "서버 통신: 2 단계 종속 (메인 → 오프라인 정책 → 인증없이/거부 배타적)"
  - "확장자 필터: 추가/제거 동작 + 토글 disabled"
  - "PDF 메인 ON + 하위 미체크 = 사실상 보호 안 됨 (결함 후보)"

# ─────────────────────────────────────────────────────────────────
# 종속 패턴 — 2 단계 + 배타적 (사용자 보고 2026-06-01)
# ─────────────────────────────────────────────────────────────────
nested_dependencies:
  server_auth_hierarchy:
    description: "서버 통신 영역 — 2 단계 종속 + 배타적 체크박스"
    structure:
      - level: 1
        toggle: isServerAuthToRead
        default: false
        children:
          - id: isCollectLocationInfo
            label: "nPouch Certi앱으로 인증 (2차인증)"
            type: "체크박스"
          - id: isOfflinePolicy
            label: "오프라인 정책"
            type: "체크박스"
            level: 2
            children:
              - id: isAllowOfflineViewing
                label: "nPouch Certi앱 인증없이 열람"
              - id: isDenyOfflineViewing
                label: "열람 거부"
            mutually_exclusive:
              - isAllowOfflineViewing
              - isDenyOfflineViewing
            note: "둘 중 하나 체크 시 나머지 disabled (배타적)"

# ─────────────────────────────────────────────────────────────────
# 추정 결함 후보 (사용자 의심 — sc3/sc4 검증 시 확정)
# ─────────────────────────────────────────────────────────────────
suspected_defects:
  pdf_protect_main_on_but_no_sub_lock:
    description: "PDF문서 보호 기능 메인 토글 ON 인데 하위 체크 (프린트/워터마크) 안 해도 잠기지 않음"
    sub_fields_required:
      - isPdfPrint
      - isPdfWaterMark
    severity_candidate: "🔴 HIGH — 메인 ON 의미 무효화"
    note: "사용자 추정 2026-06-01 — sc3/sc4 검증 시 확정 (메인만 ON + 하위 OFF 저장 → 실제 보호 동작 안 함)"

# ─────────────────────────────────────────────────────────────────
# 정책 정보 탭 (37 필드)
# ─────────────────────────────────────────────────────────────────
tab_basic_info:

  required:
    - id: npPolicyName
      type: text
      label: "정책 이름"

  url_ssl:
    - id: readFileCertificateUrl
      type: text
      label: "열람 파일 인증 서버 URL"
    - id: isValidateSslCert
      type: checkbox_toggle
      default: false
      label: "SSL 인증서 유효성 검사"

  read_limit:
    - id: isMaxReadCount
      type: checkbox_toggle
      default: true
      label: "열람횟수 설정"
      depends: [maxReadCount]
    - id: maxReadCount
      type: number
      default: "3"
      label: "최대 열람횟수"
      constraint: "1 이상, 200 이하"
    - id: isMaxReadDay
      type: checkbox_toggle
      default: true
      label: "열람 유효기간 설정"
      depends: [maxReadDay]
    - id: maxReadDay
      type: number
      default: "5"
      label: "최대 열람 유효기간"
      constraint: "1 이상, 1000 이하"

  password:
    - id: isOpenFilePassword
      type: checkbox_toggle
      default: true
      label: "열기암호 사용"
      depends:
        - passwordMinDigit
        - passwordMaxDigit
        - passwordSameLetterCount
        - passwordContinueLetterCount
        - isPasswordNumberLetter
        - isPasswordSpecialLetter
    - id: passwordMinDigit
      type: number
      default: "9"
      label: "최소 글자수"
    - id: passwordMaxDigit
      type: number
      default: "16"
      label: "최대 글자수"
    - id: passwordSameLetterCount
      type: number
      default: "3"
      label: "동일문자 허용 개수"
      constraint: "3 이상의 숫자"
    - id: passwordContinueLetterCount
      type: number
      default: "3"
      label: "연속된 글자 허용 개수"
      constraint: "3 이상의 숫자. 연속 숫자(123,456)+연속 문자(abc,xyz) 검출"
    - id: isPasswordNumberLetter
      type: checkbox
      label: "문자 + 숫자 조합 여부"
    - id: isPasswordSpecialLetter
      type: checkbox
      label: "특수문자 포함 여부"
      note: "특수문자는 !@#$%& 만 사용 가능"

  viewer:
    - id: includeReaderApp
      type: radio
      value: "5"
      label: "뷰어 앱 포함"
    - id: notIncludeReaderApp
      type: radio
      value: "3"
      label: "뷰어 앱 미포함"

  origin_protect:
    - id: isOriginProtectPolicy
      type: checkbox
      default: true
      label: "원본보호 정책 적용"
      depends: [addNpouchOriginProtectPolicyBtn]
      note: "활성화 시 [AUTO_KEEP]_sc5_origin_protect 선택"
    - id: addNpouchOriginProtectPolicyBtn
      type: button
      label: "원본보호 정책 선택"
      button_text: "정책선택"
      class: "addBtn"
      note: "Chrome MCP 확인 2026-06-01 — 클릭 시 원본보호 정책 picker 모달 진입"

  print:
    - id: isPrintOption
      type: checkbox_toggle
      default: true
      label: "인쇄 옵션 사용"
      depends: [isPrintX, isPrintO, allowPrintBrandText, exceptPrintPortText]
    - id: isPrintX
      type: radio
      default: false
      label: "인쇄 차단"
    - id: isPrintO
      type: radio
      default: true
      label: "인쇄 허용"
    - id: allowPrintBrandText
      type: textarea
      label: "허용 인쇄 브랜드"
    - id: exceptPrintPortText
      type: textarea
      label: "제외 인쇄 포트"
      placeholder: "pdf,fax,xpsport,tpvm,nul"

  attachment_count:
    - id: isNpPackageFileCreateFileCount
      type: checkbox_toggle
      default: true
      label: "첨부파일 개수 제한"
      depends: [npPackageFileCreateFileCount]
    - id: npPackageFileCreateFileCount
      type: number
      label: "파일개수"

  server_auth:
    - id: isServerAuthToRead
      type: checkbox_toggle
      default: false
      label: "서버와 통신 후 열람 허용"
      depends:
        - isCollectLocationInfo
        - isOfflinePolicy
        - isAllowOfflineViewing
        - isDenyOfflineViewing
    - id: isCollectLocationInfo
      type: checkbox
      label: "nPouch Certi앱으로 인증 (2차인증)"
    - id: isOfflinePolicy
      type: checkbox
      label: "오프라인 정책"
    - id: isAllowOfflineViewing
      type: checkbox
      label: "nPouch Certi앱 인증없이 열람"
    - id: isDenyOfflineViewing
      type: checkbox
      label: "열람 거부"

  extension_filter:
    - id: isExtensionFilter
      type: checkbox_toggle
      default: true
      label: "확장자 필터기능"
      depends: [includeFileExtension, exceptFileExtension, extensions]
    - id: includeFileExtension
      type: radio
      value: "1"
      default: true
      label: "포함할 파일 확장자"
    - id: exceptFileExtension
      type: radio
      value: "2"
      label: "제외할 파일 확장자"
    - id: extensions
      type: text
      label: "확장자 입력"

  html_guide:
    - id: logoImges
      type: file_text
      label: "로고 이미지"
    - id: htmlDocumentName
      type: text
      label: "문서 제목"
    - id: htmlContactNumber
      type: text
      label: "연락처"

  custom:
    - id: customOptionText
      type: text
      label: "커스텀 옵션값"
      note: "커스텀 기능 추가적으로 적용될 때만 사용"

# ─────────────────────────────────────────────────────────────────
# PDF문서 보호 기능 설정 탭 (14 필드)
# ─────────────────────────────────────────────────────────────────
tab_pdf_protect:

  main:
    - id: isPdfProtect
      type: checkbox_toggle
      default: true
      label: "PDF문서 보호 기능"
      depends: [isPdfPrint, isPdfWaterMark]

  pdf_print:
    - id: isPdfPrint
      type: checkbox
      label: "PDF문서 프린트 허용하기"

  watermark:
    - id: isPdfWaterMark
      type: checkbox
      label: "워터마크 표시하기"
      depends:
        - isShootPreventWaterMark
        - isPdfWaterMarkMain

  shoot_prevent_watermark:
    - id: isShootPreventWaterMark
      type: checkbox
      label: "바둑판 배열로 워터마크 표시하기"
      depends:
        - shootPreventWaterMarkText
        - shootPreventWaterMarkPcInfo
        - shootPreventWaterMarkCurrentTime
        - shootPreventWaterMarkOpacity
    - id: shootPreventWaterMarkText
      type: text
      label: "워터마크 문구"
    - id: shootPreventWaterMarkPcInfo
      type: checkbox
      label: "PC정보"
    - id: shootPreventWaterMarkCurrentTime
      type: checkbox
      label: "현재시간"
    - id: shootPreventWaterMarkOpacity
      type: number
      label: "불투명도"

  center_watermark:
    - id: isPdfWaterMarkMain
      type: checkbox
      label: "화면 중앙에 워터마크 표시하기"
      depends:
        - pdfWaterMarkAddText
        - pdfWaterMarkAddTextSize
        - pdfWaterMarkAddTextOpacity
        - pdfWaterMarkAddTextDegree
        - pdfWaterMarkAddTextColor
    - id: pdfWaterMarkAddText
      type: text
      label: "표시 내용"
    - id: pdfWaterMarkAddTextSize
      type: number
      label: "글자 크기"
    - id: pdfWaterMarkAddTextOpacity
      type: number
      label: "불투명도"
    - id: pdfWaterMarkAddTextDegree
      type: number
      label: "기울기"
    - id: pdfWaterMarkAddTextColor
      type: color
      default: "#000000"
      label: "색상"
      note: "★ HTML5 color picker — 사용자 보고 핵심 영역"

  watermark_position:
    selector_table: "table#tempTable.tempTable"
    selector_cell: "table#tempTable td[data-split-location='POSITION']"
    positions:
      - TOP_LEFT
      - TOP_CENTER
      - TOP_RIGHT
      - MIDDLE_LEFT
      - MIDDLE_CENTER    # default (사용자 캡처 — 중앙 dot)
      - MIDDLE_RIGHT
      - BOTTOM_LEFT
      - BOTTOM_CENTER
      - BOTTOM_RIGHT
    note: "Chrome MCP 확인 2026-06-01 — data-split-location attribute. 9 cell click 으로 위치 선택."

# ─────────────────────────────────────────────────────────────────
# 결함 후보
# ─────────────────────────────────────────────────────────────────
known_bugs_candidates:

  text_length_no_client_guard:
    description: "3000자 입력 → server generic error 추정"
    target_fields:
      - npPolicyName
      - readFileCertificateUrl
      - allowPrintBrandText
      - exceptPrintPortText
      - htmlDocumentName
      - htmlContactNumber
      - customOptionText
      - extensions
      - shootPreventWaterMarkText
      - pdfWaterMarkAddText
      - logoImges

  number_input_constraints:
    description: "숫자 필드 — 음수/소수점/한글/특수문자 마스킹 + 범위"
    target_fields:
      - maxReadCount
      - maxReadDay
      - passwordMinDigit
      - passwordMaxDigit
      - passwordSameLetterCount
      - passwordContinueLetterCount
      - npPackageFileCreateFileCount
      - shootPreventWaterMarkOpacity
      - pdfWaterMarkAddTextSize
      - pdfWaterMarkAddTextOpacity
      - pdfWaterMarkAddTextDegree

  toggle_off_dependent_disabled:
    description: "메인 토글 OFF → 종속 disabled (origin_protect 동일 패턴)"
    pairs:
      - [isMaxReadCount, maxReadCount]
      - [isMaxReadDay, maxReadDay]
      - [isOpenFilePassword, passwordMinDigit]
      - [isOpenFilePassword, passwordMaxDigit]
      - [isOpenFilePassword, passwordSameLetterCount]
      - [isOpenFilePassword, passwordContinueLetterCount]
      - [isOpenFilePassword, isPasswordNumberLetter]
      - [isOpenFilePassword, isPasswordSpecialLetter]
      - [isPrintOption, isPrintX]
      - [isPrintOption, isPrintO]
      - [isPrintOption, allowPrintBrandText]
      - [isPrintOption, exceptPrintPortText]
      - [isNpPackageFileCreateFileCount, npPackageFileCreateFileCount]
      - [isServerAuthToRead, isCollectLocationInfo]
      - [isServerAuthToRead, isOfflinePolicy]
      - [isServerAuthToRead, isAllowOfflineViewing]
      - [isServerAuthToRead, isDenyOfflineViewing]
      - [isExtensionFilter, includeFileExtension]
      - [isExtensionFilter, exceptFileExtension]
      - [isExtensionFilter, extensions]
      - [isPdfProtect, isPdfPrint]
      - [isPdfProtect, isPdfWaterMark]
      - [isPdfWaterMark, isShootPreventWaterMark]
      - [isPdfWaterMark, isPdfWaterMarkMain]
      - [isShootPreventWaterMark, shootPreventWaterMarkText]
      - [isShootPreventWaterMark, shootPreventWaterMarkPcInfo]
      - [isShootPreventWaterMark, shootPreventWaterMarkCurrentTime]
      - [isShootPreventWaterMark, shootPreventWaterMarkOpacity]
      - [isPdfWaterMarkMain, pdfWaterMarkAddText]
      - [isPdfWaterMarkMain, pdfWaterMarkAddTextSize]
      - [isPdfWaterMarkMain, pdfWaterMarkAddTextOpacity]
      - [isPdfWaterMarkMain, pdfWaterMarkAddTextDegree]
      - [isPdfWaterMarkMain, pdfWaterMarkAddTextColor]

# ─────────────────────────────────────────────────────────────────
# 시나리오 매핑 (origin_protect 패턴 복제)
# ─────────────────────────────────────────────────────────────────
scenario_plan:
  sc0: "UIScanner 자동 스캔 (신규 기능 + UI 패턴 자동 검증)"
  sc1: "UI 구조 (탭/list/검색)"
  sc2: "입력 구조 (모달 필드, 초기값, 필수)"
  sc3: "ADD 동작 (필수 빈값 차단 / 이름 중복 / 입력 마스킹 / 3000자 server reject / 정상 저장)"
  sc4: "EDIT 동작 (저장값 load / 필드별 변경 / silent revert / 색상 picker)"
  sc5: "lifecycle ([AUTO_KEEP]_sc5_npouch_policy — 전부 ON → 전부 OFF + cleanup)"
  sc6: "KEEP 정책 보존 확인 (단일 페이지 마무리)"

# ─────────────────────────────────────────────────────────────────
# 특수 모달 (Chrome MCP 확인 2026-06-01 완료)
# ─────────────────────────────────────────────────────────────────
special_features:
  integrated_policy:
    description: "정책 부서,사용자 추가/삭제 — 단일 정책에 적용 대상 할당"
    list_button_text: "통합정책 추가/삭제"
    modal_title: "정책 부서,사용자 추가/삭제"
    tabs: [부서, 사용자, 통합정책]
    sub_modal_buttons: ["+", "-"]
    prerequisite: "list 의 정책 row 선택 필요 (선택 없으면 '선택된 항목이 없습니다')"
    note: "원본보호 정책의 프로세스 sub-modal 과 유사한 패턴"

  ip_setting:
    description: "엔파우치 열람 가능 공인IP 설정 — system-level IP whitelist"
    list_button_text: "엔파우치 열람 가능 공인IP 설정"
    modal_title: "엔파우치 열람 가능 공인IP 설정"
    list_columns: [아이피, IP설명, 상태, 수정자, 수정일]
    sub_modal_buttons: ["+", "-"]
    scope: "system-level (정책 무관, 정책 선택 안 함)"
    sample_count: 11

# ─────────────────────────────────────────────────────────────────
# Chrome MCP dump 진행 상황
# ─────────────────────────────────────────────────────────────────
chrome_mcp_status:
  completed:
    - "정책 정보 탭 51개 input id 정확 dump"
    - "PDF문서 보호 기능 설정 탭 dump"
    - "통합정책 추가/삭제 모달 (정책 부서,사용자 추가/삭제)"
    - "엔파우치 열람 가능 공인IP 설정 모달 (system-level)"
    - "원본보호 정책 선택 버튼: button#addNpouchOriginProtectPolicyBtn"
    - "워터마크 표시 위치 grid: table#tempTable td[data-split-location='POSITION']"
