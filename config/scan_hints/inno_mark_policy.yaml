# inno_mark_policy 페이지 스캔 힌트
# DOM 기반 수집 완료 (2026-04-13) — Chrome MCP 직접 확인
# 휴리스틱보다 이 파일이 항상 우선 적용됨
#
# [구조 특이사항]
# - 모달 ID: div#addInnoMarkPolicyControl
# - 모달 탭 5개 — data-tab 속성 없음, ul.nav li a 텍스트 기준 (tab_text 폴백 사용)
# - 정책 이름만 필수 (no 확장자 필드 등 추가 필수 없음)
# - 화면 / 프린트 워터마크 그리드(3×3): 각 셀 RegistBtn 클릭 → 템플릿 선택 팝업
#   (grid 패턴은 별도 validator 구현 예정)
#
# [order 규칙]
# - 기본정책 탭:        10 ~ 99
# - 고급기능 설정 탭:  100 ~ 299
# - 트리거 설정 탭:    300 ~ 399
# - 캡처허용 프로세스: 400 ~ 499
# - 실행차단 프로세스: 500 ~ 599
# - 제출 검증:        9999
#
# [기본값 출처]
# - Chrome MCP javascript_tool outerHTML 추출 (2026-04-13)
# - [TODO] 항목: 추가 MCP 확인 필요 (default 미확정)

page_id:   "inno_mark_policy"
modal_id:  "addInnoMarkPolicyControl"
scan_mode: "modal_form"   # run_3phase_scan 사용

# ──────────────────────────────────────────────────────────────────────────────
# 시나리오 1: UI 구조 (테이블 헤더 · 검색)
# ──────────────────────────────────────────────────────────────────────────────
list_ui:
  tabs: []   # 목록 페이지는 탭 없음 → ⏭ skip

  search:
    input:     "input#searchText"
    button:    null          # [TODO] 검색 버튼 selector MCP 확인 필요
    maxlength: null          # [TODO] DOM maxlength MCP 확인 필요
    label:     "정책 이름 검색창"

  table:
    headers:
      - "정책 이름"
      - "등록일"
      - "수정일"

# 모달 진입점
modal_trigger:
  add:    "button#addItemBtn"
  modify: "button#modifyItemBtn"

# 모달 닫기 / 확인 버튼 — ID 없음, class 기준
modal_actions:
  close:         "div#addInnoMarkPolicyControl button.btn-default.btn-sm"
  submit_add:    "div#addInnoMarkPolicyControl button.btn-primary.btn-sm:has-text('확인')"
  submit_modify: "div#addInnoMarkPolicyControl button.btn-primary.btn-sm:has-text('수정')"

# ──────────────────────────────────────────────────────────────────────────────
# 모달 탭 구조 — tab_text 폴백 (data-tab 속성 없음)
# ──────────────────────────────────────────────────────────────────────────────
modal_tabs:
  - tab_id:      "im_tab_basic"
    tab_text:    "기본정책"
    label:       "기본정책"
    start_order: 0           # order 0 ~ 99 항목은 이 탭 구간으로 출력

  - tab_id:      "im_tab_advanced"
    tab_text:    "고급기능 설정"
    label:       "고급기능 설정"
    start_order: 100         # order 100 ~ 299

  - tab_id:      "im_tab_trigger"
    tab_text:    "트리거 설정"
    label:       "트리거 설정"
    start_order: 300         # order 300 ~ 399

  - tab_id:      "im_tab_capture_allow"
    tab_text:    "캡처허용 프로세스"
    label:       "캡처허용 프로세스"
    start_order: 400         # order 400 ~ 499

  - tab_id:      "im_tab_exec_block"
    tab_text:    "실행차단 프로세스"
    label:       "실행차단 프로세스"
    start_order: 500         # order 500 ~ 599

# ──────────────────────────────────────────────────────────────────────────────
# 필수 입력 검증 순서
# innoMark 정책: 정책 이름만 필수 (사용자 확인, 2026-04-13)
# ──────────────────────────────────────────────────────────────────────────────
required_submit_sequence:
  - step:               "0_dup"
    description:        "중복 이름 등록 시도"
    fill_from_context:  "existing_name"
    fill_target:        "imPolicyName"
    phases_only:        [2]
    expected_type:      "any_warning"
    reset_after:        ["imPolicyName"]
    missing_field:      "imPolicyName"
    missing_field_label: "정책 이름"

  - step:               1
    description:        "아무것도 입력 안 함"
    fill:               []
    expected_msg:       "정책 이름을 입력해 주세요."
    missing_field:      "imPolicyName"
    missing_field_label: "정책 이름"

  - step:               2
    description:        "정책 이름 입력"
    fill:               ["imPolicyName"]
    expected:           "success"

# ──────────────────────────────────────────────────────────────────────────────
# 텍스트 입력
# ──────────────────────────────────────────────────────────────────────────────
text_inputs:
  - selector:   "input#imPolicyName"
    label:      "정책 이름"
    maxlength:  20          # [TODO] DOM maxlength MCP 확인 필요 — 20으로 추정
    required:   true
    test_value: "[AUTO]_seq"
    tab:        "im_tab_basic"
    order:      10

  # 고급기능 설정 탭 — 캡처 차단 메시지
  - selector:   "input#blockPrintScreenText"
    label:      "캡처 차단 메시지"
    maxlength:  null        # [TODO] DOM maxlength MCP 확인 필요
    required:   false
    test_value: "scan_capture_msg"
    tab:        "im_tab_advanced"
    order:      115
    parent_toggle: "input#isCapturePrevent"

  # 고급기능 설정 탭 — 동적 투명도 설정
  - selector:   "input#dynamicOpacityAwaySeconds"
    label:      "동적 투명도 전환 시간(초)"
    maxlength:  null        # [TODO] MCP 확인 필요 (number type)
    required:   false
    test_value: ""
    tab:        "im_tab_advanced"
    order:      131
    parent_toggle: "input#isDynamicOpacity"

  - selector:   "input#dynamicOpacityIncrease"
    label:      "동적 투명도 증가값"
    maxlength:  null
    required:   false
    test_value: ""
    tab:        "im_tab_advanced"
    order:      132
    parent_toggle: "input#isDynamicOpacity"

  # 고급기능 설정 탭 — 워터마크 위치 이동
  - selector:   "input#watermarkLocationMoveSeconds"
    label:      "워터마크 위치 이동 주기(초)"
    maxlength:  null
    required:   false
    test_value: ""
    tab:        "im_tab_advanced"
    order:      141
    parent_toggle: "input#isWatermarkLocationMove"

  - selector:   "input#watermarkLocationMoveWidth"
    label:      "이동 폭 범위"
    maxlength:  null
    required:   false
    test_value: ""
    tab:        "im_tab_advanced"
    order:      142
    parent_toggle: "input#isWatermarkLocationMove"

  - selector:   "input#watermarkLocationMoveHeight"
    label:      "이동 높이 범위"
    maxlength:  null
    required:   false
    test_value: ""
    tab:        "im_tab_advanced"
    order:      143
    parent_toggle: "input#isWatermarkLocationMove"

  # 고급기능 설정 탭 — 투명 워터마크 농도
  - selector:   "input#targetInvisibleWatermarkDensity"
    label:      "타겟 비가시 워터마크 농도"
    maxlength:  null
    required:   false
    test_value: ""
    tab:        "im_tab_advanced"
    order:      161
    parent_toggle: "input#isTargetWatermark"

  - selector:   "input#invisibleWatermarkScrDensity"
    label:      "화면 비가시 워터마크 농도"
    maxlength:  null
    required:   false
    test_value: ""
    tab:        "im_tab_advanced"
    order:      171
    parent_toggle: "input#isInvisibleWatermark"

  - selector:   "input#invisibleWatermarkPrtDensity"
    label:      "프린트 비가시 워터마크 농도"
    maxlength:  null
    required:   false
    test_value: ""
    tab:        "im_tab_advanced"
    order:      172
    parent_toggle: "input#isInvisibleWatermark"

  # 고급기능 설정 탭 — 권한 비밀번호
  - selector:   "input#authorizationPassword"
    label:      "권한 해제 비밀번호"
    maxlength:  null        # [TODO] MCP 확인 필요
    required:   false
    test_value: ""
    tab:        "im_tab_advanced"
    order:      191
    parent_toggle: "input#isAuthorizationPassword"

  - selector:   "input#authorizationPasswordConfirm"
    label:      "비밀번호 확인"
    maxlength:  null
    required:   false
    test_value: ""
    tab:        "im_tab_advanced"
    order:      192
    parent_toggle: "input#isAuthorizationPassword"

  # 고급기능 설정 탭 — 사용자 정의 옵션 텍스트
  - selector:   "input#customOptionText"
    label:      "사용자 정의 옵션 텍스트"
    maxlength:  null        # [TODO] MCP 확인 필요
    required:   false
    test_value: "scan_custom"
    tab:        "im_tab_advanced"
    order:      200

