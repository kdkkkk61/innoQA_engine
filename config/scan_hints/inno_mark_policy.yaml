# ──────────────────────────────────────────────────────────────────────────────
# 라디오 버튼 그룹 (기본정책 탭)
# name=isWatermarkTrigger: conditionOn / conditionOff
# default: [TODO] ADD 모달 최초 열림 시 상태 MCP 확인 필요
# ──────────────────────────────────────────────────────────────────────────────
radio_groups:
  - name:    "isWatermarkTrigger"
    label:   "워터마크 트리거 조건"
    default: null            # [TODO] ADD 모달 초기값 MCP 확인 필요
    tab:     "im_tab_basic"
    order:   20
    options:
      - selector: "input#conditionOn"
        value:    "ON"
        label:    "트리거 조건 ON"
      - selector: "input#conditionOff"
        value:    "OFF"
        label:    "트리거 조건 OFF (항상 적용)"

  # 고급기능 설정 탭 — 캡처 차단 방식
  - name:    "capturePreventMode"
    label:   "캡처 차단 방식"
    default: null            # [TODO] MCP 확인 필요
    tab:     "im_tab_advanced"
    order:   111
    parent_toggle: "input#isCapturePrevent"
    options:
      - selector: "input#always"
        value:    "always"
        label:    "항상 차단"
      - selector: "input#conditional"
        value:    "conditional"
        label:    "조건부 차단"

# ──────────────────────────────────────────────────────────────────────────────
# 토글 체크박스 (고급기능 설정 탭)
# default: [TODO] ADD 모달 최초 열림 시 상태 MCP 확인 필요 — 전체 false로 추정
# ──────────────────────────────────────────────────────────────────────────────
toggle_checkboxes:
  # 고급기능 설정 탭
  - selector: "input#isCapturePrevent"
    label:    "캡처 차단"
    default:  false
    tab:      "im_tab_advanced"
    order:    110
    dependent_fields:
      - selector: "input#always"
        label:    "항상 차단 (라디오)"
        type:     "radio"
      - selector: "input#conditional"
        label:    "조건부 차단 (라디오)"
        type:     "radio"
      - selector: "input#isBlockPrintScreenText"
        label:    "캡처 차단 메시지 표시"
        type:     "plain_checkbox"
      - selector: "input#blockPrintScreenText"
        label:    "캡처 차단 메시지 텍스트"
        type:     "text_input"
      - selector: "input#isImCaptureAllowProcess"
        label:    "캡처 허용 프로세스 사용"
        type:     "plain_checkbox"
      - selector: "input#isUseCaptureImageCollection"
        label:    "캡처 이미지 수집 사용"
