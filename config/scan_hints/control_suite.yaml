      dom_maxlength: null               # DOM 제한 없음 (사용자 console: maxlength=-1)
      verified_lengths: [50, 100, 300, 500, 1000]
      behavior:
        - "50자: process_modal 저장 OK + 메인 모달 저장 OK (정상)"
        - "100/300/500자: process_modal 저장 OK + 메인 모달 저장 시 '서버에서 오류 발생' (UX 결함)"
      conclusion: "제품 권고: DOM maxlength 추가 또는 서버 차단 메시지 사용자 친화적으로"
      severity: "ux_defect"

    signExceptInput:
      dom_maxlength: null
      verified_cases: ["Claude Sign", "한글전자서명", "$@%", "a*100", "a*500"]
      behavior: "모든 케이스 등록 OK — 글자수/한글/특수문자 차단 없음"
      yaml_todo_resolved: ":418 selectReservedWord/signExceptInput TODO → 제한 없음 확정"

    allowExtensionInput / allowExtensionInputP / allowFileExtention:
      verified_lengths: [50, 100, 500]
      behavior: "모든 길이 등록 OK — 글자수 제한 없음 (3개 영역 동일)"

    customOptionText:
      verified_lengths: [100, 300, 500]
      behavior: "DOM 길이 그대로 (자동 절단 없음). 저장 시 동작 미검증."

    basePath:
      dom_maxlength: null
      behavior:
        - "글자수 제한 없음"
        - "web_restrict_modal 저장 OK"
        - "메인 저장 시 '서버에서 오류 발생' (드라이브 letter 동일 패턴)"
      severity: "ux_defect"

    uploadLimitSize:
      dom_maxlength: 12   # 알림: "업로드 제한용량의 입력 가능 글자수는 최대 12자 까지 가능합니다."
      conversion_policy:  # yaml :393 정책 확정
        invalid_to_zero: ["abc", "-1", "1.5", ""]    # 모두 "0" 으로 변환
      verified_message: "업로드 제한용량의 입력 가능 글자수는 최대 12자 까지 가능합니다."

  # 기능 부재 영역 (구 빌드 미지원)
  not_available_in_legacy_build:
    allow_url_mode_combinations:
      missing_elements: ["input[name='isDataDecrypt']", "input#isFileUploadEncrypt 종속"]
      note: "yaml :175-184 의 ra0/ra1 + 암호화 disabled 종속 — 구 빌드 미구현 (신 빌드 한정 기능)"
      auto_skip_pattern: "feature_exists() helper 로 skip 처리"

    clipboardAllowUrl:
      missing_elements: ["textarea#clipboardAllowUrl"]
