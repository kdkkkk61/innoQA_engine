# ──────────────────────────────────────────────────────────────────────────────
text_inputs:
  - selector:   "input#csuName"
    label:      "스위트 이름"
    required:   true
    maxlength:  50          # Chrome MCP 확인 (2026-05-12)
    test_value: "[AUTO]_csu"
    order:      10

  # 클립보드 예외 URL — textarea. isClipboardRestrict 토글과 같은 dt 안에 있지만
  # 동작상 독립 기능 (Chrome MCP 확인: 토글 OFF 상태에서도 disabled=false).
  # 즉 "클립보드 공유제한" 기능 ON/OFF 와 "URL 클립보드 예외처리" 는 별개 기능.
  # 실제 라벨 = 안내 텍스트의 핵심 ("등록된 URL 클립보드 예외처리").
  # 형식: URL1;URL2; (세미콜론 — Chrome MCP 확인. 기존 yaml 의 콜론 표기는 잘못).
  # ※ 주의: validator 가 textarea selector 를 처리하는지 적용 시 확인 필요.
  - selector:   "textarea#clipboardAllowUrl"
    label:      "등록된 URL 클립보드 예외처리"
    required:   false
    maxlength:  null        # DOM maxlength 없음 (서버 제한 미확인)
    test_value: "scan_test_url"
    order:      25          # 토글 (20) 직후 — 같은 dt 안의 별개 기능

  - selector:   "input#customOptionText"
    label:      "커스텀 옵션값"
    required:   false
    maxlength:  null        # DOM maxlength 없음 (Chrome MCP 2026-05-12)
                            # 서버 제한 미확인 — 경계값 입력 테스트로 확정 필요
    test_value: "[AUTO]_opt"
    order:      90

# ──────────────────────────────────────────────────────────────────────────────
# 일반 체크박스 (toggle 종속 없음)
# ──────────────────────────────────────────────────────────────────────────────
plain_checkboxes:
  # radio (isAllowExtension) 영역 안의 추가 옵션. radio 와 독립 동작 — 분리 등록.
  - selector: "input#isHeaderCheck"
    label:    "헤더 체크 기능 사용"
    default:  false    # Chrome MCP 확인 (2026-05-12, ADD 모달 초기 상태)
    order:    55

# ──────────────────────────────────────────────────────────────────────────────
# 라디오 버튼 그룹 — 자동 검증 X (yaml 등록 필수)
# 시나리오 1 discovered_new 신규 표시만 가능 (B-1 정책).
# ──────────────────────────────────────────────────────────────────────────────
radio_groups:
  - name:    "isAllowExtension"
    label:   "제어할 확장자"
    default: "1"            # Chrome MCP 확인 (2026-05-12, ALLOW 가 default checked)
    order:   40
    options:
      - selector: "input#ALLOW"
        value:    "1"       # Chrome MCP 확인 (DOM value 속성)
        label:    "확장자 대상지정"
        # 이 옵션 선택 시 하단 입력 영역 라벨이 "차단할 확장자" 로 변경됨
        expected_sub_label:
          target:   "span#allowExtensionText"
          expected: "차단할 확장자"
      - selector: "input#BLOCK"
        value:    "0"
        label:    "확장자 전체차단"
        # 이 옵션 선택 시 하단 입력 영역 라벨이 "허용할 확장자" 로 변경됨
        expected_sub_label:
          target:   "span#allowExtensionText"
          expected: "허용할 확장자"

# ──────────────────────────────────────────────────────────────────────────────
# 토글 체크박스 — ON 시 종속 필드 활성화
# ──────────────────────────────────────────────────────────────────────────────
toggle_checkboxes:
  - selector: "input#isClipboardRestrict"
    label:    "클립보드 공유제한"
    default:  false   # Chrome MCP 확인 (2026-05-12)
    order:    20
    # ※ dependent_fields = [] (독립 기능)
    # 같은 dt 안의 clipboardAllowUrl textarea 는 별개 독립 기능 (text_inputs 에 등록).
    # Chrome MCP 검증 (2026-05-12): 토글 OFF 상태에서도 textarea disabled=false.
    # 즉 토글 ON/OFF 와 textarea 입력 기능은 별도 동작.
    dependent_fields: []

  - selector: "input#isNetwork"
    label:    "네트워크 허용"
    default:  false   # Chrome MCP 확인 (2026-05-12)
    order:    30
    dependent_fields: []

  - selector: "input#isSignExcept"
    label:    "전자서명 예외처리"
    default:  false   # Chrome MCP 확인 (2026-05-12)
    order:    70
    # ※ dependent_fields = [] — sign_except 는 tag_input 으로 별도 등록 (required_toggle 지정).
    # Chrome MCP 검증 (2026-05-12): 토글 OFF 시 signExceptInput.disabled=true,
    # signExceptBtn.disabled=true → 진짜 종속 (clipboard 와 다른 패턴, 종속 정상).
    dependent_fields: []

# ──────────────────────────────────────────────────────────────────────────────
# 태그 입력 패턴 — 입력 + 추가 + 컨테이너 + 제거 (B-1-D tag_input)
# Chrome MCP 확인 (2026-05-12): button text="추가", container = div#*Ul 형태
# ──────────────────────────────────────────────────────────────────────────────
tag_input:
  - id:         "allow_extension"
    label:      "허용/차단 확장자"
    input:      "input#allowExtensionInput"
    add_btn:    "button#allowExtensionInputBtn"
    container:  "div#allowExtensionUl"
    remove_btn: "i.extentionDeleteBtn"   # Chrome MCP 확인 (2026-05-12)
                                          # ransom_detect_policy 와 동일 앱 오탈자 (extEntion)
    required:   false
    test_value: "txt"                    # 특수문자/한글 거부 (".*;?" 외 제외) — 단순 알파벳 사용
    order:      60
    # 참고: 이 tag_input 의 placeholder/라벨은 isAllowExtension radio 선택에 따라
    # "차단할 확장자" / "허용할 확장자" 로 동적 변경됨 (span#allowExtensionText).

  - id:         "sign_except"
    label:      "전자서명 예외처리 목록"
    input:      "input#signExceptInput"        # Chrome MCP 확인 (2026-05-12)
    add_btn:    "button#signExceptBtn"
    container:  "div#signExceptUl"
    remove_btn: "i.extentionDeleteBtn"   # 추정 (ransom_detect_policy 동일 앱 사용 — 동일 selector 예상)
                                          # 실제 태그 추가 후 재확인 권장
    required:   false
    test_value: "test_sign"
    order:      80
    required_toggle: "input#isSignExcept"   # Chrome MCP 검증 (2026-05-12):
                                              # 토글 OFF → input/btn disabled=true
                                              # 토글 ON  → input/btn disabled=false (정상 종속)

# ══════════════════════════════════════════════════════════════════════
# 2차 서브모달 영역 — 프로세스 등록 흐름 (modal_form 자동 분류 인프라 외)
# ══════════════════════════════════════════════════════════════════════

# ──────────────────────────────────────────────────────────────────────────────
# 2차 모달 1: 프로세스 등록 (controlSuiteProcessList)
# 메인 모달 "프로세스별 제어 > +" 버튼 클릭 시 출현. 개별 프로세스의 세부 설정.
# Chrome MCP 확인 (2026-05-12): input 14개, button 4개
# ──────────────────────────────────────────────────────────────────────────────
process_modal:
  id:    "controlSuiteProcessList"
  title: "프로세스 등록"
  sel:   "div#controlSuiteProcessList"
  sel_open: "div#controlSuiteProcessList.in"

  # 필드 14개 (P prefix 로 메인 모달의 동일 기능과 구분 — Process 별 세부 설정)
  # 화면 순서 (사용자 결정 2026-05-13): 사용자 의도 — UI 순서대로 출력
  #   1. csuProcessBtn (프로세스/태그명)
  #   2. isProcessExcept (프로세스 예외처리)
  #   3. isPClipboardRestrict (클립보드 공유제한 개별)
  #   4. isPNetwork + accessAllowIp/Port (네트워크 허용 개별)
  #   5. isPControlExtension + ALLOWP/BLOCKP + allowExtensionInputP (제어할 확장자 개별)
  #   6. cacheFolderInput + specialFolderBtn + attachCacheFolderBtn (캐시폴더 지정)
  #   7. isSandbox (SandBox 기능 사용)
  #   8. isAccessDrive + accessDriveLetter (접근 드라이브 지정)
  #   9. isDenyExceptDrive (예외 드라이브 접근 차단)
  #   10. description (설명)
  # 토글 종속 disabled 검증 (Chrome MCP 2026-05-12): 모든 토글 OFF → 종속 필드 disabled=true / ON → disabled=false
  fields:
    # 단독 토글 (종속 필드 없음) — Chrome MCP 확인: ON/OFF 무관 다른 필드 영향 없음
    - {id: "isProcessExcept",       type: "checkbox", label: "프로세스 예외처리"}
    - {id: "isPClipboardRestrict",  type: "checkbox", label: "클립보드 공유제한 (개별)"}
    - {id: "isSandbox",             type: "checkbox", label: "SandBox 기능 사용"}
    - {id: "isDenyExceptDrive",     type: "checkbox", label: "예외 드라이브 접근 차단"}

    # isPNetwork 토글 + 종속 (검증 완료)
    - {id: "isPNetwork",            type: "checkbox", label: "네트워크 허용 (개별)",
       dependent_controls: ["accessAllowIp", "accessAllowPort", "allowIpAddressBtn"],
       chrome_mcp_verified: 2026-05-12}
    - {id: "accessAllowIp",         type: "text",     label: "허용 IP",         placeholder: "IP를 입력하세요",   depends_on: "isPNetwork"}
    - {id: "accessAllowPort",       type: "text",     label: "허용 Port",       placeholder: "Port를 입력하세요", depends_on: "isPNetwork"}

    # isPControlExtension 토글 + 종속 (검증 완료)
    - {id: "isPControlExtension",   type: "checkbox", label: "제어할 확장자 (개별)",
       dependent_controls: ["ALLOWP", "BLOCKP", "allowExtensionInputP", "allowExtensionInputBtnP"],
       chrome_mcp_verified: 2026-05-12}
    - {id: "ALLOWP",                type: "radio",    name: "isAllowExtensionP", value: "1", label: "확장자 대상지정 (개별)", depends_on: "isPControlExtension"}
    - {id: "BLOCKP",                type: "radio",    name: "isAllowExtensionP", value: "0", label: "확장자 전체차단 (개별)", depends_on: "isPControlExtension"}
    - {id: "allowExtensionInputP",  type: "text",     label: "허용/차단 확장자 (개별)", placeholder: "확장자를 입력하세요", depends_on: "isPControlExtension"}

    # isAccessDrive 토글 + 종속 (검증 완료)
    - {id: "isAccessDrive",         type: "checkbox", label: "접근 드라이브 지정",
       dependent_controls: ["accessDriveLetter"],
       chrome_mcp_verified: 2026-05-12}
    - {id: "accessDriveLetter",     type: "text",     label: "드라이브 레터",  depends_on: "isAccessDrive",
       expected_format: "C;D;E (세미콜론 구분 다중 드라이브)",
       validation_note: "글자수 제한만 검증 (자주 쓰는 기능 X — 사용자 결정 2026-05-13)"}

    - {id: "description",           type: "textarea", label: "설명"}

  # 액션 버튼
  actions:
    pick_process:        "button#csuProcessBtn"          # "프로세스 선택" → process_picker 모달 호출
                                                         # 태그 탭에서 열린 경우 동일 selector 의 텍스트가 "태그 선택" 으로 토글됨
    add_ip:              "button#allowIpAddressBtn"      # IP 추가 (tag_input 패턴)
    add_extension:       "button#allowExtensionInputBtnP" # 확장자 추가 (tag_input 패턴)
    pick_special_folder: "button.specialFolderBtn"       # "특수폴더" → special_folder_picker 모달 호출 (Chrome MCP 2026-05-12)
    add_cache_folder:    "button#attachCacheFolderBtn"   # 캐시 폴더 입력값 추가 (tag_input 패턴)
    confirm:             "button.btn-primary"            # "확인" — 메인 모달 테이블에 등록

  # 캐시폴더 지정 영역 — 두 버튼 공존 (Chrome MCP 검증 2026-05-12)
  cache_folder_section:
    label: "캐시폴더 지정"
    # input 은 <input> 이 아니라 contenteditable DIV (예약어 inline tag 삽입 컨테이너)
    input: "div#cacheFolderInput"
    input_attrs:
      contenteditable: true
      class: "reservedWordInput"
      data_reserved_word_type: "RESERVED_WORD_LB_FOLDER_PATH"
      placeholder: "ex) C:\\program files (x86)\\innotium"
    notice: "OS에서 사용하는 Program files, Appdata등 과 같은 경로는 기본적으로 등록됨"
    buttons:
      - {label: "특수폴더", selector: "button.specialFolderBtn", target: "special_folder_picker", note: "예약어 모달 호출 — 다중 선택"}
      - {label: "추가",     selector: "button#attachCacheFolderBtn", note: "input 값을 list 에 추가"}
    list_container: "div#cacheFolderList"

    # 검증 흐름 (사용자 요구 2026-05-12) — 2개 케이스
    # ⚠ 공통 규칙: 추가 버튼 (#attachCacheFolderBtn) 까지 눌러야 cacheFolderList 에 저장됨.
    #             input 단계만으로는 모달 닫고 다시 열면 데이터 사라짐.
    contract:
      input_alone_is_incomplete: true
      add_button_required_for_persistence: true

    validation_cases:
      # 케이스 1: 일반 텍스트 직접 입력 + 추가
      - id: "case1_plain_text_path"
        label: "일반 폴더 경로 직접 입력"
        flow:
          - "div#cacheFolderInput 에 텍스트 입력 (예: 'C:\\test_path')"
          - "button#attachCacheFolderBtn 클릭"
        expected:
          - "#cacheFolderList > #cacheFolder 안에 button[contents-list-item] 등록"
          - "button > span[data-cache-folder='C:\\test_path']"
          - "#cacheFolderInput 비워짐"
        chrome_mcp_verified: TODO   # 구체 텍스트 입력 e2e 미시연

      # 케이스 2: 특수폴더 (예약어) 선택 + 순서 + 추가
      - id: "case2_reserved_word_with_order"
        label: "특수폴더 다중 선택 (순서 보존) + 추가"
        flow:
          - "button.specialFolderBtn 클릭 → #selectReservedWordControl 모달 출현"
          - "예약어 N개 체크 (체크 순서 의미 있음)"
          - "확인 → #cacheFolderInput 에 클릭 순서대로 inline tag 삽입"
          - "button#attachCacheFolderBtn 클릭"
        expected:
          - "체크 순서대로 #cacheFolderInput 안에 button.tagInput[name='reservedWordIcon'] 삽입"
          - "추가 클릭 → #cacheFolderList 에 동일 순서로 button[data-cache-folder=코드] 등록"
          - "#cacheFolderInput 비워짐"
        order_preservation:
          rule: "체크박스 누른 순서대로 #cacheFolderInput 에 좌→우 삽입 (DOM 순 아님)"
          test_evidence: |
            클릭 순: FAVORITES → DESKTOP → USER (DOM 순 [DESKTOP, FAVORITES, USER] 과 다름)
            결과 inputInsertOrder: ['[/FAVORITES/]', '[/DESKTOP/]', '[/USER/]'] ← 클릭 순서 보존
          chrome_mcp_verified: 2026-05-12
        chrome_mcp_verified: 2026-05-12

    # selector 사실 (validation 카드 작성 시 참조)
    selector_facts:
      input_inline_tag_button: "button.tagInput.addBtn[name='reservedWordIcon']"
      input_delete_icon:       "i.reservedWordDeleteBtn.fa.fa-times"
      list_container_inner:    "#cacheFolderList > #cacheFolder"
      list_item_button:        "button.tagInput.addBtn[contents-list-item]"
      list_item_data_attrs:    ["data-id", "data-cache-folder", "data-status"]
      list_delete_icon:        "i.folderDeleteBtn.fa.fa-times"

  # 선택된 프로세스/태그 표시 (Chrome MCP 확인 2026-05-12)
  selected_display:
    selector: "span#csuProcessName.blueTxt.mr5"
    default_text: "프로세스 미선택"   # 태그 모드에서는 "태그 미선택"
    after_pick: "선택된 프로세스명 또는 태그명"

  # 모드 전환 — 메인 모달의 활성 sub-tab 에 따라 단일 컨테이너가 모드 변경
  # Chrome MCP 확인 (2026-05-12):
  #   개별 프로세스 sub-tab 에서 + 클릭 → 모달 라벨 "프로세스명 *" / 버튼 텍스트 "프로세스 선택"
  #   태그 sub-tab     에서 + 클릭 → 모달 라벨 "태그명 *"     / 버튼 텍스트 "태그 선택"
  modes:
    process:
      sub_tab_label: "개별 프로세스"
      field_label:   "프로세스명 *"
      pick_btn_text: "프로세스 선택"
      picker_modal:  "globalProcessList"
    tag:
      sub_tab_label: "태그"
      field_label:   "태그명 *"
      pick_btn_text: "태그 선택"
      picker_modal:  "globalProcessList"   # v20 확정 (Chrome MCP 2026-05-12): 동일 컨테이너의 tag_single_select 모드
      picker_mode:   "tag_single_select"

# ──────────────────────────────────────────────────────────────────────────────
# 2차 모달 2: 프로세스 선택 (globalProcessList)
# process_modal 의 "프로세스 선택" 버튼 클릭 시 출현. 운용 프로세스 목록에서 선택.
# 시나리오 6 (연계 데이터 준비) 가 등록한 운용 프로세스를 여기서 선택.
# Chrome MCP 확인 (2026-05-12): 테이블 20행/페이지, 컬럼 4개
# ──────────────────────────────────────────────────────────────────────────────
process_picker:
  id:    "globalProcessList"
  title: "프로세스 선택"
  sel:   "div#globalProcessList"
  sel_open: "div#globalProcessList.in"

  search:
    input:  "input#searchText"
    button: "button#searchBtn"
    # web_restrict 경로에서만 추가 노출되는 카테고리 select (process_modal 경로에는 없음)
    category_select: "select"   # "프로세스 명" 선택지 (다른 옵션 미조사)

  table:
    # process_modal 경로 (단일 선택): 4컬럼 — radio + 행 셀
    # web_restrict 경로 (다중 선택): 5컬럼 — checkbox + 행 셀
    headers:
      - "프로세스 명"
      - "서명"
      - "설명"
      - "수정일"
    rows_per_page: 20

  # 호출 컨텍스트에 따른 모드 변경 (Chrome MCP 확인 2026-05-12, v20: 태그 모드 추가)
  # 동일 globalProcessList 컨테이너지만 호출자에 따라 모달 제목·헤더·input·검색 UI 가 모두 변경됨.
  modes:
    single_select:
      caller: "process_modal#csuProcessBtn (개별 프로세스 sub-tab)"
      title: "프로세스 선택"
      table_headers: ["프로세스 명", "서명", "설명", "수정일"]
      select_input: "input[type='radio'][name='selectProcess']"
      search_input: "input#searchText"
      search_category_select: "select"   # '프로세스 명' 카테고리
      add_new_btn: "button#addItemBtn"   # '프로세스 추가' (fallback_add_new 경로)
      cardinality: 1
      flow: "선택 1개 → 확인 → process_modal 의 span#csuProcessName 에 바인딩"
    multi_select:
      caller: "web_restrict_modal#addWebRestrictProcess"
      title: "프로세스 선택"
      table_headers: ["프로세스 명", "서명", "설명", "수정일"]
      select_input: "input[type='checkbox'][name='selectProcess']"
      search_input: "input#searchText"
      search_category_select: "select"
      add_new_btn: "button#addItemBtn"
      cardinality: "1..N"
      flow: "체크박스 N개 선택 → 확인 → web_restrict_modal 의 적용 프로세스 테이블에 N행 추가"
    tag_single_select:   # v20 추가 (Chrome MCP 검증 2026-05-12)
      caller: "process_modal#csuProcessBtn (태그 sub-tab)"
      title: "태그 선택"
      table_headers: ["태그명", "설명"]
      select_input: "input[type='radio'][name='selectProcessTag']"
      search_input: "input[placeholder='태그 이름']"
      search_category_select: null   # 카테고리 select 부재
      add_new_btn: null   # '태그 추가' 버튼 부재 (npouch_tag 페이지에서 직접 등록)
      cardinality: 1
      flow: "선택 1개 → 확인 → process_modal 의 span#csuProcessName 에 태그명 바인딩"
      verified_at: 2026-05-12
      sample_data: "등록된 태그 116건 (시스템 기존 데이터 — 사전 등록 조건 아님)"

  actions:
    # 목록에서 새 프로세스 직접 등록 (시나리오 6 흐름 외 추가 등록 가능)
    add_new_process: "button#addItemBtn"   # "프로세스 추가" → 또 다른 모달 (운용 프로세스 등록)
    confirm:         "button.btn-primary"  # "확인" — 선택한 프로세스 → process_modal 로 복귀

  # 시나리오 6 연계
  scenario_6_link:
    description: |
      시나리오 6 (운용 프로세스 데이터 준비) 에서 [AUTO_KEEP] 접두사로
      운용 프로세스를 미리 등록해두면, 여기서 검색으로 찾아 선택 가능.
      → 제어 스위트 검증 흐름 = 시나리오 6 → 1차 모달 → 2차 process_modal → 3차 process_picker → 선택 → 등록
    expected_prefix: "[AUTO_KEEP]"

  # 검증 정책: "단순 통과" (책임 분리 — process_picker 자체 검증은 npouch_operation_process 영역)
  # 사용자 결정 (2026-05-12): "정해진 프로세스만 검색·선택, 폴백으로 notepad.exe / 신규 등록 시험"
  selection_flow:
    policy: "endpoint_pass_through"
    description: |
      process_picker 자체의 검색/추가/페이지네이션은 npouch_operation_process 페이지가 책임.
      제어 스위트는 "선택 → 메인 모달 테이블 등록" endpoint 만 검증.

    # 검증 시 행동 순서 — 우선순위 따라 첫 가능한 것만 실행
    strategy:
      - id:    "use_scenario6_keep"
        order: 1
        description: "시나리오 6 이 등록한 [AUTO_KEEP] 운용 프로세스를 검색해서 선택"
        condition: "search 'AUTO_KEEP' 결과 행 존재"
        actions:
          - "search box 에 '[AUTO_KEEP]' 입력 + 검색"
          - "결과 첫 행 클릭"
          - "확인 버튼 클릭"

      - id:    "fallback_notepad"
        order: 2
        description: "[AUTO_KEEP] 없으면 'notepad.exe' (Windows 기본) 검색해서 선택"
        condition: "use_scenario6_keep 조건 X & search 'notepad.exe' 결과 행 존재"
        actions:
          - "search box 에 'notepad.exe' 입력 + 검색"
          - "결과 첫 행 클릭"
          - "확인 버튼 클릭"

      - id:    "fallback_add_new"
        order: 3
        description: "위 둘 다 없으면 'notepad.exe' 신규 등록 (4단계 모달 호출)"
        condition: "fallback_notepad 조건 X"
        actions:
          - "button#addItemBtn ('프로세스 추가') 클릭 → 4단계 모달 출현"
          - "4단계 모달에서 'notepad.exe' 등록 (상세 selector 미확인 — Chrome MCP 추후 조사)"
          - "등록 후 process_picker 로 복귀 → 검색 → 선택 → 확인"
        chrome_mcp_status: "TODO — 4단계 모달 DOM 미조사"

  # ──────────────────────────────────────────────────────────────────────────────
  # 태그 모드 (tag_single_select) selection_flow — v20 추가 (사용자 결정 2026-05-12)
  # 정책 정리: "어차피 추가-삭제 라이프사이클 짧음 → fallback 신규 등록 흐름 불필요"
  # ──────────────────────────────────────────────────────────────────────────────
  selection_flow_tag:
    policy: "endpoint_pass_through"
    description: |
      태그 picker 자체 검증은 npouch_tag 페이지 책임 (DRY 원칙).
      제어 스위트는 "선택 → 메인 모달 itemTagList 등록" endpoint 만 검증.
      태그는 정책 적용 후 곧바로 삭제 라이프사이클이라 fallback 신규 등록 단계 생략.

    strategy:
      - id:    "use_scenario6_keep_tag"
        order: 1
        description: "시나리오 6 이 등록한 [AUTO_KEEP]_tag_* 검색해서 선택"
        condition: "search '[AUTO_KEEP]' 결과 행 존재"
        actions:
          - "input[placeholder='태그 이름'] 에 '[AUTO_KEEP]' 입력"
          - "검색 트리거 (Enter — 프로세스 picker 와 동일 패턴 가정)"
          - "결과 첫 행 radio 선택"
          - "확인 버튼 클릭"

      - id:    "fallback_first_row"
        order: 2
        description: "[AUTO_KEEP] 없으면 picker 첫 행 그대로 선택 (시스템 기존 태그 — 항상 1건 이상 존재 가정)"
        condition: "use_scenario6_keep_tag 조건 X"
        actions:
          - "(검색 생략) — picker 첫 행 radio 선택"
          - "확인 버튼 클릭"
        rationale: |
          Chrome MCP 검증 (2026-05-12): 시스템에 116건 태그 기 등록. 0건 상태는 신규 환경에서나 발생 가능.
          태그는 정책 적용 후 삭제할 데이터라 어떤 태그든 빌려 써도 사이드이펙트 없음.

# ──────────────────────────────────────────────────────────────────────────────
# 2차 모달 4: 예약어 (특수폴더) 선택 — selectReservedWordControl
# process_modal 의 "특수폴더" 버튼 클릭 시 출현. 캐시폴더 영역의 다중 선택 picker.
# Chrome MCP 확인 (2026-05-12) — 11개 예약어
# ──────────────────────────────────────────────────────────────────────────────
special_folder_picker:
  id:       "selectReservedWordControl"
  title:    "예약어"
  sel:      "div#selectReservedWordControl"
  sel_open: "div#selectReservedWordControl.in"

  table:
    headers: ["예약어 명", "설명"]
    select_input: "input[type='checkbox'][name='selectReservedWord']"
    cardinality: "1..N"  # 다중 선택

  # 11개 예약어 (Chrome MCP 검증 — code/desc 사실 그대로)
  reserved_words:
    - {code: "[/DESKTOP/]",        desc: "바탕화면"}
    - {code: "[/MYDOC/]",          desc: "내문서"}
    - {code: "[/FAVORITES/]",      desc: "즐겨찾기"}
    - {code: "[/USER/]",           desc: "%USERPROFILE%"}
    - {code: "[/APPDATA/]",        desc: "User\\AppData\\Roaming"}
    - {code: "[/LOCAL_APPDATA/]",  desc: "%USERPROFILE%\\AppData\\Local"}
    - {code: "[/COMPUTERNAME/]",   desc: "실행 중인 컴퓨터의 이름 (EX. DESKTOP-70D7BB0)"}
    - {code: "[/MACADDR/]",        desc: "실행 중인 컴퓨터의 MAC Address"}
    - {code: "[/USERID/]",         desc: "로그인한 클라이언트 아이디"}
    - {code: "[/DNAME/]",          desc: "드라이브 이름으로 드라이브를 선택 (EX. [/DNAME/]Data:\\Bkup > J:\\Bkup)"}
    - {code: "[/DMODEL/]",         desc: "드라이브 모델로 드라이브를 선택 (EX. [/DMODEL/]TANDBERG RDX USB[0]:\\Bkup > G:\\Bkup, 디스크 속성에 표기)"}

  actions:
    confirm: "button.btn-primary"   # "확인" — 선택한 예약어 → process_modal 의 cacheFolderList 에 추가
    cancel:  "button.btn-default"   # "취소"

# ──────────────────────────────────────────────────────────────────────────────
# 2차 모달 3: 웹 제한 목록 추가 (controlSuiteWebRestricList)
# 메인 모달 "웹 제한기능 > +" 버튼 클릭 시 출현.
# Chrome MCP 확인 (2026-05-12)
# 참고: 모달 id 의 'Restric' 는 제품 코드 typo (Restrict 가 정상 표기) — 사실 그대로 기록
# ──────────────────────────────────────────────────────────────────────────────
web_restrict_modal:
  id:       "controlSuiteWebRestricList"
  title:    "웹 제한 목록 추가"
  sel:      "div#controlSuiteWebRestricList"
  sel_open: "div#controlSuiteWebRestricList.in"

  # dt 라벨 7개 (Chrome MCP 확인)
  sections:
    - "웹 제한 이름"
    - "적용 프로세스"
    - "적용 URL"
    - "업로드 시 암호화"
    - "업로드 허용 확장자"
    - "업로드 제한용량"
    - "설명"

  # 필드 (화면 순서)
  fields:
    - {id: "webRestrictName",       type: "text",     label: "웹 제한 이름",    required: true,  order: 10}

    # 적용 프로세스 영역 — process_picker (multi_select 모드) 호출
    # Chrome MCP 확인 (2026-05-12) — notepad.exe 1건 추가 후 테이블 1행 등록 검증
    - section: "적용 프로세스"
      desc: "프로세스 목록 (다중 선택) + 기본폴더/권한 sub-controls"
      order: 20
      result_table:
        headers: ["프로세스 이름", "서명 유무", "SHA2 유무", "삭제"]
        sample_row: "notepad.exe | X | X | (삭제 버튼)"
      controls:
        - {id: "addWebRestrictProcess",     type: "button", label: "프로세스 추가",
           target: "process_picker", target_modal_id: "globalProcessList", mode: "multi_select",
           note: "Chrome MCP 확인 (2026-05-12) — process_modal 의 csuProcessBtn 과 같은 picker 컨테이너지만 체크박스 모드로 열림 (다중 선택 가능)"}

        # 기본폴더 지정 (텍스트 + 토글)
        - {id: "basePath",                  type: "text",   label: "기본폴더 지정", maxlength: null}
        - {id: "isProcessOption",           type: "toggle_checkbox", label: "기본폴더 지정 토글",
           dom: "label.switch > input#isProcessOption",
           note: "사용자 알림 (2026-05-12): isProcessOption ON 상태여야 #optionTextBtn (▼) expand 동작 활성. 즉 권한 변경 UI 노출 사전조건."}

        # 기타 프로세스 권한 (in-place text + 라디오 영역 expand 패턴)
        # Chrome MCP 확인 (2026-05-12): #optionTextBtn 클릭으로 #processAuthDiv + #otherFolderAccessAuthDiv 보임/숨김 토글
        - {id: "processAuthText",           type: "text_display", label: "기타 프로세스 권한 현재값", default_text: "읽기"}
        - {name: "processAuth",             type: "radio",        label: "기타 프로세스 권한 (#processAuthDiv 안)",
           tooltip: "프로세스에 등록되지 않는 프로세스가 기본폴더로 접근 시 갖게 될 권한설정 (.noticeSymbol title)",
           options:
             - {value: "1", label: "거부"}
             - {value: "2", label: "읽기", default_checked: true}
             - {value: "3", label: "쓰기"}
          }
        - {id: "otherFolderAccessAuthText", type: "text_display", label: "타폴더 접근권한 현재값", default_text: "거부"}
        - {name: "otherFolderAccessAuth",   type: "radio",        label: "타폴더 접근권한 (#otherFolderAccessAuthDiv 안)",
           tooltip: "등록된 프로세스가 기본폴더 외에 다른 폴더로 접근에 대한 사용 권한 설정 (.noticeSymbol title)",
           options:
             - {value: "1", label: "거부", default_checked: true}
             - {value: "2", label: "읽기"}
             - {value: "3", label: "쓰기"}
          }
        - {id: "optionTextBtn",             type: "expand_button", label: "권한 옵션 펼치기 (▼)",
           dom: "div.arrowBtnWrap > button#optionTextBtn",
           sibling_targets: ["#processAuthDiv", "#otherFolderAccessAuthDiv"],
           expand_behavior: "클릭 시 sibling 두 div display: none → flex (각 26px). 라디오 그룹 UI 노출."
           note: "Chrome MCP 검증 (2026-05-12) — 사용자 흐름: isProcessOption ON → ▼ 클릭 → 권한 라디오 선택 가능"}

        # 라디오 변경 → inline text 동기화 (reaction 검증)
        # Chrome MCP 한계 (2026-05-12): JS .click() 으로 ng-change watch 미동작 → trusted event 만 sync 발화.
        # 자동화 테스트는 page.locator(...).click() (Playwright 의 trusted dispatch) 사용 권장.
        - reaction:
            id: "process_auth_text_sync"
            label: "기타 프로세스 권한 라디오 → processAuthText sync"
            radio_name: "processAuth"
            text_target: "#processAuthText"
            mapping: {v1: "거부", v2: "읽기 (default)", v3: "쓰기"}
            chrome_mcp_verified: 2026-05-12
            note: "v3 클릭 trusted event → text='쓰기' 확인. JS .click() 으로는 sync 미동작 (AngularJS ng-change 제약)."
        - reaction:
            id: "other_folder_access_text_sync"
            label: "타폴더 접근권한 라디오 → otherFolderAccessAuthText sync"
            radio_name: "otherFolderAccessAuth"
            text_target: "#otherFolderAccessAuthText"
            mapping: {v1: "거부 (default)", v2: "읽기", v3: "쓰기"}
            chrome_mcp_verified: 2026-05-12
            note: "mapping 가설은 dts 순서 ['거부','읽기','쓰기'] 와 default v1=거부 기반. trusted event 자동화로 재확정 필요."

    # 적용 URL — toggle 종속 (Chrome MCP 검증 2026-05-12)
    - section: "적용 URL"
      order: 30
      controls:
        - {id: "isUrl",             type: "toggle_checkbox", label: "적용 URL 토글",
           dom: "label.switch > input#isUrl",
           dependent_controls: ["isDataDecrypt[0]", "isDataDecrypt[1]", "attachAllowUrl", "attachAllowUrlBtn"],
           verified:
             - "OFF: 모든 종속 disabled=true, ra0(허용 URL) checked default"
             - "ON:  모든 종속 disabled=false"}
        - {name: "isDataDecrypt",   type: "radio",    label: "URL 모드",
           options:
             - {value: "0", label: "허용 URL",       default_checked: true}
             - {value: "1", label: "복호화 대상 지정"}
           reaction:
             desc: "isDataDecrypt=1 (복호화 대상 지정) 선택 → isFileUploadEncrypt 자동 checked=true + disabled=true (해제 불가)"
             chrome_mcp_verified: 2026-05-12
             severity: "must_test"   # 회귀 위험: 복호화-암호화 연계 깨지면 데이터 무결성 문제
          }
        - {id: "attachAllowUrl",    type: "text",    label: "URL 입력",     placeholder: "URL을 입력하세요", depends_on: "isUrl"}
        - {id: "attachAllowUrlBtn", type: "button",  label: "URL 추가 (tag_input)"}

    # 업로드 시 암호화
    - {id: "isFileUploadEncrypt",   type: "checkbox", label: "업로드 시 암호화", default: false, order: 50}

    # 업로드 허용 확장자 — tag_input
    - section: "업로드 허용 확장자"
      order: 60
      controls:
        - {id: "allowFileExtention",   type: "text",   label: "확장자 입력",  placeholder: "확장자를 입력하세요",
           note: "DOM id 의 'Extention' 는 제품 코드 typo (Extension 이 정상). 사실 그대로 기록."}
        - {id: "addAllowFileExtention", type: "button", label: "확장자 추가", note: "id 도 동일 typo (Extention)"}

    # 헤더 체크 기능 사용 — 독립 checkbox (업로드 제한용량과 무관)
    # Chrome MCP 확인 (2026-05-12): ON/OFF 모두 uploadLimitSize.disabled=false 유지 (독립 기능)
    - {id: "isAllowFileHeaderCheck", type: "checkbox", label: "헤더 체크 기능 사용",
       tooltip: "등록된 확장자를 대상으로 통합정책에서 등록된 헤더와 매칭하여 확장자에 대한 헤더 정보를 확인 (.noticeSymbol title)",
       default: false, order: 65,
       note: "v10/v11 에서 '업로드 제한용량 enable 토글' 로 잘못 추정 — 사실 별도 독립 기능"}

    # 업로드 제한용량 영역 — text 단독 (별도 enable 토글 없음, 단독 활성)
    - section: "업로드 제한용량"
      order: 70
      controls:
        - {id: "uploadLimitSize",        type: "text",     label: "제한 용량",
           note: "Chrome MCP 확인 (2026-05-12) — 별도 enable 토글 없이 단독으로 입력 가능 (disabled=false)"}

    # 설명
    - {id: "description",           type: "textarea", label: "설명", order: 90}

  # 확인 버튼
  actions:
    confirm: "button.btn-primary.btn-sm"   # "확인" — 메인 모달 itemWebRestrictList 에 등록

  # 미조사 항목
  todo:
    - "isProcessOption OFF 시 basePath input + ▼ 버튼 실 disabled 여부 검증 (현재 basePath.disabled=false 관찰됨 — ON 영향 불확정)"
    - "otherFolderAccessAuth 라디오 매핑 trusted event 재확정 (JS click 으로는 ng-change 미동작)"

# ──────────────────────────────────────────────────────────────────────────────
# 알림(메시지) 모달 유형 — Chrome MCP 2026-05-18 직접 검증
# 본 페이지는 알림 모달이 2 종류 존재. 자동화 시 두 ID 모두 검사 필수.
# ──────────────────────────────────────────────────────────────────────────────
message_modal_dialogs:
  # ─── 1) 메인/sub-modal 의 표준 confirm 메시지 ───────────────────────────
  - id:           "main_confirm_modal"
    modal_id:     "__globalMessageModal"
    sel:          "div#__globalMessageModal"
    sel_open:     "div#__globalMessageModal.in"
    body_sel:     "div#__globalMessageModal .modal-body"
    close_btn:    "div#__globalMessageModal button[data-dismiss='modal']"
    used_for:
      - "메인 모달 csuName 빈값/중복 차단"
      - "메인 모달 '추가'/'수정' 저장 성공/실패 메시지"
      - "web_restrict_modal 이름 빈값/적용 프로세스 0건 차단"
      - "기타 표준 confirm 모든 케이스"
    chrome_mcp_verified: 2026-05-12

  # ─── 2) sub-modal 내부 tag_input 등 즉시 검증 알림 ──────────────────────
  - id:           "registered_folder_warning"
    modal_id:     "registeredFolderWarning"
    sel:          "div#registeredFolderWarning"
    sel_open:     "div#registeredFolderWarning.in"
    body_sel:     "div#registeredFolderWarning .modal-body-text"
    close_btn:    "div#registeredFolderWarning button.btn-default"
    used_for:
      - "process_modal IP+Port 조합 중복 — '이미 등록된 IP와 Port 입니다'"
      - "process_modal 확장자 중복 (tag_input dup) — '이미 동일한 확장자가 존재합니다'"
      - "web_restrict_modal URL 중복 — '이미 등록된 폴더 경로가 존재합니다.' (typo)"
      - "메인 모달 확장자/전자서명 tag_input dup 등"
      - "기타 tag_input 즉시 검증 케이스 다수"
    chrome_mcp_verified: 2026-05-18
    note: |
      sub-modal 내부 검증 알림은 본 ID 사용 (.modal-body-text 텍스트 + .btn-default 닫기).
      class 패턴 차이:
        - main_confirm_modal: .modal-wrap.in 또는 .modal.in
        - registered_folder_warning: 단순 .in (modal/modal-wrap 클래스 없음)
      자동화 selector 는 OR 로 두 ID 동시 매칭 필수.

  # ─── 3) input 빈값/invalid 자동 reset 알림 (본서버 발견 2026-05-19) ─────
  - id:           "null_entered_warning"
    modal_id:     "nullEnteredWarning"
    sel:          "div#nullEnteredWarning"
    sel_open:     "div#nullEnteredWarning.in"
    body_sel:     "div#nullEnteredWarning .modal-body-text, div#nullEnteredWarning .modal-body"
    close_btn:    "div#nullEnteredWarning button.btn-default"
    class_pattern: "단순 .in (modal/modal-wrap 클래스 없음 — registeredFolderWarning 와 동일 패턴)"
    used_for:
      - "IP input 비숫자/invalid → input reset → '허용할 IP를 입력해주세요'"
      - "IP input 빈값 + 추가 → 동일 메시지"
      - "기타 input 빈값 검증 추정 (확장자/Port/URL 등 — 추가 검증 필요)"
    chrome_mcp_verified: 2026-05-19 (본서버 innotium.iptime.org:14180)

  # ─── 4) process picker 중복 / 확장자 중복 알림 (본서버 발견 2026-05-19) ─
  - id:           "registered_process_extention_warning"
    modal_id:     "registeredProcessExtentionWarning"
    sel:          "div#registeredProcessExtentionWarning"
    sel_open:     "div#registeredProcessExtentionWarning.in"
    body_sel:     "div#registeredProcessExtentionWarning .modal-body-text"
    close_btn:    "div#registeredProcessExtentionWarning button.btn-default"
    used_for:
      - "process picker 동일 프로세스 재선택 → '이미 등록된 프로세스 입니다' (yaml :1234 modal_id 잘못 기록 → 실제 별도 ID)"
      - "process_modal/태그 mode picker 동일 패턴"
    chrome_mcp_verified: 2026-05-19
    note: |
      yaml :1234 의 modal_id: "__globalMessageModal" 는 잘못 기록.
      실제 알림 ID = registeredProcessExtentionWarning (별도 modal).
      sc3i 의 process picker 중복 검증 WARN ("메시지 미노출") 의 진짜 원인이었음.

  # ─── 자동화 selector 통합 규칙 (page object 적용) ────────────────────────
  unified_selectors:
    sel_open:  "div#__globalMessageModal.in, div#registeredFolderWarning.in, div#nullEnteredWarning.in, div#registeredProcessExtentionWarning.in"
    sel_body:  "div#__globalMessageModal .modal-body, div#registeredFolderWarning .modal-body-text, div#nullEnteredWarning .modal-body-text, div#nullEnteredWarning .modal-body, div#registeredProcessExtentionWarning .modal-body-text, div#registeredProcessExtentionWarning .modal-body"
    sel_close: "div#__globalMessageModal.in button:has-text('확인'), div#registeredFolderWarning.in button.btn-default, div#nullEnteredWarning.in button.btn-default, div#registeredProcessExtentionWarning.in button.btn-default"
    note: "4개 알림 모달 OR — NpouchControlSuitePage 의 SEL_CONFIRM_* 상수에 반영됨. 2026-05-19 본서버 검증으로 2종 추가."


# ──────────────────────────────────────────────────────────────────────────────
# 입력 검증 규칙 (validation_rules) — Chrome MCP 실증 메시지
# tag_input 동작 검증 중 발견된 경고 메시지. 시나리오 3 (비정상 케이스) 영역에 포함.
# ──────────────────────────────────────────────────────────────────────────────
validation_rules:
  # ─── 필수 입력 검증 (Chrome MCP e2e 캡처 2026-05-12) ─────────────────────
  - id:       "main_modal_csu_name_empty"
    scope:    "메인 모달 (#controlSuite)"
    target:   "input#csuName"
    trigger:  "빈 csuName 으로 '추가' 버튼 클릭"
    expected_message: "이름을 입력해 주세요."
    modal_id: "__globalMessageModal"
    severity: "must_test"
    chrome_mcp_verified: 2026-05-12

  - id:       "main_modal_csu_name_duplicate"
    scope:    "메인 모달 (#controlSuite)"
    target:   "input#csuName"
    trigger:  "기존 등록명 입력 후 '추가' 클릭 (사용 예: 'smpark_제어스위트!!')"
    expected_message: "이미 등록된 이름 입니다."
    modal_id: "__globalMessageModal"
    severity: "must_test"
    chrome_mcp_verified: 2026-05-12

  - id:       "process_modal_no_process_selected"
    scope:    "process_modal (#controlSuiteProcessList)"
    target:   "button#csuProcessBtn"
    trigger:  "프로세스/태그 미선택 상태에서 process_modal '확인' 클릭"
    expected_message: "선택된 프로세스가 없습니다."
    modal_id: "__globalMessageModal"
    severity: "must_test"
    chrome_mcp_verified: 2026-05-12

  - id:       "process_picker_duplicate_in_individual_tab"
    scope:    "process_picker (globalProcessList, single_select 모드)"
    target:   "input[name='selectProcess']:checked"
    trigger:  "이미 한 스위트의 itemList 에 등록된 프로세스를 picker 에서 다시 선택 + 확인"
    expected_message: "이미 등록된 프로세스 입니다"
    modal_id: "__globalMessageModal"
    severity: "must_test"
    chrome_mcp_verified: 2026-05-12
    note: "picker '확인' 단계에서 차단 — picker 닫히지 않고 알림만 출현"

  - id:       "process_picker_duplicate_in_tag_tab"
    scope:    "process_picker (globalProcessList, tag_single_select 모드)"
    target:   "input[name='selectProcessTag']:checked"
    trigger:  "이미 한 스위트의 itemTagList 에 등록된 태그를 picker 에서 다시 선택 + 확인"
    expected_message: null   # silent skip 패턴 (프로세스 모드와 정책 다름)
    expected_behavior: "picker 닫힘 + process_modal 의 span#csuProcessName 이 '태그 미선택' 으로 되돌림"
    modal_id: null
    severity: "warn"
    chrome_mcp_verified: 2026-05-12
    note: |
      프로세스 picker 의 명시적 알림 차단과 다른 정책. UX 모호 — 검수자 확인 필요.
      inspection_notes 의 duplicate_policy_inconsistency 참조.

  - id:       "web_restrict_modal_no_process_selected"
    scope:    "web_restrict_modal (#controlSuiteWebRestricList)"
    target:   "div#controlSuiteWebRestricList table tbody tr"
    trigger:  "적용 프로세스 0건 상태에서 web_restrict_modal '확인' 클릭"
    expected_message: "선택된 프로세스가 없습니다."
    modal_id: "__globalMessageModal"
    severity: "must_test"
    chrome_mcp_verified: 2026-05-12
    note: |
      검증 우선순위: 적용 프로세스 ≥ 1건 (먼저) > webRestrictName 입력 (그 다음).
      빈 이름 + 빈 프로세스 → 프로세스 메시지가 먼저.

  - id:       "web_restrict_modal_name_empty"
    scope:    "web_restrict_modal (#controlSuiteWebRestricList)"
    target:   "input#webRestrictName"
    trigger:  "적용 프로세스 ≥ 1건 + 빈 webRestrictName 으로 '확인' 클릭"
    expected_message: "이름을 입력해 주세요."
    modal_id: "__globalMessageModal"
    severity: "must_test"
    chrome_mcp_verified: 2026-05-12

  - id:       "web_restrict_cross_instance_duplicate"
    scope:    "web_restrict picker 확인 시점"
    target:   "globalProcessList (multi_select) → 확인"
    trigger:  "다른 웹제한 인스턴스에 이미 등록된 프로세스를 새 인스턴스에 적용 시도"
    expected_message: "{process_name}은 이미 등록되어 있어 생략되었습니다.(타 웹제한 포함)"
    sample_message: "111bug_process.exe은 이미 등록되어 있어 생략되었습니다.(타 웹제한 포함)"
    message_pattern: "(.+)은 이미 등록되어 있어 생략되었습니다\\.\\(타 웹제한 포함\\)"
    modal_id: "__globalMessageModal"
    severity: "must_test"
    chrome_mcp_verified: 2026-05-12
    behavior:
      - "picker 확인 클릭 → 알림 출현 + picker 닫힘"
      - "web_restrict_modal 의 적용 프로세스 테이블에 행 추가 안 됨 (생략 동작)"
    note: |
      제품 안내 텍스트 (web_restrict_modal 적용 프로세스 영역):
        "※ 웹 제한기능에 등록된 모든 프로세스 중복 불가"
      안내 텍스트와 실제 동작 일치 — cross-instance 검사 정상 작동.
      메시지에 프로세스 이름이 동적 삽입되므로 자동화 검증 시 {process_name} 변수 치환 필요.

  # ─── 기존 tag_input 검증 (Chrome MCP 2026-05-12) ────────────────────────
  - id:       "allow_extension_empty"
    target:   "input#allowExtensionInput"
    trigger:  "빈값 상태에서 추가 버튼 클릭"
    expected_message: "확장자를 입력하세요"
    severity: "warn"
    chrome_mcp_verified: 2026-05-12

  - id:       "allow_extension_invalid_char"
    target:   "input#allowExtensionInput"
    trigger:  "특수문자(. * ; ? 외) 또는 한글 포함 확장자 입력 후 추가"
    expected_message: ". * ; ? 이외의 특수문자 또는 한글이 포함된 확장자는 제외합니다."
    severity: "warn"
    allowed_chars_note: "확장자 문자열은 영숫자 + '.' '*' ';' '?' 만 허용"
    chrome_mcp_verified: 2026-05-12

  - id:       "allow_extension_multi_register"
    target:   "input#allowExtensionInput"
    trigger:  "세미콜론(;) 으로 구분한 다중 확장자 입력 후 추가"
    behavior: "한 번 추가 클릭으로 여러 확장자가 일괄 등록됨"
    example_input: "123;234;456"
    expected_result: "container 안에 3개 태그 (123, 234, 456) 등록"
    severity: "info"
    source: "사용자 알림 (2026-05-12) — 직접 PoC 미검증 (CDP type 이 ng-model 미트리거 한계)"

  # 중복 확장자 추가 시도 (랜섬크런처 동일 패턴 예상 — 미검증)
  # - id:       "allow_extension_duplicate"
  #   trigger:  "이미 등록된 확장자 재추가"
  #   expected_message: "이미 동일한 확장자가 존재합니다."   # ransom_detect_policy 동일 패턴 추정
  #   chrome_mcp_verified: TODO

# ──────────────────────────────────────────────────────────────────────────────
# 검수자 주의 사항 (inspection_notes)
# 최근 추가됐는데 별도 안내/설명이 부족한 기능 영역. 검수 시 의미 오해 가능성.
# 자동 분류만으로는 "왜 이런 구조인지" 알 수 없으니 yaml 에 명시.
# ──────────────────────────────────────────────────────────────────────────────
inspection_notes:
  - id:      "special_folder_picker_multi_select_merge"
    label:   "특수폴더 다중 선택 → list 등록 시 1건 병합 (의도된 다중 경로 가능성)"
    targets:
      - "div#selectReservedWordControl"
      - "div#cacheFolderInput"
      - "div#cacheFolderList"
    summary: |
      Chrome MCP 검증 (2026-05-13):
        예약어 모달에서 [/DESKTOP/] + [/FAVORITES/] 다중 체크 → 확인 →
        cacheFolderInput 안에 inline tag 2개 분리 표시 정상.
        '추가' 클릭 → cacheFolderList 에 button.tagInput 1개만 생성,
        span data-cache-folder = "[/DESKTOP/][/FAVORITES/]" (두 문자열 병합).
      → 사용자 의견 (2026-05-13): 의도된 기능일 수 있음 — 여러 루트(경로)를
        한 항목에 묶어서 등록하는 디자인. 1개 항목으로 N개 경로를 표현.
      → 시나리오 4 EDIT 재오픈 시 표시 방식 확인하면 의도/버그 판별 가능.
    severity: "info"
    chrome_mcp_verified: 2026-05-13

  - id:      "description_server_limit_300"
    label:   "description (설명) 서버 제한 = 300자 (DOM maxlength 없음)"
    targets:
      - "textarea#description (process_modal)"
      - "textarea#description (web_restrict_modal — 동일 추정)"
    summary: |
      Chrome MCP 검증 (2026-05-13):
        process_modal description 에 1000자 입력 + 확인 클릭 →
        "설명의 입력 가능 글자수는 최대 300자 까지 가능합니다." 알림 + 등록 차단
      → DOM maxlength 없음, server-side 검증으로 차단.
      → 300자 이하 입력 시 정상 저장.
    severity: "info"
    chrome_mcp_verified: 2026-05-13

  - id:      "cache_folder_no_multi_separator"
    label:   "cache_folder 는 ; 다중 구분자 미적용 — 의도된 동작 (단일 경로 처리)"
    targets:
      - "div#cacheFolderInput"
      - "button#attachCacheFolderBtn"
    summary: |
      Chrome MCP 검증 (2026-05-13):
        입력 "C:\\path1;C:\\path2;C:\\path3" + 추가 → 1건으로 그대로 등록 (분리 X).
        확장자 input 의 ';' 다중 분리와 다른 정책. cacheFolder 는 단일 경로 처리.
      → 사용자 결정 (2026-05-13): cache_folder 는 ';' 검증/분리 X — 의도된 동작.
        경로 안에 ';' 포함 가능성 (특수폴더 [/COMPUTERNAME/] 등) 고려한 디자인 추정.
    severity: "intended"
    chrome_mcp_verified: 2026-05-13

  - id:      "cache_folder_no_duplicate_check"
    label:   "cache_folder 중복 검증 없음 (정책 일관성 결여)"
    targets:
      - "div#cacheFolderInput"
      - "button#attachCacheFolderBtn"
    summary: |
      Chrome MCP 검증 (2026-05-13):
        cacheFolderInput 에 "C:\\test_dup" 입력 + 추가 → 정상 등록 (1행)
        같은 "C:\\test_dup" 다시 입력 + 추가 → **알림 없이 정상 등록 (2행)** — 중복 차단 안 함.
      → 다른 tag_input (IP/Port/확장자) 은 중복 차단 메시지 표시하는데 cache_folder 만 허용.
      → 사용자가 의도치 않게 중복 폴더 등록 가능 — 데이터 정합성 문제 추정.
      → 빈값 추가 시도 시에는 알림 정상 출현 ("폴더 이름을 입력해 주세요.")
    severity: "warn"
    chrome_mcp_verified: 2026-05-13

  - id:      "web_restrict_no_edit_branch"
    label:   "web_restrict_modal 은 EDIT 분기 없음 — 항상 ADD 흐름 (제목/메시지 동일)"
    targets:
      - "div#controlSuiteWebRestricList"
      - "td#webRestrictName (메인 모달의 list 행)"
    summary: |
      Chrome MCP 검증 (2026-05-13) — 기존 web_restrict 행 td 클릭으로 진입:
        - 모달 제목: "웹 제한 목록 추가" (수정 X — ADD 그대로)
        - 빈 webRestrictName + 확인 → "이름을 입력해 주세요." (ADD 와 동일)
      → web_restrict 의 sub-modal 은 EDIT 분기가 별도 없음 — 항상 ADD 흐름으로 작동.
        단 기존 값은 정상 로드됨 (webRestrictName="[AUTO]_web_v4" 보존).
      → 메인 모달 (csuName 빈값 → "정책 이름을 입력해 주세요." EDIT 차이) 과 다름.
      → 시나리오 4 의 web_restrict 검증 정책: EDIT 분기 가정 X, ADD 와 동일 시나리오 적용.
