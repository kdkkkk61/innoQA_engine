  - id:      "auth_text_sync_once_only"
    label:   "권한 라디오 → inline text sync 첫 변경만 — 제품 buggy 확정 (2026-05-13)"
    targets:
      - "input[name='processAuth']"
      - "input[name='otherFolderAccessAuth']"
      - "span#processAuthText"
      - "span#otherFolderAccessAuthText"
    context: |
      웹제한 모달 안 적용 프로세스 영역의 권한 설정.
        - processAuth (기타 프로세스 권한): 거부=1 / 읽기=2 default / 쓰기=3
        - otherFolderAccessAuth (타폴더 접근권한): 거부=1 default / 읽기=2 / 쓰기=3
      ▼ (#optionTextBtn) 클릭으로 라디오 영역 expand → 라디오 선택 → ▼ collapse 시 inline text 갱신.
    summary: |
      Chrome MCP 재검증 (2026-05-13) — trusted CDP click 사이클:
        클릭 v3 (쓰기): radio.checked V=3, span '쓰기' ✓ (첫 sync 성공)
        클릭 v1 (거부): radio.checked V=1, span '쓰기' stuck ✗
        클릭 v2 (읽기): radio.checked V=2, span '쓰기' stuck ✗
        ▼ collapse 시도:  radio.checked V=2, span '쓰기' stuck ✗
      → trusted event 로도 stuck — **자동화 한계 아님, 제품 buggy 확정**.
      → AngularJS ng-change watch 가 첫 한 번만 fire 되는 패턴.
      → 라디오 상태와 inline text 가 불일치 — 사용자 UX 혼란 + 저장값 신뢰성 의문.
      → 시나리오 4-3 EDIT 재오픈 시 저장값 (라디오 V 기준? text 기준?) 확정 필요.
    severity: "must_test"   # 자동화 격상 (2026-05-13)
    chrome_mcp_verified: 2026-05-13
    severity_changed_history:
      - {date: "2026-05-12", severity: "warn", reason: "자동화 한계 가설 포함"}
      - {date: "2026-05-13", severity: "must_test", reason: "trusted CDP click 으로도 stuck — 제품 buggy 확정"}
    save_value_check_required: |
      EDIT 재오픈 시 저장된 권한이 라디오 V 기준 vs 첫 stuck text 기준 어느 게 저장되는지 검증.
      만약 라디오 V 기준 저장이면 UI 만 stuck (저장값 정상) — 표시 회귀.
      만약 text 기준 저장이면 데이터 손상 — 심각 회귀.

