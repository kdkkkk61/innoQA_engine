        sub_modal: null
        main_save: "서버에서 오류가 발생 하였습니다."
        modal_id: "__globalMessageModal"
        severity: "ux_defect"
        verified_2026_05_19: true
      severity: "Port -1 + 빈값 = UX 결함 (sub-modal OK → 메인 저장 시 서버 차단). 제품 권고: sub-modal 단계에서 차단"

  # 본 서버 mcp 재검증 완료 항목 (2026-05-19 — 모두 verified)
