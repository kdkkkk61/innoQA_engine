    severity: "must_test"
    scopes_verified: ["process_modal", "web_restrict_modal"]

  allow_url_mode_combinations:
    description: |
      web_restrict 의 적용 URL 토글 ON 상태에서 라디오/암호화 조합 검증:
        - ra0 (허용 URL) 선택 + isFileUploadEncrypt:
            isFileUploadEncrypt 자유 체크 가능 (disabled=false)
            → 사용자 의문 "허용 URL + 업로드 시 암호화 조합 가능?" → 가능 확인 ✓
        - ra1 (복호화 대상 지정) 선택 + isFileUploadEncrypt:
            자동 체크 + disabled=true (강제 활성 + 해제 불가)
