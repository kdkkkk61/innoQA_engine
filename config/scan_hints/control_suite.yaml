        - input 자동 비워짐 (inputAfter="")
        - list 변화 없음 (기존 3건 유지)
        - process_modal 안 닫힘 (계속 작업 가능)
      → 사용자 의문 "동일 확장자 넣으면 꺼지는거엿나" 에 대한 답:
        모달 자체는 안 꺼지고 input 만 reset (다시 다른 값 입력 가능 상태).
