    - {area: "special_folder_multi_select_merge (must_test)", note: "다중 체크 → 1건 병합 등록 동일 (yaml :198)"}
    - {area: "duplicate_extension_input_reset", note: "확장자 중복 알림 동일 (yaml :155-164)"}
