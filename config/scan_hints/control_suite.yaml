# ══════════════════════════════════════════════════════════════════════
# 제어 스위트 — modal_form 정식 (v42 — draft → 정식 승격 2026-05-13)
# ══════════════════════════════════════════════════════════════════════
# 작성일: 2026-05-12 (v1)
# 갱신일: 2026-05-13 (v42 — web_restrict_no_edit_branch + 메시지 'web_restrict EDIT="이름을 입력해 주세요." (메인은 "정책 이름...") 차이 확정)
# 목적: 기존 list_page 형식 (control_suite.yaml) 을 modal_form 표준으로 변환
#       자동 분류 (B-1 시리즈) 인프라 활용 위함.
#
# Chrome MCP 검증 (2026-05-12):
#   - 모달 id 확정: div#controlSuite.modal-wrap.in
#   - 모달 안 input/textarea 14개 추출 완료
#   - 라벨/maxlength/default/value 사실 확인
#   - notepad.exe 등록 e2e 흐름 검증 완료:
#       메인 + → process_modal → "프로세스 선택" → globalProcessList → 검색 →
#       radio 선택 (input[name="selectProcess"]) → 확인 → process_modal 복귀 →
#       span#csuProcessName 에 "notepad.exe" 바인딩 → 확인 → div#itemList 행 추가
#   - 동일 process_modal 컨테이너가 sub-tab 에 따라 모드 변경 확인
#       (개별 프로세스 ↔ 태그) — pick_btn 텍스트만 토글됨
#
# 미해결 TODO:
#   - 태그 picker 모달 id 미확인 (npouch_tag 사전 등록 후 재시도)
#   - web_restrict_modal: 권한 드롭다운 옵션 / addWebRestrictProcess picker 동일성 확인
#   - 운용 프로세스 신규 등록 4단계 모달 미조사 (fallback_add_new 경로)
#
# 제품 코드 typo (사실 그대로 기록):
#   - 모달 id: controlSuiteWebRestricList (Restrict 가 정상)
#   - 필드 id: allowFileExtention / addAllowFileExtention (Extension 이 정상)
# ══════════════════════════════════════════════════════════════════════

scan_mode: modal_form
page_id:   control_suite

# ──────────────────────────────────────────────────────────────────────────────
# 시나리오 2 sub-scope 구조 (사용자 결정 2026-05-12 — 옵션 B)
# 시나리오 2 책임: 모달 전체의 "필드 존재 / 초기값 / maxlength / 필수 검증 1차"
# 2차 모달도 시나리오 2 안에서 sub-scope 헤더로 분리 (docs/scan-output-format.md tab_sections 패턴 재활용)
# ──────────────────────────────────────────────────────────────────────────────
# ──────────────────────────────────────────────────────────────────────────────
# 시나리오 2/3/4 책임 분리 (사용자 결정 2026-05-12)
# ──────────────────────────────────────────────────────────────────────────────
scenario_responsibilities:
  scenario_3_sub_scope:
    "3-A":
      label: "추가 시점 즉시 검증 (tag_input '추가' 버튼)"
      covers:
        - "확장자/IP/Port/URL 형식·중복·한글·특수문자"
        - "tag_input 빈값 추가 시도"
        - "다중 구분자 ; 분리 여부"
        - "글자수 한도 (50/100/500자) — 추가 시 메시지"
        - "추가-삭제 결합 패턴 (2~3개 추가 후 1건만 남기기)"
    "3-B":
      label: "저장 시점 검증 (process_modal/web_restrict '확인' 버튼)"
      covers:
        - "description 1000자 → '최대 300자' 차단"
        - "cross-instance 프로세스 중복 — picker 확인 시 차단"
        - "필수 필드 빈값 (시나리오 2 와 겹침, 정상 통과 흐름만 시연)"
    test_combination_pattern:
      title: "추가-삭제 결합 검증 (3-A 표준 절차)"
      steps:
        - "2~3개 정상값 추가 (예: txt, doc, exe)"
        - "1개 빼고 모두 삭제 → 1건 잔존 확인"
        - "잔존 1건에 글자수 한도 시도 (50/100/500자) 또는 형식 검증"
        - "한 사이클로 추가/삭제/글자수 검증 일석이조"

  scenario_2:
    label: "입력 구조"
    covers:
      - "모든 필드의 존재 확인 (메인 / process_modal / web_restrict_modal / picker / 예약어)"
      - "초기값 (default) 확인"
      - "DOM maxlength 속성 코드 확인"
      - "필수 검증 1차 (경고 떴는가만)"
      - "고유 이름 중복 검증 (단순 알림 출현 여부)"
    excludes:
      - "글자수 경계 동작 (시나리오 3)"
      - "입력 형식 비정상 케이스 (시나리오 3)"
      - "EDIT 흐름 (시나리오 4)"
      - "저장 후 실제 값 검증 (시나리오 4)"

  scenario_3:
    label: "ADD 흐름 + 동작 검증"
    covers:
      - "정상 ADD 1사이클 (입력 → 저장 → list 행 등록 확인)"
      - "글자수 경계 동작 (100/300/500자 입력 후 결과)"
      - "입력 형식 정상/비정상 (IP/Port/확장자/URL/숫자)"
      - "tag_input 중복 (IP/Port/확장자/URL/cache_folder/예약어)"
      - "다중 구분자 입력 (;)"
      - "라디오 반응 동작 (라벨 sync)"
      - "토글 종속 disabled 동작"
    excludes:
      - "EDIT 모달 진입 흐름 (시나리오 4)"
      - "저장값 정합성 검증 (시나리오 4)"

  scenario_4:
    label: "EDIT 흐름 + 저장 정합성 + ADD-EDIT 회귀 검증"
    covers:
      - "list 행 선택 → modify_btn → EDIT 모달 진입"
      - "EDIT 모달의 모든 필드 값 로드 검증"
      - "4-1: 정상 입력 저장 → EDIT 재오픈 → 값 일치"
      - "4-2: 토글 ON 종속 필드 저장 → EDIT 재오픈 → 종속 값 유지"
      - "4-3: 위반 입력 (필수 비움) 저장 → EDIT 재오픈 → 실제 저장값 확인"
      - "4-4: 시나리오 3 의 모든 동작 EDIT 모달에서 재실행 — ADD-EDIT 차이 발생 회귀 검증"
      - "4-5: 시나리오 3-A pending 14건 추가-삭제 결합 + 글자수 한도 흡수"
    add_edit_regression_policy: |
      사용자 알림 (2026-05-13): 과거 ADD 모달과 EDIT 모달의 동작이 다른 사례 있었음.
      → 시나리오 4 에서는 시나리오 3 의 모든 동작 (라디오/토글/종속/추가-삭제/한글차단/다중분리)
        을 EDIT 모달에서 다시 실행하여 ADD 와 동일하게 작동하는지 회귀 검증.
      → 동작 차이 발견 시 inspection_notes 에 'add_edit_diff_*' id 로 기록.

  # 태그 sub-tab 처리 정책 (사용자 결정 2026-05-12)
  tag_sub_tab_policy: |
    process_modal 의 개별 프로세스 / 태그 sub-tab 은 동일 컨테이너 (controlSuiteProcessList) 의
    모드 변경만 다름. UI 요소는 14필드 + cache_folder + 라디오 모두 동일.
    → 시나리오 2/3/4 모두 두 sub-tab 각각 검증 (2-B-1 / 2-B-2 분리, 시나리오 3/4 동일 패턴).
    → 검증 카드는 1세트 정의 후 sub-tab 별로 entry_flow 만 분기.

# ──────────────────────────────────────────────────────────────────────────────
# 시나리오 3 글자수 경계 검증 정책 (사용자 결정 2026-05-12)
# ──────────────────────────────────────────────────────────────────────────────
scenario_3_pending_3A:
  description: "추가-삭제 결합 패턴으로 한 사이클에 검증 — page class 구현 시 자동 흡수"
  cases:
    - {field: "input#allowExtensionInput",  area: "메인 확장자",         pattern: "추가 3건 → 1건 제외 삭제 → 한도 50/100/500자"}
    - {field: "input#allowExtensionInputP", area: "process_modal 확장자(개별)", pattern: "동일"}
    - {field: "input#allowFileExtention",   area: "web_restrict 확장자", pattern: "동일"}
    - {field: "input#accessAllowIp",        area: "process_modal IP",   pattern: "한글/특수문자 + 한도"}
    - {field: "input#accessAllowPort",      area: "process_modal Port", pattern: "한도"}
    - {field: "input#attachAllowUrl",       area: "web_restrict URL",   pattern: "추가 다건 → 일부 삭제 → 글자수"}
    - {field: "div#cacheFolderInput",       area: "process_modal cache_folder", pattern: "직접 경로 + 특수폴더 picker 혼합 + 일부 삭제"}
    - {field: "input#accessDriveLetter",    area: "process_modal 드라이브 레터", pattern: "C;D;E 형식 + 글자수만"}
    - {field: "input#signExceptInput",      area: "메인 전자서명",      pattern: "영어 패턴 (Claude Sign 등) + 글자수"}
    - {field: "textarea#clipboardAllowUrl", area: "메인 URL 예외",      pattern: "글자수 500/1000자"}
    - {field: "input#customOptionText",     area: "메인 커스텀 옵션값", pattern: "글자수"}
    - {field: "input#webRestrictName",      area: "web_restrict 이름",  pattern: "500자"}
    - {field: "input#basePath",             area: "web_restrict 기본폴더", pattern: "글자수/특수"}
    - {field: "input#uploadLimitSize",      area: "web_restrict 제한용량", pattern: "매우 큰 값 (1B+)"}

# ──────────────────────────────────────────────────────────────────────────────
# 구 빌드 검증 결과 (192.168.11.97:40000, 사용자 console 검증 2026-05-19)
# ──────────────────────────────────────────────────────────────────────────────
scenario_3_legacy_build_findings_2026_05_19:
  server: "192.168.11.97:40000 (구 빌드)"
  verified_by: "사용자 console 검증"
  note: "신 빌드 (192.168.11.74:40000) 와 큰 틀 동일 + 일부 차이. 정확 메시지 본 서버 mcp 재검증 보류."

  # 글자수 한도 검증 결과
  length_boundary:
