    - {area: "process_modal 확장자 ';' 다중 등록", note: "yaml :146 일치 — 3건 일괄 등록"}

  # 본 서버 mcp 재검증 결과 (2026-05-19 innotium.iptime.org:14180)
  main_server_verified_2026_05_19:
    ip_invalid_pattern_2_groups:
