    picker_mode: "tag_single_select"

  - id:      "allow_extension_radio_label_reaction"
    label:   "제어할 확장자 라디오 변경 → 하단 라벨 동기화 (회귀 위험)"
    targets:
      - "input#ALLOW"
      - "input#BLOCK"
      - "span#allowExtensionText"
    summary: |
      ALLOW (확장자 대상지정) 선택 시 → span#allowExtensionText = "차단할 확장자"
      BLOCK (확장자 전체차단) 선택 시 → span#allowExtensionText = "허용할 확장자"
      → 이전에 깨졌던 동작 (사용자 보고, 2026 이전).
      → reaction_tests 섹션에서 자동 검증.
    recently_added: false
    chrome_mcp_verified: 2026-05-12

# ──────────────────────────────────────────────────────────────────────────────
# 라디오 옵션 → 종속 라벨 변경 회귀 검증 (반드시 시나리오에 포함 — 사용자 강조)
# 배경: 저번에 이 동적 라벨 변경이 깨진 이슈 있었음. 회귀 본질 검증 영역.
# Chrome MCP 검증 (2026-05-12):
#   ALLOW 선택 → span#allowExtensionText = "차단할 확장자"
#   BLOCK 선택 → span#allowExtensionText = "허용할 확장자"
# 검증 흐름 (시나리오 3 동작 검증 영역에 포함):
#   1. 모달 열기 (ADD 또는 EDIT)
#   2. ALLOW 클릭 → span#allowExtensionText 텍스트가 "차단할 확장자" 인지 확인
#   3. BLOCK 클릭 → span#allowExtensionText 텍스트가 "허용할 확장자" 로 변경됐는지 확인
#   4. ALLOW 다시 클릭 → 텍스트 "차단할 확장자" 로 복원되는지 확인 (양방향)
#   불일치 시 fail (라벨 변경 누락 = 회귀)
# ──────────────────────────────────────────────────────────────────────────────
# ──────────────────────────────────────────────────────────────────────────────
# 모달 추적 검증 정책 (modal_tracking)
# 사용자 강조 (2026-05-12): "꾸준히 화면 확인 + 어떤 모달이 뜨는지" — 시나리오 핵심.
# 특정 동작 후 출현하는 경고/확인 모달의 텍스트를 검증 항목으로 캡처.
# ──────────────────────────────────────────────────────────────────────────────
modal_tracking:
  policy: |
    모달 안의 모든 액션 (버튼 클릭 / 토글 / 라디오 / 입력) 후
    글로벌 메시지 모달 (div#__globalMessageModal 또는 div.modal.in 추가) 출현 여부 확인.
    출현 시 .modal-body 텍스트 캡처 → validation_rules 와 매칭 → pass/fail 판정.
    매칭 안 되는 신규 메시지 → warn (검수자 확인 필요).

  # 추적 대상 셀렉터 (글로벌 메시지 모달 candidate)
  global_modal_selectors:
    - "div#__globalMessageModal.in"
    - "div.modal.in"   # controlSuite 외 다른 in 모달

  # 추적 시점 — 모든 액션 후 dismiss_warning_dialog 자동 호출 (이미 ctx.dismiss_warning_dialog 패턴 활용)
  trigger_actions:
    - "tag_input 추가 버튼 클릭"
    - "라디오 옵션 변경"
    - "토글 ON/OFF"
    - "모달 제출 버튼 (추가/수정) 클릭"
    - "서브모달 호출 버튼 (+ 버튼) 클릭"

reaction_tests:
  - id:    "allow_extension_label_reaction"
    label: "메인 모달: 제어할 확장자 옵션 변경 시 하단 라벨 동기화"
    radio_name: "isAllowExtension"
    target_selector: "span#allowExtensionText"
    expectations:
      - option_value: "1"   # ALLOW
        expected_text: "차단할 확장자"
      - option_value: "0"   # BLOCK
        expected_text: "허용할 확장자"
    order: 45   # 시나리오 3 동작 검증 영역, radio_group (order 40) 직후

  - id:    "allow_extension_label_reaction_in_process_modal"
    label: "process_modal (개별 프로세스): 제어할 확장자 옵션 변경 시 하단 라벨 + 색상 동기화"
    scope: "process_modal"   # controlSuiteProcessList 안에서만 적용
    radio_name: "isAllowExtensionP"
    target_selector: "span#allowExtensionTextP"
    chrome_mcp_verified: 2026-05-12
    expectations:
      - option_value: "1"   # ALLOWP — "확장자 대상지정"
        expected_text:  "차단할 확장자"
        expected_class: "wid85 redTxt"
      - option_value: "0"   # BLOCKP — "확장자 전체차단"
        expected_text:  "허용할 확장자"
        expected_class: "wid80 blueTxt"
    note: |
      메인 모달의 allow_extension_label_reaction 과 동일 회귀 본질 (사용자 보고 2026 이전).
      개별 프로세스 모달은 별도 인스턴스 — 메인 검증과 분리해서 회귀 양쪽 모두 잡아야 함.
      class 변화도 사실: ALLOW 시 redTxt(빨강) / BLOCK 시 blueTxt(파랑) — 시각적 강조 변화.

# ──────────────────────────────────────────────────────────────────────────────
# 필수 입력 순서 검증 (ADD 모달 전용) — Chrome MCP 실제 제출 테스트로 확정 필요
# ──────────────────────────────────────────────────────────────────────────────
required_submit_sequence:
  - step:        1
    description: "아무것도 입력 안 함"
    fill:        []
    expected_msg: ""   # TODO: 빈 csuName 으로 제출 시 실제 경고 메시지 확정
    missing_field: "csuName"
    missing_field_label: "스위트 이름"

  - step:        2
    description: "스위트 이름만 입력"
    fill:        ["csuName"]
    expected:    "success"

# ──────────────────────────────────────────────────────────────────────────────
# 모달 액션 버튼 (Chrome MCP 확인 후 selector 재정의 필요)
# 기존 yaml: submit_btn = "#controlSuite .btn.btn-primary"
# Chrome MCP 모달 footer 의 실제 버튼 selector 재확인 권장.
