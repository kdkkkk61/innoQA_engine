scenario_3_length_boundary:
  policy: "고정 단계 시도 — 막히는 시점 식별"
  fixed_lengths: [100, 300, 500]
  rule: |
    각 length 별로 입력 후:
      1. DOM 의 input.value.length 확인 (자동 절단 여부)
      2. '추가' 또는 '저장' 클릭 시 경고 메시지 출현 여부
      3. 막히는 시점 (경고 출현) 발견 시 그 시점 length 를 maxlength_server 로 기록
      4. 500자에서도 막히지 않으면 더 큰 시도 (1000+) 또는 "제한 없음 (관찰 범위 내)" 로 기록
  per_field_overrides:
    csuName:
      dom_maxlength: 50
      expected: "DOM 차단 (51자 입력 시 자동 절단됨)"
    uploadLimitSize:
      dom_maxlength: null
      expected: "숫자형이므로 매우 큰 수 입력 시 별도 검증 (단위 MB 추정)"
  chrome_mcp_results_2026_05_12:
    - field: "csuName"
      input_length: 100
      actual_length: 50
      behavior: "DOM maxlength=50 자동 절단, 알림 없음"
      verdict: "정상"
    - field: "clipboardAllowUrl"
      input_length: 300
      actual_length: 299
      submit_result: "저장 성공 — 알림 '저장 하였습니다'"
      verdict: "서버 제한 없음 (관찰 범위 내, ≥299자 허용)"
    - field: "uploadLimitSize / customOptionText / webRestrictName / basePath / allowExtensionInputP / accessAllowIp / accessAllowPort"
      status: "TODO — 자동화 한계 (ng-click 미발화)"

# ──────────────────────────────────────────────────────────────────────────────
# 시나리오 3 자동화 한계 (Chrome MCP 2026-05-12)
# ──────────────────────────────────────────────────────────────────────────────
scenario_3_automation_limits:
  observed_issues:
    - id: "ng_click_no_trigger_on_add_buttons"
      affected: ["allowIpAddressBtn", "allowExtensionInputBtnP", "attachAllowUrlBtn (추정)"]
      symptom: |
        Chrome MCP 의 computer.left_click (trusted event) 으로 추가 버튼 클릭 시도해도
        ng-click 핸들러가 발화하지 않음. 입력값 (ip/port/extension) 도 비워지지 않고 그대로.
        JS .dispatchEvent('input', bubbles:true) + .click() 조합도 효과 없음.
      root_cause_hypothesis: |
        AngularJS scope.$apply() 사이클이 외부 trigger 로 발화 안 됨.
        또는 추가 버튼의 ng-disabled 조건 미충족 (ng-model 값 미반영).
        실 사용자 키보드 입력은 정상 작동하지만 JS-driven 키보드 시뮬레이션은 한계.
      verification_strategy:
        - "Playwright locator.click() (실제 input event sequence 시뮬레이션) 으로 재검증"
        - "또는 사용자 수동 시연 후 메시지 캡처"
        - "page class 작성 시 Playwright trusted dispatch 로 검증 가능 (Chrome MCP 한계 우회)"

# ──────────────────────────────────────────────────────────────────────────────
# 시나리오 3 입력 형식 정상/비정상 케이스 (사용자 결정 2026-05-12)
# ──────────────────────────────────────────────────────────────────────────────
scenario_3_input_format:
  fields:
    - id: "allowExtensionInput"
      scope: "메인 모달 tag_input"
      valid:   ["txt", "doc", "exe", "*"]
      invalid: ["한글", "$@%", "ext name", ""]
      expected_invalid_message: ". * ; ? 이외의 특수문자 또는 한글이 포함된 확장자는 제외합니다."
      chrome_mcp_verified: 2026-05-12
      test_coverage: "sc3 '[차단 메시지] 제어할 확장자 형식(특수문자) 거부' + sc4k A2(EDIT). 2026-05-28 추가 — 기존 중복만 assert, 형식 거부 미검증이던 갭 보완."

    - id: "allowExtensionInputP"
      scope: "process_modal tag_input (개별)"
      valid:   ["txt", "doc", "exe", "*"]
      invalid: ["한글확장자", "$@%"]
      expected_invalid_message: ". * ; ? 이외의 특수문자 또는 한글이 포함된 확장자는 제외합니다."
      modal_id: "__globalMessageModal"
      chrome_mcp_verified: 2026-05-13
      note: "메인 allowExtensionInput 과 완전 동일 패턴 — 메시지 일치 확정"
      test_coverage: "sc3 '[차단 메시지] 프로세스 확장자 형식(특수문자) 거부' + sc4m B2(EDIT). 2026-05-28 추가."
      multi_separator:
        delimiter: ";"
        example_input: "txt;doc;exe"
        verified_result: "3개 일괄 등록 (txt, doc, exe) — span 텍스트 분리"
        ul_pattern: "ul#allowExtensionUlP > div#extension(반복) > button.tagInput > span"
        delete_icon: "i.extentionDeleteBtnP.fa.fa-times"
        chrome_mcp_verified: 2026-05-13

    - id: "allowFileExtention"
      scope: "web_restrict_modal tag_input"
      valid:   ["txt", "doc"]
      invalid: ["한글웹확장자", "$"]
      expected_invalid_message: ". * ; ? 이외의 특수문자 또는 한글이 포함된 확장자는 제외합니다."
      modal_id: "__globalMessageModal"
      chrome_mcp_verified: 2026-05-13
      note: "메인/process_modal/web_restrict 3개 영역 모두 동일 메시지 — 공통 validator 컴포넌트 추정"
      test_coverage: "sc3 '[차단 메시지] 웹제한 확장자 형식(특수문자) 거부' + sc4l C2(EDIT). 2026-05-28 추가."
      chrome_mcp_recheck_needed: "한글 확장자 — 2026-05-28 JS-probe 에서 추가됨(상충). el.value= 주입이 키보드 마스크 우회 가능성 → trusted click 재확인 필요."

    - id: "accessAllowIp"
      scope: "process_modal IP 입력"
      valid:   ["192.168.1.1", "10.0.0.1", "127.0.0.1"]
      invalid: ["abc.def.ghi.jkl", "999.999.999.999", "192.168.1", "", "192.168.1.1.1"]
      expected_invalid_message: "아이피 주소 형식이 잘못되었습니다"
      modal_id: "__globalMessageModal"
      chrome_mcp_verified: 2026-05-13
      verified_input: "abc.def.ghi.jkl"
      note: "사용자 수동 시연 캡처. IP 4옥텟 정수 형식 외 모두 차단 추정."

    - id: "accessAllowPort"
      scope: "process_modal Port 입력"
      valid:   ["80", "443", "8080", "65535"]
      invalid_max_exceed:
        cases: ["70000", "65536"]
        message: "Port의 최대값은 65535입니다"
        chrome_mcp_verified: 2026-05-13
      invalid_format:
        cases: ["abc", "12ab"]
        message: "Port 형식을 다시 확인 해 주세요"
        chrome_mcp_verified: 2026-05-13
      modal_id: "__globalMessageModal"
      note: "IP/Port 정상 등록은 list 'IP Port' 행 추가 (예: '192.168.1.1 8080')"

    - id: "attachAllowUrl"
      scope: "web_restrict_modal URL 입력"
      valid:   ["http://example.com", "https://innotium.com", "*.example.com", "Any", "not a url"]
      invalid: []  # 형식 검증 없음 (모든 문자열 허용)
      no_format_validation: true
      chrome_mcp_verified: 2026-05-13
      note: |
        URL 형식 검증 없음 — "not a url" 같은 비URL 문자열도 그대로 등록됨.
        제품 안내 텍스트 "기능 미사용 또는 URL 미 입력 시 Any(모든 URL 허용)로 설정됨"
        → 사용자가 의도적으로 비 URL 문자열을 등록할 수 있음 (서버 매칭 규칙은 별도).

    - id: "uploadLimitSize"
      scope: "web_restrict_modal 숫자 입력 (MB)"
      type: "text (양의 정수 strict — DOM 자동 변환)"
      valid:   ["1", "100", "1024", "999999999"]
      input_transform_rules:
        - {input: "abc", output: "0", note: "비숫자 → 0 자동 변환"}
        - {input: "-1", output: "1", note: "음수 부호 자동 제거"}
        - {input: "12ab34", output: "1234", note: "비숫자 제거 추정 (미검증)"}
      chrome_mcp_verified: 2026-05-13
      note: "DOM 입력 단계에서 양의 정수만 수용. 별도 알림 없이 자동 변환. ≥9자리 허용."

