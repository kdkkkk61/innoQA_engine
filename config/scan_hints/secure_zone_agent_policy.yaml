# secure_zone_agent_policy 페이지 스캔 힌트 (시큐어존 정책)
# DOM 검증 완료 (2026-06-10) — Chrome MCP 직접 확인
#
# [sc0 는 diff-only — 요소 클릭/입력 없음]
#   정책 모달은 ① 기본반출정책(isSzAgentPolicyTypeTakeoutDefault) = 전역 singleton,
#   클릭 즉시 "타 정책의 기본반출정책이 제거됩니다" 확인 다이얼로그(데이터 위험),
#   ② 중첩 gating(프로세스통제/파일감시/프린트 master→종속), ③ disabled 종속 체크박스
#   → UIScanner 의 필드 클릭형 자동검증(plain_checkbox 클릭 등)은 위험/노이즈.
#   따라서 sc0 는 이 yaml 의 선언 selector(baseline) ↔ 모달 DOM 을 비교만 한다
#   (core.scan_diff, 요소 인터랙션 없음). 신규/제거 감지(회귀)가 목적.
#   필드별 동작 검증(maxlength·중복·특수문자·gating)은 sc2~4 에서 개별 수행.
#
# [검증값 출처] 모달 최초 열림 Chrome MCP 직접 확인 (2026-06-10)
#   - 모달 #addItemModal.in (2탭: 기본정책/템플릿설정), 제목 "시큐어존 에이전트 정책 등록"
#   - 정책이름 maxlength=50 / watchFileStorePath maxlength=400
#   - 빈 제출 → "필수 입력값이 입력되지 않았습니다." (필수: 이름+드라이브+제어스위트)
#   - print radio(name=isPrint)는 id 없음 → DOM 자동 추출(input#) 대상 아님 → baseline 제외

page_id: "secure_zone_agent_policy"
modal_id: "addItemModal"
scan_mode: "list_page"

modal_trigger:
  add:    "button#addAgentPolicy"
  modify: "button#modifyItemBtn"

# ──────────────────────────────────────────────────────────────────────────────
# 리스트 UI — 검색 (sc1=존재 / sc3=동작). Chrome MCP 2026-06-11.
# ──────────────────────────────────────────────────────────────────────────────
list_ui:
  search:                              # 정책 목록 페이지 검색
    input:  "input#searchText"
    label:  "정책이름 검색"
    note:   "동작(필터 반영) 미검증 — sc3 에서 확인"
  picker_search:                       # 템플릿 선택 picker "SecureZone - 템플릿 관리" 내부 검색
    input:  "div.modal-wrap.in input#searchText"   # picker 스코프 (리스트 검색과 동일 id, 모달로 구분)
    button: "div.modal-wrap.in button#searchBtn"
    bug:    "🔴 검색 미동작 — 검색어 입력 + searchBtn 클릭/Enter 둘 다 결과 필터 미반영 (실측 2026-06-11: 매칭어 '전사'로도 전체 44건 유지). 드라이브 picker 기준, 동일 컴포넌트면 제어스위트/프로세스 picker 동일 추정. sc3 WARN 검출 대상."

# ──────────────────────────────────────────────────────────────────────────────
# baseline — 기본정책 탭의 id 있는 input/textarea/select 25개 (DOM 자동추출 기준과 1:1).
# sc0 diff: 여기에 없는 DOM 요소 = 신규 / 여기에 있는데 DOM 없음 = 제거.
# (sc0 는 아래 selector 를 '비교'만 하고 클릭/입력하지 않음 — singleton 안전)
# ──────────────────────────────────────────────────────────────────────────────
text_inputs:
  - selector: "input#szAgentPolicyName"
    label:    "정책 이름"
    maxlength: 50
    required: true
  - selector: "input#watchFileStorePath"
    label:    "감시파일 보관소 지정"
    maxlength: 400
  - selector: "input#watchFileExtention"
    label:    "감시 파일 확장자"
  - selector: "input#secureDriveBlockTime"
    label:    "시큐어드라이브 차단 대기시간"
  - selector: "input#customOptionText"
    label:    "커스텀 옵션값"
  - selector: "textarea#allowPrintModel"
    label:    "프린트 허용 브랜드"
  - selector: "textarea#exceptPrintPort"
    label:    "프린트 제외 포트"

radio_groups:
  - name:   "szAgentPolicyType"
    label:  "타입 (일반/반출)"
    options:
      - selector: "input#szAgentPolicyTypeDefault"
        label:    "일반"
      - selector: "input#szAgentPolicyTypeTakeout"
        label:    "반출"

plain_checkboxes:
  # ⚠️ 기본반출정책 — singleton. sc0 비교 대상(목록)일 뿐, 절대 클릭 금지.
  - selector: "input#isSzAgentPolicyTypeTakeoutDefault"
    label:    "기본반출정책 (전역 singleton — 클릭 금지)"
  - selector: "input#isAllowDenyProcessUse"
    label:    "프로세스 통제기능 사용 (master)"
  - selector: "input#isAllowProcessForceStop"
    label:    "프로그램 종료 시 허용 프로세스 강제종료"
  - selector: "input#isExceptProcess"
    label:    "예외처리 프로세스 사용"
  - selector: "input#isBlockExecuteProcess"
    label:    "실행차단 프로세스 사용"
  - selector: "input#isManageFolder"
    label:    "특수폴더 사용"
  - selector: "input#isSyncFolder"
    label:    "폴더 동기화 사용"
  - selector: "input#isWatchFile"
    label:    "파일 감시기능 (master)"
  - selector: "input#isWatchFileExtention"
    label:    "감시 파일 확장자 사용"
  - selector: "input#isWatchFileHeader"
    label:    "헤더 체크"
  - selector: "input#isWatchFolder"
    label:    "예외 폴더"
  - selector: "input#isPrintUse"
    label:    "프린트 설정 사용"
  - selector: "input#isShowAgentShutdownMenu"
    label:    "에이전트 종료 메뉴 노출"
  - selector: "input#isShowEmergencyCodeMenu"
    label:    "긴급 허용 코드 메뉴 노출"
  - selector: "input#isOfflineUse"
    label:    "오프라인 사용"
  - selector: "input#isTakeoutDriveBlock"
    label:    "반출 드라이브 차단"

modal_actions:
  submit_add:    "div#addItemModal.in button.btn-primary"
  submit_modify: "div#addItemModal.in button.btn-primary"
  close:         "div#addItemModal.in button.btn-default"
