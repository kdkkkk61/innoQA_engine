# ══════════════════════════════════════════════════════════════════════
# nPouch 원본보호 정책 — modal_form scan_hints (초기 골격)
# ══════════════════════════════════════════════════════════════════════
# 작성일: 2026-05-28 (Chrome MCP 초기 스캔)
# 의존성: 제어 스위트 (managerControlSuite) 의 [AUTO_KEEP] 정책 필요 — sc5/sc6 연계 핸드오프
#
# Chrome MCP 초기 검증 (2026-05-28):
#   - 목록 페이지 버튼: addItemBtn / modifyItemBtn / copyItemBtn / removeItemBtn / searchText
#   - 테이블 헤더 7개, 현재 52행 보유 (기존 정책 多)
#   - ADD 모달: div#addItemModal.modal-wrap.in (동적 생성/제거 패턴)
#   - 모달 안 input/textarea/select 총 26개 (visible 22 + hidden toggle 4)
#   - 탭 4개 추정 (기본 설정 / 허용 프로세스 / 예외처리 프로세스 / 실행차단 프로세스)
#     ⚠ nav-tabs 표준 selector 미일치 — 탭 영역 분리 selector 추가 조사 필요
#   - CSU select 버튼 + #controlSuiteId span 존재 (제어스위트 연계 지점 확인)
# ══════════════════════════════════════════════════════════════════════

scan_mode: modal_form
page_id:   npouch_origin_protect

# ──────────────────────────────────────────────────────────────────────
# 의존성 (사용자 결정 2026-05-28)
# ──────────────────────────────────────────────────────────────────────
dependencies:
  upstream_keep:
    page: "managerControlSuite"
    artifact: "[AUTO_KEEP]_sc5_step1"
    usage: "원본보호 정책 ADD 시 CSU select 버튼 → 제어스위트 picker → [AUTO_KEEP] 선택"
    note: |
      sc5 lifecycle 완료 시 보존되는 keep 정책을 원본보호 sc3/sc4 가 연계 사용.
      keep 부재 시 → sc3/sc4 skip (warn) 또는 sc1 에서 [AUTO_KEEP] 생성 분기.

# ──────────────────────────────────────────────────────────────────────
# 목록 페이지 (시나리오 1)
# ──────────────────────────────────────────────────────────────────────
list_ui:
  search:
    input:       "input#searchText"
  table_headers_count: 7   # Chrome 확인 (라벨 한글 — 텍스트 채굴 별도)
  current_row_count_at_scan: 52   # 2026-05-28 스캔 시점

modal_trigger:
  add:    "button#addItemBtn"
  modify: "button#modifyItemBtn"
  copy:   "button#copyItemBtn"
  delete: "button#removeItemBtn"

# ──────────────────────────────────────────────────────────────────────
# 메인 모달
# ──────────────────────────────────────────────────────────────────────
modal_id: "addItemModal"
modal_open_selector: "div#addItemModal.modal-wrap.in"

# 필드 인벤토리 (Chrome MCP 2026-05-28 직접 추출)
fields:
  basic:
    - {id: "originProtectPolicyName", tag: "INPUT", type: "text", required_estimated: true, note: "정책 이름"}
    - {id: "driveLetter",             tag: "INPUT", type: "text", note: "드라이브 letter"}
    - {id: "driveLabel",              tag: "INPUT", type: "text", note: "드라이브 라벨"}
    - {id: "originProtectDriveQuota", tag: "INPUT", type: "text", note: "용량 quota"}

  csu_link:
    button: "div#addItemModal button.addBtn.smallBtn.addTemplate"
    result_span: "span#controlSuiteId"
    note: "제어스위트 picker 호출 → [AUTO_KEEP] 선택 → span 에 id 바인딩"

  process_toggles:
    - {id: "isAllowProcess",  type: "checkbox", note: "허용 프로세스 토글"}
    - {id: "isExceptProcess", type: "checkbox", note: "예외처리 프로세스 토글"}
    - {id: "isBlockProcess",  type: "checkbox", note: "실행차단 프로세스 토글"}

  file_watch:
    - {id: "isWatchFileExtension", type: "checkbox", hidden: true, note: "파일 감시 확장자 토글"}
    - {id: "watchFileExtensions",  type: "text",     note: "확장자 input"}
    - {id: "watchFileExtensionAddBtn", tag: "BUTTON", note: "확장자 추가 버튼"}
    - {id: "isWatchFileHeader",    type: "checkbox", note: "헤더 체크"}
    - {id: "watchExceptFolders",   type: "text",     note: "예외 폴더 input"}
    - {id: "watchExceptFolderAddBtn", tag: "BUTTON", note: "예외폴더 추가 버튼"}

  shutdown_alert:
    - {id: "isAllowProcessShutdownText", type: "checkbox", hidden: true, note: "프로세스 종료 알림 토글"}
    - {id: "allowProcessShutdownText",   tag: "TEXTAREA", note: "종료 알림 텍스트"}

  screen_watermark:
    - {id: "isScreenWaterMark",            type: "checkbox", hidden: true, note: "화면 워터마크 토글"}
    - {id: "screenWaterMarkText",          type: "text",     note: "워터마크 텍스트"}
    - {id: "isScreenWaterMarkPcInfo",      type: "checkbox", note: "PC 정보 포함"}
    - {id: "isScreenWaterMarkCurrentTime", type: "checkbox", note: "현재 시각 포함"}
    - {id: "screenWaterMarkOpacity",       type: "text",     note: "투명도"}
    - {id: "screenWaterMarkDegree",        type: "text",     note: "각도"}

  print_watermark:
    - {id: "isPrintWaterMark",            type: "checkbox", hidden: true, note: "출력 워터마크 토글"}
    - {id: "printWaterMarkText",          type: "text",     note: "텍스트"}
    - {id: "isPrintWaterMarkPcInfo",      type: "checkbox", note: "PC 정보"}
    - {id: "isPrintWaterMarkCurrentTime", type: "checkbox", note: "시각"}
    - {id: "printWaterMarkOpacity",       type: "text",     note: "투명도"}
    - {id: "printWaterMarkDegree",        type: "text",     note: "각도"}

  misc:
    - {id: "isSecondTakeout", type: "checkbox", note: "2차 반출 (기능 미확정)"}

# ──────────────────────────────────────────────────────────────────────
# 시나리오 책임 분담 (제어스위트 패턴 참고 — 사용자 결정 시 확정)
# ──────────────────────────────────────────────────────────────────────
scenario_plan:
  # ⚠ 원본보호 정책의 결정적 특수성 (사용자 통찰 2026-05-28):
  #   ADD 모달은 '기본 설정' 탭만 접근 가능 (tab_access_restriction).
  #   허용/예외처리/실행차단 프로세스 탭의 UI 구조는 EDIT 진입 후에만 검증 가능.
  #   → sc1/sc2 가 control_suite 처럼 모든 탭을 ADD 모달에서 한 번에 검증 불가.
  #   → "임시 정책 1건 생성 → EDIT 진입 → 4탭 UI 검증 → cleanup" 흐름 필요.

  sc1: "UI 구조 — 목록·버튼·ADD 모달 기본설정 탭 진입/탈출"
  sc1_extra:
    sc1c: |
      [AUTO]_sc1_probe 정책 1건 임시 생성 → 목록 → EDIT 진입 →
      4탭 모두 active 가능 확인 → 각 탭 UI 요소 존재 확인 → cleanup.
      (ADD 에서 검증 불가능한 비기본 3탭 UI 를 EDIT 에서 확정)

  sc2: "입력 구조 (기본설정 탭) — default·maxlength·* 필수 mark·존재 확인"
  sc2_extra:
    sc2c: "EDIT 진입 후 비기본 3탭의 input 구조 (default·maxlength·존재) — sc1c 와 같은 임시 정책 활용 가능"

  sc3: "ADD 동작 — 기본설정 탭 입력 + 필수 빈값 차단 + driveLetter 마스킹 + CSU picker + 정상 저장"
  sc4: "EDIT 동작 — list 행 → EDIT 모달 + 4탭 저장값 일치 + sc3 회귀 + 비기본 3탭 입력/저장"
  sc5: "lifecycle — 생성 ON → 전체 OFF → 요소 제거 → 재채움 (AUTO_KEEP 보존)"
  sc6: "연계 데이터 핸드오프 확인 (다음 페이지 = nPouch 정책?)"
  zz:  "최종 cleanup — AUTO 만 정리, KEEP 보존"

  # 시나리오 별 ADD vs EDIT 영역 분리 정리 (1축 인벤토리 수집 시 표시)
  field_visibility_in_add_vs_edit:
    add_modal_visible_tabs: ["기본 설정 (idx=0)"]
    edit_modal_visible_tabs: ["기본 설정", "허용 프로세스", "예외처리 프로세스", "실행차단 프로세스"]
    add_locked_tab_message: "정책 정보를 먼저 등록 하셔야 합니다."   # __globalMessageModal

# ──────────────────────────────────────────────────────────────────────
# 사용자 직접 검증 사실 — ADD 모달 (2026-05-28)
# 사용자 스크린샷 + 동작 확인 기반 (추측 아님).
# ──────────────────────────────────────────────────────────────────────
scenario_3_must_test_add:
  tab_access_restriction:
    description: |
      정책 생성(ADD) 중에는 '기본 설정' 탭만 사용 가능.
      허용/예외처리/실행차단 프로세스 탭 클릭 시 → globalMessage 알림 + 강제로 0번 탭(기본 설정) 유지.
    tab_selector: "div#addItemModal ul.nav-tabs li a, div#addItemModal ul.tab-list li a, div#addItemModal li > a"
    tab_count: 4
    tab_order: ["기본 설정 (idx=0)", "허용 프로세스 (idx=1)", "예외처리 프로세스 (idx=2)", "실행차단 프로세스 (idx=3)"]
    blocked_tabs_idx: [1, 2, 3]
    expected_message: "정책 정보를 먼저 등록 하셔야 합니다."   # 한글 26자
    modal_id: "__globalMessageModal"   # Chrome MCP 직접 확정 2026-05-28
    active_tab_after_block: 0   # 차단 후 강제로 idx=0(기본 설정) 유지
    severity: "must_test"
    verified_by: "Chrome MCP 직접 검증 2026-05-28 + 사용자 스크린샷"

  # 검증 메시지 정확 텍스트 (스크린샷 직접 확인 2026-05-28 — 추정 0)
  required_field_empty_messages:
    description: |
      각 필수 필드 빈값 + 저장 시 노출되는 정확한 메시지.
      이전 추정 (길이/토큰 기반) 은 4건 중 4건 다 틀림 — 사용자 강조 "추정 != 사실".
      모두 modal_id = __globalMessageModal.
    verified_by: "Chrome MCP + 사용자 스크린샷 확인 2026-05-28"
    cases:
      - {case: "α", field: "originProtectPolicyName", input: "빈값 + 나머지 채움",
         message: "정책 이름을 입력해 주세요.", modal_id: "__globalMessageModal"}
      - {case: "β1", field: "driveLetter", input: "Letter만 빈",
         message: "드라이브 문자를 입력해 주세요.", modal_id: "__globalMessageModal"}
      - {case: "β2", field: "driveLabel", input: "Label만 빈",
         message: "드라이브 라벨을 입력해 주세요.", modal_id: "__globalMessageModal"}
      - {case: "β3", field: "originProtectDriveQuota", input: "Quota만 빈",
         message: "원본보호 드라이브 용량을 입력해 주세요.",
         modal_id: "__globalMessageModal",
         note: "다른 메시지들과 달리 '원본보호' 접두어 있음 — 명명 패턴 비일관"}
      - {case: "γ", field: "controlSuiteId", input: "CSU 미선택",
         message: "제어 스위트를 선택해 주세요.", modal_id: "__globalMessageModal"}

    validation_firing_order:
      description: "여러 필수 동시 빈값 시 어느 메시지가 먼저 발화하는가."
      verified:
        - {rank: 1, field: "originProtectPolicyName",
           verified_by: "δ case (다 빈) → α 와 동일 메시지 확인 2026-05-28"}
      pending: "rank 2~5 (이름 채움 + 나머지 점진 채우기로 추가 확정 필요)"

  list_duplicate_messages:
    description: "리스트 형식 input (확장자/예외폴더) 에 중복 값 추가 시 메시지"
    verified_by: "Chrome MCP + 사용자 스크린샷 확인 2026-05-28"
    cases:
      - {field: "watchFileExtensions", input: "같은 확장자 'txt' 두 번 추가",
         message: "이미 동일한 확장자가 존재합니다.",
         modal_id: "__globalMessageModal",
         note: "control_suite allowExtensionInput/P/allowFileExtention 메시지와 완전 동일 — 공유 validator"}
      - {field: "watchExceptFolders", input: "같은 폴더 'C:\\Temp' 두 번 추가",
         message: "이미 등록된 폴더 경로가 존재합니다.",
         modal_id: "__globalMessageModal",
         note: "이 메시지는 진짜 폴더 영역에 일관성 있음. control_suite attachAllowUrl 의 같은 메시지는 URL 영역인데 노출 = typo 결함 (yaml :730 일치)"}

  list_input_validation:
    description: |
      list 형식 input (확장자/예외폴더) 의 형식/빈값/다중구분자 검증.
      Chrome MCP + 스크린샷 직접 확인 2026-05-28.
    cases:
      # ── 확장자 (watchFileExtensions) ────────────────────────
      - {field: "watchFileExtensions", scope: "확장자 list", validation: "형식 검증",
         input: "$@% (특수문자) 또는 한글",
         message: ". * ; ? 이외의 특수문자 또는 한글이 포함된 확장자는 제외합니다.",
         modal_id: "__globalMessageModal",
         result: "list 추가 차단",
         note: "control_suite 와 완전 동일 메시지 — 공유 validator 확정"}
      - {field: "watchFileExtensions", scope: "확장자 list", validation: "빈값 + 추가",
         input: "'' (빈) + 추가 버튼",
         message: "확장자를 입력하세요",
         modal_id: "__globalMessageModal",
         note: "마침표 없음 — 다른 빈값 메시지(...주세요.)와 패턴 다름"}
      - {field: "watchFileExtensions", scope: "확장자 list", validation: "다중 구분자",
         input: "'asd;sdf;dfg' + 추가",
         result: "3건 일괄 등록 (asd, sdf, dfg) — 알림 없음",
         note: "control_suite 와 동일 — 공유 처리 로직"}

      # ── 예외 폴더 (watchExceptFolders) ──────────────────────
      - {field: "watchExceptFolders", scope: "예외 폴더 list", validation: "형식 검증",
         input: "$@% 특수문자 / 한글",
         result: "그대로 등록됨 (알림 없음) — 형식 검증 없음 (free text)",
         note: "control_suite cacheFolderInput 패턴과 유사 — 폴더 경로는 free text"}
      - {field: "watchExceptFolders", scope: "예외 폴더 list", validation: "빈값 + 추가",
         input: "'' (빈) + 추가 버튼",
         message: "확장자를 입력하세요",   # ⚠ 결함!
         modal_id: "__globalMessageModal",
         severity: "ux_bug — 메시지 일관성 결함",
         note: |
           예외폴더 영역인데 '확장자' 메시지 노출 = 영역 ≠ 메시지 불일치 결함.
           control_suite 의 URL 영역에 '폴더 경로' 메시지 노출 결함과 동일 카테고리.
           → 별도 known_bug 섹션 참조.}

  driveLetter_format_validation:
    description: |
      driveLetter input — invalid 입력 시 alert + value reset 동시 발화.
      이전 yaml 명세 'silent 마스킹' 은 부정확 — Chrome MCP 재검증 2026-05-28 정정.
    field: "driveLetter"
    selector: "input#driveLetter"
    masking_behavior: "value 자동 reset 으로 ''으로 정정"
    expected_invalid_message: "드라이브 문자는 영문자만 입력할 수 있습니다."
    modal_id: "__globalMessageModal"
    invalid_inputs_verified: ["숫자 1", "한글 가", "특수문자 @"]
    valid_inputs_verified:   ["대문자 Z", "소문자 z (→ Z 자동 변환)"]
    verified_by: "Chrome MCP + 사용자 스크린샷 확인 2026-05-28"

  watermark_token_auto_insert:
    description: |
      워터마크 PC 정보/현재 시각 체크박스 → 워터마크 텍스트 input 에 토큰 자동 삽입/제거.
      사용자 알림 (2026-05-28) + Chrome MCP 직접 검증.
    tokens:
      pc_info: "[/PCINFO/]"
      current_time: "[/TIME/]"
    behavior:
      - "체크 ON → 해당 토큰을 텍스트 뒤에 append"
      - "체크 OFF → 해당 토큰만 제거 (다른 토큰은 유지)"
      - "체크 순서대로 토큰 순서: 먼저 체크된 토큰이 앞"
    verified_transitions:   # Chrome MCP 직접 dump 2026-05-28
      screen_watermark:
        initial:         ""
        after_pc_check:  "[/PCINFO/]"           # PC 체크 →
        after_time_add:  "[/PCINFO/][/TIME/]"   # 시각 추가 →
        after_pc_remove: "[/TIME/]"             # PC 해제 (시각 유지)
        after_all_clear: ""                     # 둘 다 해제
      print_watermark: "화면 워터마크와 완전 동일 패턴 — 토큰 동일"
    applies_to:
      - field: "screenWaterMarkText"
        toggles: ["isScreenWaterMarkPcInfo", "isScreenWaterMarkCurrentTime"]
      - field: "printWaterMarkText"
        toggles: ["isPrintWaterMarkPcInfo", "isPrintWaterMarkCurrentTime"]
    severity: "must_test"
    edge_cases_verified:   # Chrome MCP 직접 검증 2026-05-28
      manual_text_plus_toggle:
        description: "사용자 수동 입력 텍스트 'ABC' 보존 + 토큰 뒤에 append/제거"
        transitions:
          before:         "ABC"
          after_pc:       "ABC[/PCINFO/]"
          after_time_add: "ABC[/PCINFO/][/TIME/]"
          after_pc_off:   "ABC[/TIME/]"
        verdict: "수동 텍스트 보존 — 토큰만 정확히 추가/제거 (깨끗한 동작)"

      manual_token_deletion:   # ⚠ 결함 후보 — 단방향 sync
        description: |
          텍스트에서 토큰 수동 삭제해도 체크박스 상태는 자동 해제되지 않음.
          sync 방향: checkbox → text ✓ / text → checkbox ✗
        transitions:
          state1_both_checked:        {text: "[/PCINFO/][/TIME/]", pc: true,  time: true}
          state2_pc_token_removed:    {text: "[/TIME/]",           pc: true,  time: true}   # pc 그대로 true!
          state3_all_text_cleared:    {text: "",                   pc: true,  time: true}   # 둘 다 true 유지
        severity: "warn — 데이터 불일치 잠재"
        consequence: |
          사용자가 텍스트만 편집하면 체크박스 상태와 어긋남.
          정책 저장 시 어느 값(text vs checkbox) 우선되는지 별도 검증 필요 (pending).
          close → re-open 후 동기화 여부도 별도 검증 필요 (pending).
        category: "단방향 sync — UI 일관성 결함"

  known_bugs_origin_protect:
    description: "ux_bug 결함 후보 — sc3 에서 warn 또는 fail 로 노출"
    items:
      - id: "watermark_token_one_way_sync"
        symptom: |
          워터마크 토큰 [/PCINFO/]·[/TIME/] sync 방향 비대칭:
          checkbox → text 는 자동 동기화 / text → checkbox 는 sync 안 됨.
          사용자가 텍스트 토큰 수동 삭제해도 체크박스는 ON 유지 → 데이터 불일치.
        severity: "warn — 단방향 sync UI 일관성 결함"
        verified_by: "Chrome MCP 직접 검증 2026-05-28"
        related: "watermark_token_auto_insert.edge_cases_verified.manual_token_deletion"
        pending_followup:
          - "정책 저장 시 text vs checkbox 중 어느 쪽 우선되는지"
          - "close → re-open 후 체크박스/텍스트 동기화 여부"

      - id: "watch_except_folder_empty_wrong_message"
        symptom: |
          예외 폴더 input (watchExceptFolders) 빈값 + 추가 버튼 클릭 시
          '확장자를 입력하세요' 메시지 노출 — 예외폴더 영역인데 확장자 메시지.
        severity: "ux_bug — 메시지 영역 ≠ UI 영역 불일치"
        category: "control_suite URL→폴더 typo 결함과 동일 카테고리"
        verified_by: "Chrome MCP + 사용자 스크린샷 직접 확인 (2회 격리) 2026-05-28"
        expected_correct_message: "(추정) '예외 폴더를 입력하세요' 또는 '폴더 경로를 입력해 주세요'"

  required_fields:
    description: |
      ADD 모달 필수 필드 — 진짜 마커는 라벨 안 * 가 아니라 별도 <span class="star">*</span>.
      Chrome MCP 직접 검증 2026-05-28: span.star 정확히 3개 존재 (사용자 스크린샷 3개 별표와 일치).
      라벨 안에 잡힌 일부 * 는 findLabel 매칭 노이즈 — 신뢰도 낮음.
    required_marker_selector: "span.star"
    required_marker_count: 3
    items:
      - {section: "정책 이름",            target: "input#originProtectPolicyName", required: true,  note: "단일 필드"}
      - {section: "원본보호 드라이브 설정", target: "묶음 (driveLetter/driveLabel/originProtectDriveQuota)", required: true,
         note: "섹션 헤더 * — 묶음 단위 필수. 어디까지 빈값 시 차단되는지 분리 검증 pending"}
      - {section: "제어 스위트 선택",      target: "span#controlSuiteId (CSU picker 결과)", required: true,
         note: "picker (selectCommonPolicyItemModal) 로 선택"}
    severity: "must_test"
    verified_by: "Chrome MCP 직접 검증 2026-05-28 (span.star 3개 확정)"

  default_values:
    description: |
      ADD 모달 close → re-open 시 default 초기화 — Chrome MCP 직접 검증 2026-05-28.
      ⚠ 사용자 지적 (2026-05-28) — 이전 'all_checkboxes: false' 추정은 부정확:
        Bootstrap 'switch' 패턴 hidden checkbox 4개 = default ON.
        일반 visible checkbox 9개 = default OFF.
        구분: parent_class='switch' 인 hidden input 이 default ON.
    verified_by: "Chrome MCP 직접 검증 2026-05-28 (사용자 통찰 후 재검증 — 13 checkbox 일괄 dump)"
    text_inputs:
      all_empty: true
      note: "모든 text/textarea = ''"
    checkbox_defaults:
      hidden_switch_default_on:   # parent.class='switch', cb.offsetParent===null
        - isWatchFileExtension     # 파일 감시 기능
        - isAllowProcessShutdownText  # 프로세스 종료 알림
        - isScreenWaterMark        # 화면 워터마크
        - isPrintWaterMark         # 출력 워터마크
      general_checkbox_default_off:
        - isAllowProcess          # 허용 프로세스 사용
        - isExceptProcess         # 예외처리 프로세스 사용
        - isBlockProcess          # 실행차단 프로세스 사용
        - isWatchFileHeader       # 헤더 체크
        - isScreenWaterMarkPcInfo
        - isScreenWaterMarkCurrentTime
        - isPrintWaterMarkPcInfo
        - isPrintWaterMarkCurrentTime
        - isSecondTakeout         # 2차 반출
    reset_behavior: "close → re-open 시 위 default 상태로 일관 리셋 (메모리 잔존 없음)"

  maxlength_inventory:
    description: "ADD 모달 모든 input 의 DOM maxlength 속성 = null. 서버 측 검증 의존."
    verified_by: "Chrome MCP 직접 검증 2026-05-28"
    maxlen_null_inputs: "all (34 inputs visible+hidden)"
    note: "control_suite uploadLimitSize 12자 같은 DOM 한도 없음 → 길이 한도는 서버 응답으로만 확인 가능"

  drive_letter_format:
    description: |
      driveLetter input — DOM 단계 silent 마스킹. 메시지 없이 값 자동 정정.
    field: "driveLetter"
    selector: "input#driveLetter"
    masking_rules:   # Chrome MCP 직접 검증 2026-05-28 (입력→DOM value 결과)
      valid:
        - {input: "Z",       result: "Z",  note: "대문자 1자 — 그대로 유지"}
        - {input: "z",       result: "Z",  note: "소문자 → 대문자 자동 변환"}
        - {input: "ABCDEF",  result: "A",  note: "다중자 → 첫 1자만 유지 + 대문자"}
      invalid_stripped_to_empty:
        - {input: "5",       result: "",   note: "숫자 → 전부 제거"}
        - {input: "@@@",     result: "",   note: "특수문자 → 전부 제거"}
        - {input: "가나",    result: "",   note: "한글 → 전부 제거"}
      verified_rules: "알파벳만 허용, 1자 한도, 대문자 자동 변환, 그 외 silent 제거"
    expected_invalid_message: "드라이브 문자는 영문자만 입력할 수 있습니다."   # 정정 2026-05-28 — alert + value reset 동시
    modal_id: "__globalMessageModal"
    severity: "must_test"
    verified_by: "Chrome MCP 직접 검증 2026-05-28 (재검증 — 이전 'silent 마스킹' 추정 정정)"
    note: "value 가 '' 으로 reset 되는 동시에 alert 노출 — 둘 다 발화 (silent 아님)"

  csu_select_flow:
    description: |
      '제어 스위트 선택' 버튼 클릭 → 별도 picker 모달 열림 (#selectCommonPolicyItemModal).
      picker 흐름:
        1. 검색 input (placeholder: '제어 스위트 이름') 에 [AUTO_KEEP]_sc5_step1 입력 + 검색.
        2. 매칭 행의 radio (name='selectTemplate') 선택.
        3. .btn-primary (확인) 클릭 → picker 닫힘.
        4. addItemModal 의 span#controlSuiteId 에 id 바인딩.
      KEEP 부재 시 fallback: 검색 안 하고 첫 행 radio 선택.
    csu_select_btn: "div#addItemModal button.addBtn.smallBtn.addTemplate"
    csu_id_span: "span#controlSuiteId"
    # picker 모달 구조 (Chrome MCP 직접 확정 2026-05-28)
    picker:
      modal: "div#selectCommonPolicyItemModal"
      modal_open: "div#selectCommonPolicyItemModal.modal-wrap.in"
      search_input: "div#selectCommonPolicyItemModal input#searchText"   # placeholder: "제어 스위트 이름"
      search_button_class: "searchBtn"
      table_container: "div#selectCommonPolicyItemModal #controlSuiteList"
      row_selector: "div#selectCommonPolicyItemModal table tbody tr"
      radio_selector: "div#selectCommonPolicyItemModal input[type='radio'][name='selectTemplate']"
      mode: "single (radio)"
      confirm_btn: "div#selectCommonPolicyItemModal .btn-primary"
      cancel_btn: "div#selectCommonPolicyItemModal .btn-default"
      close_btn: "div#selectCommonPolicyItemModal .close"
      row_count_at_scan: 20   # 2026-05-28 스캔 시점
    keep_artifact: "[AUTO_KEEP]_sc5_step1"
    fallback: "검색 없이 picker 첫 행 radio"
    severity: "must_test"
    verified_by: "Chrome MCP 직접 검증 2026-05-28 (picker 내부 구조 + 모든 selector 확정)"

