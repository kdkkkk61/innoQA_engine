    verified_by: "Chrome MCP + 사용자 스크린샷 확인 2026-05-28"

  watermark_token_auto_insert:
    description: |
      워터마크 PC 정보/현재 시각 체크박스 → 워터마크 텍스트 input 에 토큰 자동 삽입/제거.
      사용자 알림 (2026-05-28) + Chrome MCP 직접 검증.
    tokens:
      pc_info: "[/PCINFO/]"
      current_time: "[/TIME/]"
    behavior:
      - "체크 ON → 해당 토큰을 텍스트 뒤에 append"
      - "체크 OFF → 해당 토큰만 제거 (다른 토큰은 유지)"
      - "체크 순서대로 토큰 순서: 먼저 체크된 토큰이 앞"
    verified_transitions:   # Chrome MCP 직접 dump 2026-05-28
      screen_watermark:
        initial:         ""
        after_pc_check:  "[/PCINFO/]"           # PC 체크 →
        after_time_add:  "[/PCINFO/][/TIME/]"   # 시각 추가 →
        after_pc_remove: "[/TIME/]"             # PC 해제 (시각 유지)
        after_all_clear: ""                     # 둘 다 해제
      print_watermark: "화면 워터마크와 완전 동일 패턴 — 토큰 동일"
    applies_to:
      - field: "screenWaterMarkText"
        toggles: ["isScreenWaterMarkPcInfo", "isScreenWaterMarkCurrentTime"]
      - field: "printWaterMarkText"
        toggles: ["isPrintWaterMarkPcInfo", "isPrintWaterMarkCurrentTime"]
    severity: "must_test"
    save_and_reopen_sync:   # Chrome MCP 직접 검증 2026-05-28 (사용자 강조 "예측 영역 가지마" 후 확정)
      description: |
        저장/재진입 시 text ↔ checkbox sync 동작:
          저장 시: text 값 우선 보존 (체크박스 상태 무시).
          EDIT 재진입 시: 서버에서 받은 text 의 토큰 분석해서 체크박스 상태 재계산.
        즉 ADD/EDIT 중 단방향 sync 결함은 저장 후 자동 복구됨 (일시적 UI 불일치만 발생).
      verified_transition:
        before_save:
          text: ""           # 사용자가 수동으로 토큰 삭제
          pc: true            # 체크박스는 ON 유지 (단방향 sync 결함)
          time: true
          wm_toggle: true
        after_save_reopen:
          text: ""            # 저장 시 text 우선 — 빈값 보존
          pc: false           # text 토큰 없으므로 false 로 재계산
          time: false         # 동일
          wm_toggle: true     # 워터마크 토글 자체는 독립 — text 와 무관하게 ON 유지
      conclusion: |
        - 데이터 무결성: 저장된 정책의 최종 상태는 text 기준 일관 (text 가 truth source).
        - UI 결함 severity 재평가: warn (일시 UI 불일치 — 저장으로 해결).
        - wm_toggle (isScreenWaterMark/isPrintWaterMark) 는 PC/Time 과 독립적 — 별도 정책 영역.

    edge_cases_verified:   # Chrome MCP 직접 검증 2026-05-28
      manual_text_plus_toggle:
        description: "사용자 수동 입력 텍스트 'ABC' 보존 + 토큰 뒤에 append/제거"
        transitions:
          before:         "ABC"
          after_pc:       "ABC[/PCINFO/]"
          after_time_add: "ABC[/PCINFO/][/TIME/]"
          after_pc_off:   "ABC[/TIME/]"
        verdict: "수동 텍스트 보존 — 토큰만 정확히 추가/제거 (깨끗한 동작)"

      manual_token_deletion:   # ⚠ 결함 — 단방향 sync (Chrome MCP 직접 재검증 2026-05-29)
        description: |
          체크박스로 자동 삽입된 토큰을 텍스트에서 수동 삭제해도 체크박스는 자동 해제되지 않음.
          sync 방향: checkbox → text ✓ (자동 토큰 삽입/제거) / text → checkbox ✗ (결함)
        transitions:   # Chrome MCP 직접 dump 검증 2026-05-29 — 화면/출력 동일 결과
          state1_both_checked:        {text: "[/PCINFO/][/TIME/]", pc: true,  time: true}
          state2_pc_token_removed:    {text: "[/TIME/]",           pc: true,  time: true}   # pc/time 둘 다 ON 유지!
          state3_all_text_cleared:    {text: "",                   pc: true,  time: true}   # pc/time 둘 다 ON 유지!
        applies_to: "화면 워터마크 + 출력 워터마크 (Chrome MCP 직접 검증으로 동일 패턴 확인 2026-05-29)"
        severity: "warn — 데이터 불일치 잠재 (체크박스 ↔ text 어긋남)"
        user_judgment_2026_05_29: "이슈 맞음 — 체크박스로 만들어진 내용 지워도 체크박스 눌려있음"
        save_behavior: "저장 시 text 우선 (체크박스 상태 무시). 재진입 시 text 토큰 기준 체크박스 재계산."
        category: "단방향 sync — UI 일관성 결함"

  known_bugs_origin_protect:
    description: "ux_bug 결함 후보 — sc3 에서 warn 또는 fail 로 노출"
    items:
      - id: "watermark_token_one_way_sync"
        symptom: |
          체크박스(PC 정보 / 현재 시각)로 자동 삽입된 워터마크 토큰을 텍스트에서
          수동 삭제해도 체크박스 상태가 자동 해제되지 않음 (단방향 sync).
          sync 방향: checkbox → text ✓ / text → checkbox ✗
        severity: "warn — 데이터 불일치 잠재 (체크박스 ↔ text 어긋남)"
        verified_by: "Chrome MCP 직접 검증 2026-05-28 / 사용자 재확정 2026-05-29"
        user_judgment_2026_05_29: "이슈 맞음 — 체크박스로 만들어진 내용 지워도 체크박스 눌려있음"
        save_behavior: "저장 시 text 우선 (체크박스 상태 무시). 재진입 시 text 토큰 기준 체크박스 재계산."
        save_recovery_verified: true
        related: "watermark_token_auto_insert.manual_token_deletion / save_and_reopen_sync"
        impact: "저장으로 결과 일관성은 복구되나, 편집 중 UX 혼란 + 사용자가 텍스트만 수정하면 상태 어긋남."

      - id: "text_length_no_client_guard_generic_server_error"
        symptom: |
          모달 안 13개 text/textarea 입력 전수 점검 결과 — 전부 maxlength=null + ng-maxlength=null +
          ng-pattern=null. 클라이언트 길이 제약 zero. 무제한 입력 허용 후 저장 시도 시 서버가
          "서버에서 오류가 발생 하였습니다." generic 에러로 거부. 사용자에게 "왜 거부됐는지 /
          몇 자가 한계인지" 정보 전혀 노출 안 됨.
        full_inventory:   # Chrome MCP 직접 dump 2026-05-29 — 13개 input/textarea 전부 가드 부재
          - {id: "originProtectPolicyName",   area: "정책 이름",              tag: "input"}
          - {id: "driveLetter",               area: "드라이브 문자",          tag: "input",
             note: "런타임 silent 마스킹 있음 (영문 1자) — 길이 제약은 별도 아님"}
          - {id: "driveLabel",                area: "드라이브 레이블",        tag: "input"}
          - {id: "originProtectDriveQuota",   area: "드라이브 용량 (Quota)",  tag: "input",
             note: "런타임 silent 마스킹 있음 (숫자만) — 길이 제약 별도 검증 필요"}
          - {id: "watchFileExtensions",       area: "확장자 입력",            tag: "input",
             note: "list 입력 — 1건 등록 단위 길이 별도"}
          - {id: "watchExceptFolders",        area: "예외 폴더 입력",         tag: "input",
             note: "list 입력 — 1건 등록 단위 길이 별도"}
          - {id: "allowProcessShutdownText",  area: "허용 프로세스 종료 알림", tag: "textarea"}
          - {id: "screenWaterMarkText",       area: "화면 워터마크 텍스트",    tag: "input"}
          - {id: "screenWaterMarkOpacity",    area: "화면 워터마크 투명도",    tag: "input",
             note: "런타임 0~100 cap — 길이 제약 의미 없음"}
          - {id: "screenWaterMarkDegree",     area: "화면 워터마크 각도",      tag: "input",
             note: "런타임 0~360 cap — 길이 제약 의미 없음"}
          - {id: "printWaterMarkText",        area: "출력 워터마크 텍스트",    tag: "input"}
          - {id: "printWaterMarkOpacity",     area: "출력 워터마크 투명도",    tag: "input",
             note: "런타임 0~100 cap"}
          - {id: "printWaterMarkDegree",      area: "출력 워터마크 각도",      tag: "input",
             note: "런타임 0~360 cap"}
        verified_save_rejection:    # 3 필드 3000자 + 저장 → server error 재현 (Chrome MCP 2026-05-29)
          - {id: "allowProcessShutdownText", size: 3000, result: "서버에서 오류가 발생 하였습니다."}
          - {id: "screenWaterMarkText",      size: 3000, result: "서버에서 오류가 발생 하였습니다."}
          - {id: "printWaterMarkText",       size: 3000, result: "서버에서 오류가 발생 하였습니다."}
        unverified_save_rejection:  # 가드 부재 확정 / save reject 미검증
          - {id: "originProtectPolicyName", note: "사용자 지적 2026-05-29 — 검증 필요"}
          - {id: "driveLabel",              note: "가드 부재만 확정 — save reject 미검증"}
        threshold_unknown: "정확한 한계값(예: 1000? 2000?) 미측정 — 별도 binary search 필요"
        severity: "warn — UX 결함 (클라 가드 부재 + 서버 generic error 메시지)"
        expected_behavior: |
          (1) 클라 maxlength 또는 입력 시점 길이 제한 메시지 ("최대 N자 입력 가능"),
          또는 (2) 서버 응답 시 사유 명시 ("정책 이름은 최대 N자입니다") 중 하나는 필요.
        category: "client validation 부재 + server error message 일반화"

      - id: "edit_name_duplicate_not_blocked"
        severity: "🔴 HIGH — 데이터 무결성 영향 (같은 이름 정책 2건 공존 시 식별 모호)"
        user_judgment_2026_05_29: "예상 동작이 아닌 결함 — 같은 이름으로 저장됨. ADD 차단 / EDIT 차단 부재 = 일관성 결함."
        symptom: |
          EDIT 모달에서 정책 이름을 기존 다른 정책 이름으로 변경 + 저장 시도 → 차단 메시지
          노출 없이 "저장 하였습니다" 성공 → list 에 같은 이름 정책 2건 공존 상태 발생.
          ADD 에서는 sc3b 가 "정책 이름이 이미 등록되어 있습니다." 차단 확인됨 — EDIT 에서만 차단 X.
        verified_by: "Chrome MCP 직접 재현 2026-05-29 — [AUTO]_sc3g_normal_save → [AUTO]_sc3b_dup 으로 rename 시도 → 저장 성공 + list 에 sc3b_dup 2건 노출"
        ux_impact: "사용자가 모르고 중복 이름 만들면 list 에서 어느 정책 클릭/수정/삭제할지 식별 불가"
        expected_behavior: "EDIT 저장 시점에도 본인 row 제외 후 이름 중복 검증 — sc3b 메시지와 동일 차단 필요"
        related_to: "domain_behaviors.drive_letter_duplication (도메인 의도) vs 이름 중복 (반드시 차단해야 함)"

      - id: "edit_modal_title_not_updated"
        severity: "ux_bug — 사용자 혼란 (EDIT 모달인데 제목 '정책 추가')"
        symptom: |
          EDIT 모달 진입 시 modal title 이 '정책 추가' 그대로 — 'ADD' 와 동일.
          하단 버튼 라벨은 '수정' 으로 정상 표시. modal 컨테이너 (#addItemModal) 가 ADD/EDIT
          공통 재사용이라 title 만 dynamic 업데이트 누락된 것으로 보임.
        verified_by: "Chrome MCP 직접 확인 2026-05-29"
        expected_behavior: "EDIT 진입 시 title '정책 수정' 으로 변경"

      - id: "edit_required_validation_silent_skip_with_false_success"
        severity: "🟡 MEDIUM — 거짓 성공 메시지 (실 데이터는 silent revert 로 안전)"
        user_judgment_2026_05_29: "결함 맞음 — '이름 빈값 넣으면 오류를 출력하는 게 아니라 기존 내용 출력' (= 차단 메시지 부재 + 기존값 silent revert)"
        symptom: |
          EDIT 모달에서 필수 필드 (정책 이름 / driveLetter / driveLabel) 빈값 + 저장 →
          "저장 하였습니다" 메시지 + 모달 자동 닫힘. 다시 EDIT 진입 시 기존값 그대로 유지 =
          실제 저장 안 됨. 사용자가 변경했다고 생각하는데 silent revert. UX 일관성 결함 +
          ADD sc3a "필수 입력 차단 메시지" 와 동작 불일치 (ADD 차단 vs EDIT 거짓 성공).
        verified_by: "Chrome MCP 직접 재현 2026-05-29 — driveLetter='' + 저장 → '저장 하였습니다' + 모달 닫힘 → 재 EDIT 진입 시 driveLetter='Y' 그대로"
        verified_fields:
          - {id: "originProtectPolicyName", behavior: "silent revert (사용자 재확정 2026-05-29 — '오류를 출력해야 하는데 기존 내용 출력')"}
          - {id: "driveLetter", behavior: "silent revert to 'Y' (data 안전)"}
          - {id: "driveLabel",  behavior: "silent revert to 'Sc3gLabel' (data 안전)"}
        excluded_fields:
          - {id: "originProtectDriveQuota", reason: "다른 패턴 — Quota 는 빈값→0 silent 변환 실제 저장됨 (data 영향). 별도 known_bug: edit_quota_empty_silent_zero_conversion"}
        unverified_fields:
          - "CSU (controlSuiteId) — 동일 silent revert 패턴 추정"
        expected_behavior: "ADD sc3a 와 동일 — '드라이브 문자를 입력해 주세요.' 차단 메시지 + 모달 안 닫힘"
        related_to: "edit_4_3_pattern_missing — 4-3 위반 패턴 (검증 실패 시 모달 재오픈) 부재와 같은 카테고리"

      - id: "edit_4_3_pattern_missing"
        severity: "🟡 MEDIUM — UX 결함 (검증 실패 후 모달 닫힘)"
        symptom: |
          ADD 모달은 필수 입력 검증 실패 시 모달 안 닫힘 (사용자 수정 기회 제공).
          EDIT 모달은 driveLetter 빈값 + 저장 → '저장 하였습니다' 거짓 메시지 + 모달 자동 닫힘.
          사용자가 검증 실패를 인지 못 함 + 다시 정책 선택해서 EDIT 재진입 해야 함.
        verified_by: "Chrome MCP 직접 재현 2026-05-29 — driveLetter 빈값 후 모달 자동 닫힘 확인"
        expected_behavior: "ADD sc3a 의 4-3 패턴 동일 — 검증 실패 시 모달 안 닫힘 + 입력값 보존"
        related_to: "edit_required_validation_silent_skip_with_false_success"

      - id: "edit_quota_empty_silent_zero_conversion"
        severity: "🔴 HIGH — 데이터 무결성 영향 (사용자 의도 없이 Quota 값 변경)"
        symptom: |
          EDIT 모달에서 Quota (originProtectDriveQuota) 빈값 + 저장 → "저장 하였습니다" +
          모달 닫힘. 재 진입 시 Quota='0' 으로 실제 저장됨. ADD sc3a 의 "원본보호 드라이브
          용량을 입력해 주세요." 차단 메시지 부재. 사용자 의도 없이 200 → 0 으로 변경됨.
          다른 필드 (driveLetter / driveLabel) 의 silent revert 패턴 (기존값 유지) 과 다름 —
          Quota 만 silent zero 변환 = 패턴 일관성도 결함.
        verified_by: "Chrome MCP 직접 재현 2026-05-29 — Quota='' 저장 → 재 진입 시 '0' 확인"
        before_value: "200 (sc3g 저장값)"
        after_value: "0 (silent 변환 저장)"
        expected_behavior: "ADD sc3a 와 동일 — '원본보호 드라이브 용량을 입력해 주세요.' 차단 메시지 + 모달 안 닫힘"
        related_to: "edit_required_validation_silent_skip (driveLetter/Label 의 silent revert) — Quota 는 다른 동작 (zero 변환 + 실 저장)"

      - id: "csu_picker_search_returns_zero_with_exact_keyword"
        severity: "ux_bug — CSU picker 검색 결함 (정확한 keyword 입력해도 검색결과 0)"
        symptom: |
          CSU picker 검색 input 에 정확한 '[AUTO_KEEP]_sc5_step1' 입력 + 검색 버튼 →
          "검색된 내용이 없습니다." 결과 0건. 실제 정책은 존재 (적용중 텍스트로 노출됨).
          AngularJS ng-change watch 가 JS dispatch event 만으로 미발화 추정 또는 검색
          keyword 의 '[' ']' 특수문자 escape 결함.
        affected_scenario: "sc3g (정상 저장 + CSU picker) — 검색 fail → '선택된 항목 없습니다' 알림 + 정책 저장 실패"
        verified_by: "사용자 보고서 캡처 2026-05-29 — picker 안 검색 input 에 keyword 보이지만 결과 0"
        workaround: "_csu_search_and_select 가 검색 0건 시 input 비우고 전체 list 첫 행 fallback (코드 적용 2026-05-29)"
        expected_behavior: "검색 input 변경 시 ng-change 즉시 발화 + partial match 결과 반환"

      - id: "edit_csu_picker_radio_unchecked_on_reopen"
        severity: "minor — UX 일관성 결함 (텍스트로만 알림, radio 미체크)"
        symptom: |
          EDIT 모달 진입 후 CSU '설정' 버튼 click → picker 모달 진입 시:
            상단 텍스트: '적용중인 제어 스위트 : [AUTO_KEEP]_sc5_step1' ← 정상 표시
            radio 20개 (page 1): 전부 unchecked ← 현재 선택 항목 radio 로 표시 안 됨
          사용자가 picker 안에서 현재 선택 직관적으로 인지 어려움.
        verified_by: "Chrome MCP 직접 확인 2026-05-29 — checked_count=0/20"
        expected_behavior: "picker 진입 시 현재 controlSuiteId 와 일치하는 radio 자동 checked"
        domain_intent_check: "회색 영역 — '새로 선택할 항목' 만 radio 로 표시하는 도메인 의도일 가능성. 사용자 결정 필요."

      - id: "edit_watermark_numeric_default_inconsistent"
        severity: "minor — ADD/EDIT 표시값 불일치 (저장 동작에는 영향 없음)"
        symptom: |
          워터마크 투명도/각도 4필드 (screen/print × opacity/degree) 의 default 표시:
            ADD 신규 모달: '' (빈)
            EDIT 진입 시: '0' (저장 시 ''→0 변환 후 load)
          저장 결과는 동일하지만 사용자 입장에서 ADD/EDIT default 가 다른 게 일관성 결함.
        verified_by: "Chrome MCP 직접 확인 2026-05-29 — [AUTO]_sc3g_normal_save (sc3g 가 명시 안 함) EDIT 진입 시 4 필드 모두 '0'"
        expected_behavior: "ADD/EDIT default 통일 — 둘 다 '' 또는 둘 다 '0'"

      - id: "toggle_off_tag_delete_still_clickable"
        symptom: |
          파일 감시기능 토글 (isWatchFileExtension) OFF 상태에서 input/추가 버튼/헤더
          체크박스는 disabled 됐지만, 이미 등록된 확장자/예외폴더 tag 의 [X] 삭제 버튼은
          **여전히 클릭 가능** — tag 가 실제로 삭제됨. 종속 disabled 불완전.
        verified_by: "Chrome MCP 직접 재현 2026-05-29 — disabled_attr=null, pointer='auto', click → tags_before=2 → tags_after=1 (실제 삭제 확인)"
        selector: "i.extentionDeleteBtn"   # 두 list (확장자/예외폴더) 공통
        affected_lists:
          - {section: "감시할 파일 확장자 리스트", container_id: "watchFileExtensionList"}
          - {section: "감시할 예외 폴더 리스트",   container_id: "watchExceptFolderList"}
        severity: "ux_bug — 종속 disabled 불완전 (입력 차단 vs 삭제 허용 일관성 결함)"
        expected_behavior: "토글 OFF 시 tag 삭제 버튼도 disabled (입력/등록/삭제 전부 차단)"

      - id: "watch_except_folder_empty_wrong_message"
        symptom: |
          예외 폴더 input (watchExceptFolders) 빈값 + 추가 버튼 클릭 시
          '확장자를 입력하세요' 메시지 노출 — 예외폴더 영역인데 확장자 메시지.
        severity: "ux_bug — 메시지 영역 ≠ UI 영역 불일치"
        category: "control_suite URL→폴더 typo 결함과 동일 카테고리"
        verified_by: "Chrome MCP + 사용자 스크린샷 직접 확인 (2회 격리) 2026-05-28"
        expected_correct_message: "(추정) '예외 폴더를 입력하세요' 또는 '폴더 경로를 입력해 주세요'"

  required_fields:
    description: |
      ADD 모달 필수 필드 — 진짜 마커는 라벨 안 * 가 아니라 별도 <span class="star">*</span>.
      Chrome MCP 직접 검증 2026-05-28: span.star 정확히 3개 존재 (사용자 스크린샷 3개 별표와 일치).
      라벨 안에 잡힌 일부 * 는 findLabel 매칭 노이즈 — 신뢰도 낮음.
    required_marker_selector: "span.star"
    required_marker_count: 3
    items:
      - {section: "정책 이름",            target: "input#originProtectPolicyName", required: true,  note: "단일 필드"}
      - {section: "원본보호 드라이브 설정", target: "묶음 (driveLetter/driveLabel/originProtectDriveQuota)", required: true,
         note: "섹션 헤더 * — 묶음 단위 필수. 어디까지 빈값 시 차단되는지 분리 검증 pending"}
      - {section: "제어 스위트 선택",      target: "span#controlSuiteId (CSU picker 결과)", required: true,
         note: "picker (selectCommonPolicyItemModal) 로 선택"}
    severity: "must_test"
    verified_by: "Chrome MCP 직접 검증 2026-05-28 (span.star 3개 확정)"

  default_values:
    description: |
      ADD 모달 close → re-open 시 default 초기화 — Chrome MCP 직접 검증 2026-05-28.
      ⚠ 사용자 지적 (2026-05-28) — 이전 'all_checkboxes: false' 추정은 부정확:
        Bootstrap 'switch' 패턴 hidden checkbox 4개 = default ON.
        일반 visible checkbox 9개 = default OFF.
        구분: parent_class='switch' 인 hidden input 이 default ON.
    verified_by: "Chrome MCP 직접 검증 2026-05-28 (사용자 통찰 후 재검증 — 13 checkbox 일괄 dump)"
    text_inputs:
      all_empty: true
      note: "모든 text/textarea = ''"
    checkbox_defaults:
      hidden_switch_default_on:   # parent.class='switch', cb.offsetParent===null
        - isWatchFileExtension     # 파일 감시 기능
        - isAllowProcessShutdownText  # 프로세스 종료 알림
        - isScreenWaterMark        # 화면 워터마크
        - isPrintWaterMark         # 출력 워터마크
      general_checkbox_default_off:
        - isAllowProcess          # 허용 프로세스 사용
        - isExceptProcess         # 예외처리 프로세스 사용
        - isBlockProcess          # 실행차단 프로세스 사용
        - isWatchFileHeader       # 헤더 체크
        - isScreenWaterMarkPcInfo
        - isScreenWaterMarkCurrentTime
        - isPrintWaterMarkPcInfo
        - isPrintWaterMarkCurrentTime
        - isSecondTakeout         # 2차 반출
    reset_behavior: "close → re-open 시 위 default 상태로 일관 리셋 (메모리 잔존 없음)"

  maxlength_inventory:
    description: "ADD 모달 모든 input 의 DOM maxlength 속성 = null. 서버 측 검증 의존."
    verified_by: "Chrome MCP 직접 검증 2026-05-28"
    maxlen_null_inputs: "all (34 inputs visible+hidden)"
    note: "control_suite uploadLimitSize 12자 같은 DOM 한도 없음 → 길이 한도는 서버 응답으로만 확인 가능"

  drive_letter_format:
    description: |
      driveLetter input — DOM 단계 silent 마스킹. 메시지 없이 값 자동 정정.
    field: "driveLetter"
    selector: "input#driveLetter"
    masking_rules:   # Chrome MCP 직접 검증 2026-05-28 (입력→DOM value 결과)
      valid:
        - {input: "Z",       result: "Z",  note: "대문자 1자 — 그대로 유지"}
        - {input: "z",       result: "Z",  note: "소문자 → 대문자 자동 변환"}
        - {input: "ABCDEF",  result: "A",  note: "다중자 → 첫 1자만 유지 + 대문자"}
      invalid_stripped_to_empty:
        - {input: "5",       result: "",   note: "숫자 → 전부 제거"}
        - {input: "@@@",     result: "",   note: "특수문자 → 전부 제거"}
        - {input: "가나",    result: "",   note: "한글 → 전부 제거"}
      verified_rules: "알파벳만 허용, 1자 한도, 대문자 자동 변환, 그 외 silent 제거"
    expected_invalid_message: "드라이브 문자는 영문자만 입력할 수 있습니다."   # 정정 2026-05-28 — alert + value reset 동시
    modal_id: "__globalMessageModal"
    severity: "must_test"
    verified_by: "Chrome MCP 직접 검증 2026-05-28 (재검증 — 이전 'silent 마스킹' 추정 정정)"
    note: "value 가 '' 으로 reset 되는 동시에 alert 노출 — 둘 다 발화 (silent 아님)"

  csu_select_flow:
    description: |
      '제어 스위트 선택' 버튼 클릭 → 별도 picker 모달 열림 (#selectCommonPolicyItemModal).
      picker 흐름:
        1. 검색 input (placeholder: '제어 스위트 이름') 에 [AUTO_KEEP]_sc5_step1 입력 + 검색.
        2. 매칭 행의 radio (name='selectTemplate') 선택.
        3. .btn-primary (확인) 클릭 → picker 닫힘.
        4. addItemModal 의 span#controlSuiteId 에 id 바인딩.
      KEEP 부재 시 fallback: 검색 안 하고 첫 행 radio 선택.
    csu_select_btn: "div#addItemModal button.addBtn.smallBtn.addTemplate"
    csu_id_span: "span#controlSuiteId"
    # picker 모달 구조 (Chrome MCP 직접 확정 2026-05-28)
    picker:
      modal: "div#selectCommonPolicyItemModal"
      modal_open: "div#selectCommonPolicyItemModal.modal-wrap.in"
      search_input: "div#selectCommonPolicyItemModal input#searchText"   # placeholder: "제어 스위트 이름"
      search_button_class: "searchBtn"
      table_container: "div#selectCommonPolicyItemModal #controlSuiteList"
      row_selector: "div#selectCommonPolicyItemModal table tbody tr"
      radio_selector: "div#selectCommonPolicyItemModal input[type='radio'][name='selectTemplate']"
      mode: "single (radio)"
      confirm_btn: "div#selectCommonPolicyItemModal .btn-primary"
      cancel_btn: "div#selectCommonPolicyItemModal .btn-default"
      close_btn: "div#selectCommonPolicyItemModal .close"
      row_count_at_scan: 20   # 2026-05-28 스캔 시점
    keep_artifact: "[AUTO_KEEP]_sc5_step1"
    fallback: "검색 없이 picker 첫 행 radio"
    severity: "must_test"
    verified_by: "Chrome MCP 직접 검증 2026-05-28 (picker 내부 구조 + 모든 selector 확정)"

