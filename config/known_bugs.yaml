# 확인된 제품 버그 목록
# UIScanner가 이 항목과 매칭되면 status = "known_bug" (fail 카운트 제외)
#
# 추가 형식:
#   - selector:      "CSS selector"  ← 정확히 일치해야 함
#     pattern:       "toggle_checkbox | tag_input | ..."
#     test_name:     "toggle_dependent_fields | ..."  ← scanner 내부 test_name과 매칭
#     reason:        "버그 설명"
#     reported_date: "YYYY-MM-DD"
#     ticket:        "JIRA-123"  ← 없으면 빈 문자열
#     page_id:       "page_id 문자열"
#
# 버그 수정 확인: selector + test_name 조합으로 추적
# 수정 확인되면 이 목록에서 제거한다

- selector:      "input#isAuthorizationPassword"
  pattern:       "toggle_checkbox"
  test_name:     "toggle_dependent_fields"
  reason:        "토글 OFF 상태에서도 종속 필드(authorizationPassword, authorizationPasswordConfirm)가 활성화 유지됨"
  reported_date: "2026-03-12"
  ticket:        ""
  page_id:       "ransom_detect_policy"

- selector:      "button[modify-btn]"
  pattern:       "required_submit"
  test_name:     "edit_required_submit"
  reason:        "RDP 정책 수정 모달은 정책 이름을 비워도 저장 가능 (EDIT 모달에서 required 필드 검증 없음)"
  reported_date: "2026-03-25"
  ticket:        ""
  page_id:       "rdp_policy"

- selector:      "[name=isConnect]"
  pattern:       "radio_group"
  test_name:     "radio_require_default"
  reason:        "연결 설정(차단/허용) 이진 라디오에 초기값 없음 — 선택 없이 저장 시 연결 차단으로 암묵 적용, 입력한 허용 설정이 무의미해지는 휴먼에러 유발"
  reported_date: "2026-03-25"
  ticket:        ""
  page_id:       "rdp_policy"

- selector:      "[name=isAlwaysConnect]"
  pattern:       "radio_group"
  test_name:     "radio_require_default"
  reason:        "연결 시간 제한(항상연결/시간설정) 이진 라디오에 초기값 없음 — 연결 허용 후 시간 설정 미선택 시 암묵적 동작 발생, 시간/요일 설정이 무의미해지는 휴먼에러 유발"
  reported_date: "2026-03-25"
  ticket:        ""
  page_id:       "rdp_policy"
