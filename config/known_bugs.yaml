  reported_date: "2026-03-25"
  ticket:        ""
  page_id:       "rdp_policy"
  status:        "open"

- selector:      "[name=isAlwaysConnect]"
  pattern:       "radio_group"
  test_name:     "radio_require_default"
  reason:        "연결 시간 제한(항상연결/시간설정) 이진 라디오에 초기값 없음 — 연결 허용 후 시간 설정 미선택 시 암묵적 동작 발생, 시간/요일 설정이 무의미해지는 휴먼에러 유발"
  reported_date: "2026-03-25"
  ticket:        ""
  page_id:       "rdp_policy"
  status:        "open"

- selector:      "[name=behaviorDetectLevelType]"
  pattern:       "radio_group"
  test_name:     "radio_require_default"
  reason:        "행위기반 탐지등급 라디오 초기값 없음 — 선택 없이 저장 시 암묵적으로 '낮음(LOW)' 적용, 사용자가 인지하지 못한 채 정책 등급이 설정되는 휴먼에러 유발"
  reported_date: "2026-03-25"
  ticket:        ""
  page_id:       "ransom_detect_policy"
  status:        "open"

