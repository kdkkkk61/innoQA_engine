# 확인된 제품 버그 목록
# UIScanner가 이 항목과 매칭되면 status = "known_bug" (fail 카운트 제외, 리포트에는 표시)
#
# [status 값]
#   open      (기본값) → known_bug 처리. 추적 중, 수정 미완료.
#   fixed               → known_bug 해제. 여전히 실패하면 fail (회귀 감지).
#   wont_fix            → known_bug 처리. 의도된 동작으로 확정.
#
# [추가 형식]
#   - selector:      "CSS selector"          ← 정확히 일치해야 함
#     pattern:       "toggle_checkbox | ..."
#     test_name:     "toggle_dependent_fields | ..."
#     reason:        "버그 설명"
#     reported_date: "YYYY-MM-DD"
#     ticket:        "JIRA-123"              ← 없으면 빈 문자열
#     page_id:       "page_id 문자열"
#     status:        "open"                  ← open / fixed / wont_fix
#
# [운영 원칙]
#   - 수정 완료 시: status → "fixed" (목록에서 제거 금지 — 회귀 감지용으로 유지)
#   - 의도된 동작 확정 시: status → "wont_fix"
#   - 테스트에서 known_bug는 fail 카운트 제외되지만 리포트에 ⚠️ 로 항상 표시됨

- selector:      "input#isAuthorizationPassword"
  pattern:       "toggle_checkbox"
  test_name:     "toggle_dependent_fields"
  reason:        "토글 OFF 상태에서도 종속 필드(authorizationPassword, authorizationPasswordConfirm)가 활성화 유지됨"
  reported_date: "2026-03-12"
  ticket:        ""
  page_id:       "ransom_detect_policy"
  status:        "open"

- selector:      "button[modify-btn]"
  pattern:       "required_submit"
  test_name:     "edit_required_submit"
  reason:        "RDP 정책 EDIT 모달 — 정책 이름 비운 채 저장 시 경고 없이 모달 닫힘 (클라이언트 측 필수 필드 검증 누락). 실제 저장값은 시나리오 4-3에서 확인."
  reported_date: "2026-03-25"
  ticket:        ""
  page_id:       "rdp_policy"
  status:        "open"

- selector:      "[name=isConnect]"
