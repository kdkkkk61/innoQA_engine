# ransom_detect_policy Phase 4 테스트 프로파일
# Chrome MCP 직접 탐색으로 정의 (2026-04-02)
#
# 목적: 값 전환이 정확히 저장되는지 검증 (UI 요소 동작은 Phase 1-3에서 완료)
#
# 흐름:
#   1. create: 전체 ON + 최대값으로 정책 생성
#   2. verify_created: 생성 직후 수정 모달에서 전체 ON 확인
#   3. modify_to_off: 수정 모달에서 전체 OFF + 최솟값으로 변경 저장
#   4. verify_modified: 재오픈 후 전체 OFF 확인
#
# verify 값 형식:
#   "checked"   → el.is_checked() == True
#   "unchecked" → el.is_checked() == False
#   그 외 문자열  → el.input_value() == 해당값

page_id: ransom_detect_policy

# ── 1. 생성: 전체 ON + 최대값 ──────────────────────────────────────────────────
create:
  policy_name: "[AUTO]_p4"

  actions:
    - type:     tag_add
      input:    "input#protectExtension"
      btn:      "button#extensionAttachBtn"
      value:    "p4"

    - type:     checkbox_set
      selector: "input#isSoftwareCertificate"
      value:    true

    - type:     radio_set
      selector: "input#detectLevelTypeHigh"

    - type:     checkbox_set
      selector: "input#isMssqlRemoteBlock"
      value:    true

    - type:     checkbox_set
      selector: "input#isMsiFileTrustCheck"
      value:    true

    - type:     checkbox_set
      selector: "input#isExceptDetect"
      value:    true
    - type:     checkbox_set
      selector: "input#isFilePathExcept"
      value:    true
    - type:     checkbox_set
      selector: "input#isProcessPathExcept"
      value:    true
    - type:     checkbox_set
      selector: "input#isDigitalSignExcept"
      value:    true

    - type:     checkbox_set
      selector: "input#isRollbackUse"
      value:    true
    - type:     text_set
      selector: "input#rollbackFileMaxSize"
      value:    "99999"
    - type:     text_set
      selector: "input#blockRollbackWaitMinute"
      value:    "999"

    - type:     checkbox_set
      selector: "input#isBlockProcessIsolation"
      value:    true
    - type:     checkbox_set
      selector: "input#isRemoveIsolatedProcess"
      value:    true

    - type:     checkbox_set
      selector: "input#isExceptProcessCollectPeriod"
      value:    true
    - type:     text_set
      selector: "input#exceptProcessCollectPeriod"
      value:    "15"

    - type:     checkbox_set
      selector: "input#isPolicyUpdateIntervalMinute"
      value:    true
    - type:     text_set
      selector: "input#policyUpdateIntervalMinute"
      value:    "999"

    - type:     checkbox_set
      selector: "input#isHideTrayIcon"
      value:    true

# ── 2. 생성 후 검증: 전체 ON 확인 ─────────────────────────────────────────────
verify_created:
  "input#isSoftwareCertificate":          "checked"
  "input#detectLevelTypeHigh":            "checked"
  "input#isMssqlRemoteBlock":             "checked"
  "input#isMsiFileTrustCheck":            "checked"
  "input#isExceptDetect":                 "checked"
  "input#isFilePathExcept":               "checked"
  "input#isProcessPathExcept":            "checked"
  "input#isDigitalSignExcept":            "checked"
  "input#isRollbackUse":                  "checked"
  "input#rollbackFileMaxSize":            "99999"
  "input#blockRollbackWaitMinute":        "999"
  "input#isBlockProcessIsolation":        "checked"
  "input#isRemoveIsolatedProcess":        "checked"
  "input#isExceptProcessCollectPeriod":   "checked"
  "input#exceptProcessCollectPeriod":     "15"
  "input#isPolicyUpdateIntervalMinute":   "checked"
  "input#policyUpdateIntervalMinute":     "999"
  "input#isHideTrayIcon":                 "checked"

# ── 3. 수정: 전체 OFF + 최솟값으로 전환 ────────────────────────────────────────
modify_to_off:
  actions:
    - type:     radio_set
      selector: "input#detectLevelTypeNone"

    - type:     checkbox_set
      selector: "input#isSoftwareCertificate"
      value:    false
    - type:     checkbox_set
      selector: "input#isMssqlRemoteBlock"
      value:    false
    - type:     checkbox_set
      selector: "input#isMsiFileTrustCheck"
      value:    false
    - type:     checkbox_set
      selector: "input#isExceptDetect"
      value:    false
    - type:     checkbox_set
      selector: "input#isRollbackUse"
      value:    false
    - type:     checkbox_set
      selector: "input#isBlockProcessIsolation"
      value:    false
    - type:     checkbox_set
      selector: "input#isExceptProcessCollectPeriod"
      value:    false
    - type:     checkbox_set
      selector: "input#isPolicyUpdateIntervalMinute"
      value:    false
    - type:     checkbox_set
      selector: "input#isHideTrayIcon"
      value:    false
    - type:     checkbox_set
      selector: "input#isAuthorizationPassword"
      value:    false

# ── 4. 수정 후 검증: 전체 OFF 확인 ────────────────────────────────────────────
verify_modified:
  "input#isSoftwareCertificate":          "unchecked"
  "input#detectLevelTypeNone":            "checked"
  "input#isMssqlRemoteBlock":             "unchecked"
  "input#isMsiFileTrustCheck":            "unchecked"
  "input#isExceptDetect":                 "unchecked"
  "input#isRollbackUse":                  "unchecked"
  "input#isBlockProcessIsolation":        "unchecked"
  "input#isExceptProcessCollectPeriod":   "unchecked"
  "input#isPolicyUpdateIntervalMinute":   "unchecked"
  "input#isHideTrayIcon":                 "unchecked"
  "input#isAuthorizationPassword":        "unchecked"
