[pytest]
norecursedirs = tests/_legacy tests/_legacy_v2
; 실행 끝에 느린 테스트 상위 15개 소요 시간 출력 — 시간 최적화 대상 식별용 (runs/*.log 에 함께 저장됨)
addopts = --durations=15 --durations-min=1.0
markers =
    ui_scan: UI 자동화 스캔 테스트 (모든 scan_mode 포함)
    ransom_cruncher: RansomCruncher 제품군 테스트
    inno_mark: innoMark 제품군 테스트
    unclassified: 모듈 미분류 페이지
    npouch: nPouch 제품군 테스트 (운용 프로세스/태그/제어 스위트/원본보호/엔파우치 정책)
    secure_zone: SecureZone 제품군 테스트 (접근제어 정책)
